<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>力与运动实验室 · 墨鱼工坊</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand"><span class="brand-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 15 9l7 3-7 3-3 7-3-7-7-3 7-3 3-7Z"/></svg></span><span>MOOYU.FUN</span></div>
      <div class="crumb"><span>交互课件</span><span>/</span><strong>力与运动实验室</strong></div>
      <div class="toolbar">
        <div class="stage-badges" aria-label="运行方式"><span class="stage-badge">固定版本</span><span class="stage-badge">跨域隔离运行</span></div>
        <div class="status" data-status data-state="connecting"><span>正在建立安全连接</span></div>
        <div class="language-switch" aria-label="课件语言"><button type="button" data-command="host.setLocale" data-locale="zh-CN" data-value='{"locale":"zh-CN"}' aria-pressed="true">中文</button><button type="button" data-command="host.setLocale" data-locale="en" data-value='{"locale":"en"}' aria-pressed="false">EN</button></div>
      </div>
    </header>
    <section class="stage" aria-label="课件运行区"><div class="frame-shell"><iframe data-courseware-frame src="__RUNTIME_ORIGIN__/runtime/causal-simulation" title="力与运动实验室" loading="eager" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen" sandbox="allow-scripts allow-same-origin allow-pointer-lock"></iframe></div></section>
    <footer class="footer-card">
      <div class="course-meta"><span class="course-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15h12m0 0-3-3m3 3-3 3M6 7h3v4H6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span><div class="course-copy"><strong>力与运动实验室</strong><span>控制变量并观察运动变化，从实验中理解 a=F/m。</span></div></div>
      <details class="diagnostics"><summary>开发者诊断 <span class="event-count" data-event-count>0</span></summary><div class="diagnostic-popover"><div class="diagnostic-head"><span>Embed v2 · 状态与脱敏事件</span><div class="diagnostic-actions"><button type="button" data-command="host.setExperience" data-value='{"modeId":"textbook"}'>教材</button><button type="button" data-command="host.setExperience" data-value='{"modeId":"sandbox"}'>自由</button><button type="button" data-command="host.setExperience" data-value='{"modeId":"delivery"}'>挑战</button><button type="button" data-state-action="export">导出状态</button><button type="button" data-state-action="restore">恢复状态</button><button type="button" data-command="host.pause">暂停</button><button type="button" data-command="host.resume">恢复</button><button type="button" class="clear-events" data-clear-events>清空</button></div></div><ol class="events" data-events></ol></div></details>
    </footer>
  </main>
  <script type="module" src="/reference-host.mjs"></script>
</body>
</html>
