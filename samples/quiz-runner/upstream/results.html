<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Results</title>
<style>
  :root {
    --bg: #fbf9f4; --panel: #ffffff; --border: #d8d2c4;
    --blue: #00468c; --blue-bg: #ebf2fa; --teal: #345e5c;
    --text: #2a2e34; --text-soft: #5b6471; --text-dim: #8a8f99;
    --good: #1f7a3f; --good-bg: #d9f0e1; --warn-bg: #fcf1d0; --warn: #a87a14;
    --gold: #b8860b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.5; }
  .wrap { max-width: 920px; margin: 0 auto; padding: 28px 20px 80px; }

  .head { text-align: center; margin-bottom: 24px; }
  .head h1 { color: var(--blue); margin: 0 0 4px; font-size: clamp(26px, 4vw, 40px); }
  .head .meta { color: var(--text-soft); font-size: 15px; }
  .head .winner { margin-top: 12px; font-size: 18px; color: var(--gold); font-weight: 700; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 20px 22px; margin-bottom: 18px; }
  .card h2 { color: var(--blue); margin: 0 0 12px; font-size: 20px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; padding: 8px 12px; color: var(--text-soft); font-weight: 600; border-bottom: 2px solid var(--blue); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--bg); }
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.rank { width: 48px; color: var(--text-soft); font-family: ui-monospace, Menlo, monospace; }
  td.total { color: var(--blue); font-weight: 700; }
  tr.first td { background: var(--blue-bg); }
  .footnote { color: var(--text-dim); font-size: 12px; margin-top: 10px; }
  .tbtag { color: var(--gold); font-size: 13px; font-weight: 600; }
  /* Phase subheader rows in the game log. */
  table.log tr.phase-row td { background: var(--blue); color: #fff; font-weight: 700; padding: 7px 12px; border-bottom: none; }
  table.log tr.phase-row:first-child td { border-radius: 0; }

  .loader { text-align: center; padding: 40px 20px; }
  .loader p { color: var(--text-soft); max-width: 560px; margin: 10px auto; }
  .btn { font: inherit; cursor: pointer; background: var(--blue); color: #fff; border: 1px solid var(--blue); padding: 10px 18px; border-radius: 6px; font-size: 15px; }
  .btn.ghost { background: var(--panel); color: var(--text); border-color: var(--border); }
  .msg { border-radius: 8px; padding: 10px 14px; margin: 10px auto; max-width: 560px; font-size: 14px; }
  .msg.error { background: #fbe1e4; border: 1px solid #a83242; color: #a83242; }
  .toolbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 14px; }
  @media print {
    .toolbar, .loader { display: none; }
    body { background: #fff; }
    .card { border: none; padding: 0; }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
"use strict";

/* ============================================================
   Quiz results viewer.
   Renders a read-only results page from a snapshot JSON saved by the runner
   (Settings → Save snapshot). Works two ways:
     - results.html?src=path/to/snapshot.json   (auto-loads; used by a website)
     - open the page and pick a snapshot file    (offline / ad-hoc sharing)
   Self-contained: no libraries, no build step.
   ============================================================ */

// ---- small DOM helper ----
function el(tag, attrs, kids) {
  const n = document.createElement(tag);
  for (const k of Object.keys(attrs || {})) {
    const v = attrs[k];
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n[k] = v;
    else if (v != null && v !== false) n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of [].concat(kids || [])) {
    if (c == null || c === false) continue;
    n.appendChild(typeof c === 'object' ? c : document.createTextNode(String(c)));
  }
  return n;
}

/* ============================================================
   Derive a results model from a snapshot (schema 1 or 2).
   ============================================================ */
function modelFromSnapshot(snap) {
  const state = snap.state || snap;            // tolerate a bare state object
  const teams = state.teams || [];
  // Categories: prefer the self-describing block (schema 2); else infer from the
  // picks keys (schema 1 / older snapshots) in the order they appear.
  let categories;
  if (snap.categories && snap.categories.length) {
    categories = snap.categories.map((c) => ({ name: c.name, shortName: c.shortName || c.name.slice(0, 2).toUpperCase() }));
  } else {
    categories = Object.keys(state.picks || {}).map((name) => ({ name, shortName: name.slice(0, 2).toUpperCase() }));
  }
  const catNames = categories.map((c) => c.name);
  const roundIndex = {};
  catNames.forEach((n, i) => { roundIndex[n] = i + 1; });

  const teamName = (num) => {
    if (num == null) return '—';
    const t = teams.find((x) => x.number === num);
    return t ? t.name : ('Team ' + num);
  };
  // Labelled with the seat number, e.g. "(1) Himalayan Hawks", for the log.
  const teamLabel = (num) => (num == null ? '—' : '(' + num + ') ' + teamName(num));

  // Per-team per-category totals from picks (mirrors the runner's roundScores).
  const byCat = {};
  teams.forEach((t) => { byCat[t.number] = {}; catNames.forEach((c) => { byCat[t.number][c] = 0; }); });
  catNames.forEach((c) => {
    const inCat = (state.picks && state.picks[c]) || {};
    Object.keys(inCat).forEach((d) => {
      const p = inCat[d];
      if (p.scoringTeam != null && byCat[p.scoringTeam]) byCat[p.scoringTeam][c] += (p.points || 0);
    });
  });

  // A tiebreaker decides the winner among tied teams but must NOT change the
  // points ranking of everyone else. So we rank purely on round points, show
  // tiebreaker points separately in parentheses, and annotate the winner.

  // The penalty phase covers (participants × penaltyPerTeam) questions.
  // penaltyPerTeam comes from the snapshot's event block (schema 2+); older
  // snapshots that omit it default to 3. Deriving the target here lets the
  // viewer re-classify picks whose stored phase field is stale — older runner
  // builds hardcoded the penalty boundary at qNum <= 3 regardless of how many
  // teams were in the tiebreaker.
  const tbParticipantsArr = state.tbParticipants || [];
  const tbPenaltyPerTeam = (snap.event && snap.event.penaltyPerTeam != null) ? snap.event.penaltyPerTeam : 3;
  const tbPenaltyTarget = tbParticipantsArr.length >= 2 ? tbParticipantsArr.length * tbPenaltyPerTeam : 0;

  const anyTb = (state.tbPicks && state.tbPicks.length > 0) || state.tbWinnerTeam != null;

  // Tiebreaker points scored, and which teams took part (those that opened a
  // tiebreaker question — i.e. the teams that were tied).
  const tbPointsBy = {};
  const tbPlayed = {};
  (state.tbPicks || []).forEach((p) => {
    if (p.originatorTeam != null) tbPlayed[p.originatorTeam] = true;
    if (p.scoringTeam != null) tbPointsBy[p.scoringTeam] = (tbPointsBy[p.scoringTeam] || 0) + (p.points || 0);
  });

  // Use the explicitly declared winner if set; otherwise infer from TB points
  // among confirmed participants. This handles snapshots saved before the
  // operator clicked "Declare winner" in the runner.
  let tbWinner = (state.tbWinnerTeam != null) ? state.tbWinnerTeam : null;
  if (tbWinner == null && tbParticipantsArr.length >= 2) {
    let bestTeam = null, bestPts = -1, uniqueLeader = true;
    tbParticipantsArr.forEach((num) => {
      const pts = tbPointsBy[num] || 0;
      if (pts > bestPts) { bestPts = pts; bestTeam = num; uniqueLeader = true; }
      else if (pts === bestPts) { uniqueLeader = false; }
    });
    if (uniqueLeader && bestTeam != null) tbWinner = bestTeam;
  }

  const standings = teams.map((t) => ({
    number: t.number, name: t.name, byCat: byCat[t.number],
    roundsTotal: catNames.reduce((s, c) => s + byCat[t.number][c], 0),
    tbPoints: tbPointsBy[t.number] || 0,
    tbPlayed: !!tbPlayed[t.number],
    isTbWinner: tbWinner != null && t.number === tbWinner
  })).sort((a, b) => (b.roundsTotal - a.roundsTotal)
    // Among teams tied on points, list the tiebreaker winner first.
    || (a.isTbWinner ? -1 : b.isTbWinner ? 1 : 0));
  // Standard competition ranking: teams level on points share a rank number.
  standings.forEach((r) => { r.rank = 1 + standings.filter((x) => x.roundsTotal > r.roundsTotal).length; });

  // Game log, grouped by phase (rendered as subheaders) and ordered WITHIN each
  // phase by the real play order (seq) the operator opened questions in — not by
  // question number. Falls back to question number for older snapshots.
  const orderKey = (p, fallback) => (p.seq != null ? p.seq : fallback);
  const groups = [];
  catNames.forEach((c) => {
    const inCat = (state.picks && state.picks[c]) || {};
    const draws = Object.keys(inCat).map((d) => parseInt(d, 10));
    if (!draws.length) return;
    const rows = draws.map((d) => {
      const p = inCat[d];
      return {
        order: orderKey(p, d), question: 'Question ' + d,
        opener: teamLabel(p.originatorTeam),
        scorer: p.scoringTeam != null ? teamLabel(p.scoringTeam) : null,
        passed: (p.passedTeams && p.passedTeams.length) || 0, points: p.points || 0
      };
    }).sort((a, b) => a.order - b.order);
    groups.push({ label: 'Round ' + roundIndex[c] + ' · ' + c, rows });
  });
  const tb = (state.tbPicks || []).slice().sort((a, b) => orderKey(a, a.qNum) - orderKey(b, b.qNum));
  if (tb.length) {
    const rows = tb.map((p) => {
      // Re-derive phase from participant count rather than the stored phase field.
      // When tbPenaltyTarget is known, qNum <= target is penalty; beyond is sudden
      // death. This corrects stale data from runners that hardcoded the boundary at 3.
      const derivedPhase = (tbPenaltyTarget > 0 && p.qNum != null)
        ? (p.qNum <= tbPenaltyTarget ? 'penalty' : 'sudden-death')
        : p.phase;
      const sdRound = derivedPhase === 'sudden-death'
        ? (tbPenaltyTarget > 0 ? p.qNum - tbPenaltyTarget : (p.sdRound || '?'))
        : null;
      return {
        order: orderKey(p, p.qNum),
        question: (p.displayLabel || ('TB' + ((p.idx || 0) + 1))) + ' · ' +
          (derivedPhase === 'sudden-death' ? ('Sudden death R' + sdRound) : ('Penalty Q' + p.qNum)),
        opener: teamLabel(p.originatorTeam),
        scorer: p.scoringTeam != null ? teamLabel(p.scoringTeam) : null,
        passed: (p.passedTeams && p.passedTeams.length) || 0, points: p.points || 0
      };
    });
    groups.push({ label: 'Tiebreaker', rows });
  }

  // Champion: always the top of standings. The standings sort already floats the
  // tiebreaker winner to the front of their tied group, so when the TB is for first
  // place, standings[0] is already the TB winner. When the TB is for a lower place
  // (e.g. 3rd), standings[0] is the outright points leader — not the TB winner.
  const champion = standings[0] || null;

  return {
    title: (snap.event && snap.event.title) || snap.title || 'Quiz Results',
    dateLong: (snap.event && snap.event.dateLong) || '',
    venue: (snap.event && snap.event.venue) || '',
    savedAt: snap.savedAt || '',
    categories, standings, groups, champion, anyTb, tbWinner
  };
}

/* ============================================================
   Render
   ============================================================ */
function renderResults(m) {
  const app = document.getElementById('app');
  app.innerHTML = '';

  // Toolbar (hidden on print).
  app.appendChild(el('div', { class: 'toolbar' }, [
    el('button', { class: 'btn ghost', onclick: () => window.print() }, 'Print / Save PDF'),
    el('button', { class: 'btn ghost', onclick: () => showHub() }, 'View other results')
  ]));

  // Header.
  const metaBits = [m.dateLong, m.venue].filter(Boolean).join(' · ');
  const champLine = m.champion
    ? ('🏆 ' + m.champion.name + ' — ' + m.champion.roundsTotal + ' points' +
        (m.champion.isTbWinner ? (' (won the tiebreaker, +' + m.champion.tbPoints + ')') : ''))
    : null;
  app.appendChild(el('div', { class: 'head' }, [
    el('h1', {}, m.title),
    metaBits ? el('div', { class: 'meta' }, metaBits) : null,
    champLine ? el('div', { class: 'winner' }, champLine) : null
  ]));

  // Standings — ranked on round points only; the tiebreaker is shown as a note,
  // never as a column, so it cannot reorder teams that were not tied.
  const cats = m.categories;
  const head = [el('th', {}, '#'), el('th', {}, 'Team')];
  cats.forEach((c) => head.push(el('th', { class: 'num' }, c.shortName)));
  head.push(el('th', { class: 'num' }, 'Total'));
  const body = m.standings.map((r) => {
    const nameCell = r.isTbWinner ? [r.name, el('span', { class: 'tbtag' }, ' (won tiebreaker)')] : r.name;
    const tds = [el('td', { class: 'rank' }, '#' + r.rank), el('td', {}, nameCell)];
    cats.forEach((c) => tds.push(el('td', { class: 'num' }, '' + r.byCat[c.name])));
    // Round points, with tiebreaker points shown separately in parentheses for
    // the teams that played the tiebreaker.
    const totalCell = r.tbPlayed
      ? [('' + r.roundsTotal + ' '), el('span', { class: 'tbtag' }, '(+' + r.tbPoints + ')')]
      : ('' + r.roundsTotal);
    tds.push(el('td', { class: 'num total' }, totalCell));
    return el('tr', { class: r.rank === 1 ? 'first' : '' }, tds);
  });
  app.appendChild(el('div', { class: 'card' }, [
    el('h2', {}, 'Final standings'),
    el('table', {}, [el('thead', {}, el('tr', {}, head)), el('tbody', {}, body)]),
    m.anyTb ? el('div', { class: 'footnote' }, 'Teams are ranked on round points. The number in parentheses is the points scored in the tiebreaker — it decides the winner among teams level on round points, and does not change anyone else’s position.') : null
  ]));

  // Complete game log — grouped by phase (subheader rows), in play order. The
  // leading "#" counts the questions within each phase (1, 2, 3, …).
  if (m.groups.length) {
    const cols = ['#', 'Question', 'Opening team', 'Scoring team', 'Points'];
    const lbody = [];
    m.groups.forEach((g) => {
      // Subheader row for the phase.
      lbody.push(el('tr', { class: 'phase-row' }, [el('td', { colspan: cols.length }, g.label)]));
      g.rows.forEach((r, i) => {
        lbody.push(el('tr', {}, [
          el('td', { class: 'rank' }, '' + (i + 1)),
          el('td', {}, r.question),
          el('td', {}, r.opener),
          el('td', {}, (r.scorer || '— no score') + (r.passed ? (' (after ' + r.passed + ' pass' + (r.passed > 1 ? 'es' : '') + ')') : '')),
          el('td', { class: 'num total' }, r.points ? ('+' + r.points) : '0')
        ]));
      });
    });
    const lhead = el('tr', {}, cols.map((h, i) => el('th', { class: i === cols.length - 1 ? 'num' : '' }, h)));
    app.appendChild(el('div', { class: 'card' }, [
      el('h2', {}, 'Complete Game Log'),
      el('table', { class: 'log' }, [el('thead', {}, lhead), el('tbody', {}, lbody)])
    ]));
  }

  if (m.savedAt) app.appendChild(el('div', { class: 'footnote', style: 'text-align:center;' }, 'Saved ' + new Date(m.savedAt).toLocaleString()));
}

/* ============================================================
   Hub: the no-parameter landing for results.html.
   Lists any published quizzes (from results/manifest.json) and lets a visitor
   open their own saved snapshot file.
   ============================================================ */
function openSnapshotFile(file, onError) {
  const fr = new FileReader();
  fr.onload = () => {
    try { renderResults(modelFromSnapshot(JSON.parse(fr.result))); }
    catch (err) { onError('That file could not be read as a results snapshot: ' + err.message); }
  };
  fr.readAsText(file);
}
function showHub(errorMsg) {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const listHolder = el('div', { id: 'published-list' });
  app.appendChild(el('div', { class: 'loader' }, [
    el('h1', { style: 'color:var(--blue);' }, 'Quiz Results'),
    el('p', {}, 'Browse past quizzes below, or open a results snapshot you saved from the quiz runner (Settings → Save snapshot).'),
    errorMsg ? el('div', { class: 'msg error' }, errorMsg) : null,
    listHolder,
    el('p', { style: 'margin-top:24px;' }, [
      el('label', { class: 'btn', style: 'display:inline-block;' }, [
        'Open a snapshot file…',
        el('input', { type: 'file', accept: '.json,application/json', style: 'display:none;', onchange: (e) => {
          const f = e.target.files[0]; if (f) openSnapshotFile(f, showHub);
        } })
      ])
    ])
  ]));

  // Populate the published list from the manifest (optional — absent on a fresh
  // copy, in which case we just show the upload option).
  fetch('results/manifest.json')
    .then((r) => (r.ok ? r.json() : null))
    .then((data) => {
      const quizzes = (data && (data.quizzes || data)) || [];
      if (!Array.isArray(quizzes) || !quizzes.length) return;
      listHolder.appendChild(el('h2', { style: 'color:var(--blue); font-size:18px; margin-top:8px;' }, 'Published quizzes'));
      listHolder.appendChild(el('div', { style: 'display:flex; flex-direction:column; gap:8px; max-width:560px; margin:0 auto;' },
        quizzes.map((q) => el('a', {
          href: 'results.html?src=' + (q.file || ''),
          style: 'display:block; text-align:left; text-decoration:none; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px 14px;'
        }, [
          el('div', { style: 'font-weight:600; color:var(--blue);' }, q.title || q.file),
          (q.date || q.venue) ? el('div', { style: 'font-size:13px; color:var(--text-soft);' }, [q.date, q.venue].filter(Boolean).join(' · ')) : null
        ]))
      ));
    })
    .catch(() => { /* no manifest — upload-only is fine */ });
}

// Auto-load from ?src=URL when present (same-origin on a website); otherwise hub.
(function init() {
  const params = new URLSearchParams(location.search);
  const src = params.get('src');
  if (!src) { showHub(); return; }
  fetch(src)
    .then((r) => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then((snap) => renderResults(modelFromSnapshot(snap)))
    .catch((err) => showHub('Could not load results from "' + src + '": ' + err.message));
})();
</script>
</body>
</html>
