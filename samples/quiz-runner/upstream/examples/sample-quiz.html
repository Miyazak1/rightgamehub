// v5.2: walks a candidate list of extensions when the primary src 404s.
// The set covers jpg/jpeg/png/webp/avif — modern browsers handle all of them.
function buildImageWithFallback(primarySrc, alt) {
  const dot = primarySrc.lastIndexOf('.');
  const base = dot >= 0 ? primarySrc.slice(0, dot) : primarySrc;
  const declaredExt = (dot >= 0 ? primarySrc.slice(dot + 1) : '').toLowerCase();
  const extensions = ['jpg', 'jpeg', 'png', 'webp', 'avif']
    .filter((x) => x !== declaredExt);
  let attempt = 0;
  const img = document.createElement('img');
  img.alt = alt || '';
  img.src = primarySrc;
  img.onerror = function () {
    if (attempt < extensions.length) {
      img.src = base + '.' + extensions[attempt++];
      return;
    }
    // All candidates exhausted — hide the img and write a small notice.
    img.style.display = 'none';
    const note = document.createElement('div');
    note.className = 'missing';
    note.textContent = 'Image not found (tried ' + (extensions.length + 1) + ' extensions)';
    if (img.parentNode) img.parentNode.appendChild(note);
  };
  return img;
}

// True when the optional secondary language is switched on in config.
function secondaryEnabled() {
  return !!(DATA.config && DATA.config.secondaryLanguage && DATA.config.secondaryLanguage.enabled);
}

// Renders the image for a question, or null when there is none.
//   - Embedded build: q.imageData is a base64 data URI → used directly.
//   - Non-embedded build: q.imageIsPath is true and q.imageData is a relative
//     filename → prefixed with IMAGE_PREFIX and run through the extension
//     fallback walker (handles a wrong extension in the source data).
function questionImageEl(q) {
  if (!q.imageData) return null;
  if (q.imageIsPath) return buildImageWithFallback(IMAGE_PREFIX + q.imageData, q.id);
  return el('img', { src: q.imageData, alt: q.id || '', onerror: (e) => e.target.style.display = 'none' });
}

function el(tag, attrs, children) {
  const node = document.createElement(tag);
  for (const k of Object.keys(attrs || {})) {
    const v = attrs[k];
    if (k === 'class') node.className = v;
    else if (k === 'html') node.innerHTML = v;
    else if (k.startsWith('on')) node[k] = v;
    // Skip null/undefined and false so disabled/checked etc. behave as expected.
    else if (v != null && v !== false) node.setAttribute(k, v === true ? '' : v);
  }
  for (const c of [].concat(children || [])) {
    if (c == null || c === false) continue;
    if (typeof c === 'string' || typeof c === 'number') node.appendChild(document.createTextNode(String(c)));
    else node.appendChild(c);
  }
  return node;
}
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  // The cover view uses its own full-stage layout — no header / op-bar — so it
  // reads as a clean title page.
  document.body.classList.toggle('cover-view', state.view === 'cover');
  if (state.view === 'cover') {
    app.appendChild(renderCover());
  } else {
    app.appendChild(renderHeader());
    app.appendChild(renderStage());
    app.appendChild(renderOpBar());
  }
  removeOverlays();
  removeHintsPill();
  // v5.3: hints pill ONLY shows in presentation mode. Outside presentation
  // mode the op-bar already shows the hint strip + action buttons, and the
  // pill would just block them in the bottom-right corner.
  if (state.view !== 'cover' && state.presentationMode) document.body.appendChild(renderHintsPill());
  if (state.overlay === 'help')        document.body.appendChild(renderHelp());
  else if (state.overlay === 'settings') document.body.appendChild(renderSettings());
  else if (state.overlay === 'leaderboard') document.body.appendChild(renderLeaderboard());
  else if (state.overlay === 'rules') document.body.appendChild(renderRules());
}
function removeOverlays() {
  document.querySelectorAll('.overlay-mask').forEach((n) => n.remove());
}
function removeHintsPill() {
  document.querySelectorAll('.hints-pill').forEach((n) => n.remove());
}
function renderHintsPill() {
  // Two display modes: collapsed (top-1 hint only) and expanded (full strip).
  // Click the pill to toggle. State persists in `state.hintsExpanded`.
  const expanded = !!state.hintsExpanded;
  const fullHints = hintForView();
  let body;
  if (expanded) {
    body = fullHints + ' <span class="pill-toggle">collapse</span>';
  } else {
    // Pull the first two hint chunks for the collapsed view.
    const chunks = fullHints.split(' · ').slice(0, 2).join(' · ');
    body = chunks + ' <span class="pill-toggle">more</span>';
  }
  return el('div', {
    class: 'hints-pill' + (expanded ? ' expanded' : ''),
    html: body,
    onclick: () => { state.hintsExpanded = !expanded; saveState(); render(); }
  });
}

/* ---------- logo + secondary-language helpers ---------- */
// Returns an <img> for a resolved logo src, or null when there is none — so the
// surrounding layout simply omits the slot instead of showing a broken image.
// `opts.scale` visually enlarges a single mark (some logos carry a lot of
// transparent padding and read small at an equal max-height).
function logoImg(src, alt, opts) {
  if (!src) return null;
  const o = opts || {};
  const attrs = { src: src, alt: alt || '', onerror: (e) => e.target.style.display = 'none' };
  if (o.class) attrs.class = o.class;
  if (o.scale && o.scale !== 1) attrs.style = 'transform: scale(' + o.scale + '); transform-origin: center;';
  return el('img', attrs);
}
// Secondary-language title line — only rendered when the feature is enabled in
// config AND a secondary title string is present. Generic: works for any script.
function secondaryTitleEl(tag, extraClass) {
  const sl = DATA.config && DATA.config.secondaryLanguage;
  if (!sl || !sl.enabled || !DATA.event.titleSecondary) return null;
  return el(tag || 'div', { class: (extraClass ? extraClass + ' ' : '') + 'secondary-lang' }, DATA.event.titleSecondary);
}

/* ---------- header ---------- */
function renderHeader() {
  // Primary (organiser) logo on the left, optional secondary logo on the right.
  // Either slot is left empty if no logo is configured.
  const L = DATA.assets.logos || {};
  return el('div', { class: 'app-header' }, [
    el('div', { class: 'logo-slot left' }, [ logoImg(L.primary, L.primaryAlt) ]),
    el('div', { class: 'title-block' }, [
      el('div', { class: 'en' }, DATA.event.title),
      secondaryTitleEl('div')
    ]),
    el('div', { class: 'logo-slot right' }, [ logoImg(L.secondary, L.secondaryAlt) ])
  ]);
}

/* ---------- stage dispatch ---------- */
function renderStage() {
  switch (state.view) {
    case 'splash':            return renderSplash();
    case 'main-board':        return renderMainBoard();
    case 'category-board':    return renderCategoryBoard();
    case 'tb-setup':          return renderTbSetup();
    case 'tb-cat-select':     return renderTbCatSelect();
    case 'tb-board':          return renderTbBoard();
    case 'tb-jumbled':        return renderTbJumbled();
    case 'question':          return renderQuestion();
    default:                  return el('div', { class: 'stage' }, 'Unknown view.');
  }
}

/* ---------- cover ----------
   Three layouts, chosen by event.coverLayout:
     'minimal'      — organiser line + title + date/venue + CTA only.
     'standard'     — festival + organiser logo, collaborators, title, footer.
     'sponsor-rich' — title sponsor prominent at the very top; all other
                      sponsors and supporters grouped in the bottom footer.
   Every block is conditional, so the cover never shows an empty row. */
function renderCover() {
  const ev = DATA.event;
  const L = DATA.assets.logos || {};
  const layout = ev.coverLayout || 'standard';

  // Title group (title + secondary + date/venue + Start setup CTA) — shared.
  const titleChildren = [
    el('div', { class: 'runner-title' }, [ ev.title || 'Quiz Competition', secondaryTitleEl('span') ])
  ];
  const whenBits = [ev.dateLong, ev.timeNote].filter(Boolean).join(' · ');
  if (whenBits) titleChildren.push(el('div', { class: 'when' }, whenBits));
  const whereBits = [ev.venue, ev.venueAddress].filter(Boolean).join(' — ');
  if (whereBits) titleChildren.push(el('div', { class: 'where' }, whereBits));
  titleChildren.push(el('div', { class: 'cta' }, [
    el('button', { class: 'btn primary', onclick: gotoSplash }, ['Start setup', el('span', { class: 'key' }, 'Enter')])
  ]));
  const titleGroup = el('div', { class: 'title-group' }, titleChildren);

  // Logo rows used by standard / sponsor-rich.
  const collabImgs = (L.collaborators || []).map((c) => logoImg(c.src, c.alt, { scale: c.scale })).filter(Boolean);
  const footerImgs = [].concat(L.sponsors || [], L.supporters || []).map((s) => logoImg(s.src, s.alt)).filter(Boolean);

  const groups = [];

  if (layout === 'minimal') {
    if (ev.organiser) {
      groups.push(el('div', { class: 'top-group' }, [
        el('div', { class: 'org-line' }, ['Presented by ', el('strong', {}, ev.organiser)])
      ]));
    }
    groups.push(titleGroup);

  } else if (layout === 'sponsor-rich') {
    // Title sponsor sits prominently at the very top.
    if (L.titleSponsor) {
      groups.push(el('div', { class: 'top-group' }, [
        el('div', { class: 'supporters-label' }, 'Proudly presented by'),
        el('div', { class: 'collab-row' }, [ logoImg(L.titleSponsor, L.titleSponsorAlt) ])
      ]));
    }
    if (ev.festivalTitle) {
      groups.push(el('div', { class: 'top-group' }, [ el('div', { class: 'fest' }, ev.festivalTitle) ]));
    }
    if (ev.organiser || collabImgs.length) {
      groups.push(el('div', { class: 'mid-group' }, [
        ev.organiser ? el('div', { class: 'org-line' }, ['Organised by ', el('strong', {}, ev.organiser)]) : null,
        collabImgs.length ? el('div', { class: 'org-line' }, 'in collaboration with') : null,
        collabImgs.length ? el('div', { class: 'collab-row' }, collabImgs) : null
      ]));
    }
    groups.push(titleGroup);
    if (footerImgs.length) {
      groups.push(el('div', { class: 'footer-group' }, [
        el('div', { class: 'supporters-label' }, 'With the support of'),
        el('div', { class: 'supporters-row' }, footerImgs)
      ]));
    }

  } else {
    // 'standard'
    if (ev.festivalTitle || ev.organiser || L.primary) {
      groups.push(el('div', { class: 'top-group' }, [
        ev.festivalTitle ? el('div', { class: 'fest' }, ev.festivalTitle) : null,
        ev.organiser ? el('div', { class: 'org-line' }, ['Organised by ', el('strong', {}, ev.organiser)]) : null,
        L.primary ? el('div', { class: 'org-logo' }, [ logoImg(L.primary, L.primaryAlt) ]) : null
      ]));
    }
    if (collabImgs.length) {
      groups.push(el('div', { class: 'mid-group' }, [
        el('div', { class: 'org-line' }, 'in collaboration with'),
        el('div', { class: 'collab-row' }, collabImgs)
      ]));
    }
    groups.push(titleGroup);
    if (footerImgs.length) {
      groups.push(el('div', { class: 'footer-group' }, [
        el('div', { class: 'supporters-label' }, 'Program supporters'),
        el('div', { class: 'supporters-row' }, footerImgs)
      ]));
    }
  }

  return el('div', { class: 'stage', style: 'padding:0;' }, [
    el('div', { class: 'cover' }, groups)
  ]);
}

/* ---------- splash ---------- */
function renderSplash() {
  // Cover ↔ splash toggle preserves draft team names via state._draftNames.
  if (!state._draftNames) state._draftNames = state.teams.length ? state.teams.map((t) => t.name) : [];
  const ev = DATA.event;
  const L = DATA.assets.logos || {};
  const min = ev.teamsMin || 2;
  const max = ev.teamsMax || 12;

  // When a game is already underway, renaming keeps scores — but changing the
  // team COUNT would invalidate the snake order, so we lock the count input
  // and warn the operator. See startQuiz() for the rename-only branch.
  const inProgress = gameHasScores();

  const teamInputs = [];
  for (let i = 1; i <= state.numTeams; i++) {
    teamInputs.push(el('div', { class: 'row' }, [
      el('label', {}, 'Team ' + i + ':'),
      el('input', {
        type: 'text',
        placeholder: 'Team ' + i,
        value: state._draftNames[i - 1] || '',
        oninput: (e) => { state._draftNames[i - 1] = e.target.value; }
      })
    ]));
  }

  // Generic credits, assembled only from whatever the config supplies.
  const creditParts = [];
  if (ev.organiser) creditParts.push('Organised by ' + ev.organiser);
  if (ev.collaborators && ev.collaborators.length) creditParts.push('in collaboration with ' + ev.collaborators.join(', '));
  const creditLine = creditParts.join(', ');
  const creditLogos = [logoImg(L.primary, L.primaryAlt)]
    .concat((L.collaborators || []).map((c) => logoImg(c.src, c.alt, { scale: c.scale })))
    .filter(Boolean);
  const supporterLogos = [].concat(L.sponsors || [], L.supporters || [])
    .map((s) => logoImg(s.src, s.alt)).filter(Boolean);
  const creditsChildren = [];
  if (creditLine) creditsChildren.push(el('div', { class: 'assoc' }, creditLine));
  if (creditLogos.length) creditsChildren.push(el('div', { class: 'assoc-logos' }, creditLogos));
  if (ev.programSupporters && ev.programSupporters.length)
    creditsChildren.push(el('div', { class: 'assoc' }, 'Program supporters: ' + ev.programSupporters.join(', ')));
  if (supporterLogos.length) creditsChildren.push(el('div', { class: 'assoc-logos' }, supporterLogos));

  return el('div', { class: 'stage' }, [
    el('div', { class: 'splash' }, [
      el('div', { class: 'setup-header' }, [
        el('h2', {}, 'Team Setup'),
        el('div', { class: 'sub' }, '(names will appear on chips and on the leaderboard)')
      ]),
      el('div', { class: 'form-block' }, [
        // In-progress notice — only shown once scores exist.
        inProgress ? el('div', { class: 'qstatus blue shown', style: 'visibility:visible; max-width:560px; margin:0 auto 6px;' },
          'A quiz is already in progress. Updating names here keeps every score. The number of teams is locked mid-game.') : null,
        el('div', { class: 'panel' }, [
          el('div', { class: 'row' }, [
            el('label', {}, 'Number of teams:'),
            el('input', {
              type: 'number', min: min, max: max, value: state.numTeams,
              disabled: inProgress,
              onchange: (e) => { state.numTeams = Math.max(min, Math.min(max, parseInt(e.target.value, 10) || min)); render(); }
            })
          ]),
          ...teamInputs
        ]),
        el('div', { style: 'display:flex; gap:10px; margin-top:10px; align-items:center;' }, [
          el('button', { class: 'btn', onclick: gotoCover }, ['← Back to cover', el('span', { class: 'key' }, 'Esc')]),
          el('button', { class: 'btn primary', style: 'font-size:16px; padding:12px 28px;', onclick: startQuiz },
            [inProgress ? 'Update names' : 'Start Quiz', el('span', { class: 'key' }, 'Enter')])
        ])
      ]),
      el('div', { class: 'credits-block' }, creditsChildren)
    ])
  ]);
}

/* ---------- main board ---------- */
function renderMainBoard() {
  // v5.2: shortcut letter comes from the per-category metadata.
  const shortcuts = {};
  DATA.categories.forEach((c) => { shortcuts[c.name] = c.shortcutKey || c.name.charAt(0); });
  const tiles = DATA.categories.map((cat) => {
    const done = Object.keys(state.picks[cat.name] || {}).length;
    const total = cat.board.length;
    const complete = done >= total;
    // v5.3: tile content is centered. Shortcut chip sits beside the title so
    // the operator still sees the keybinding without breaking the symmetry.
    return el('div', { class: 'cat-tile ' + tileClassFor(cat.name), onclick: () => openCategory(cat.name) }, [
      el('div', { class: 'tile-head' }, [
        el('h2', {}, cat.name),
        el('span', { class: 'shortcut' }, shortcuts[cat.name] || '')
      ]),
      el('div', { class: 'sub' }, 'Round ' + roundForCategory(cat.name) + (complete ? ' · complete' : '')),
      el('div', { style: 'width:100%;' }, [
        el('div', { class: 'progress' }, done + ' of ' + total + ' picked'),
        el('div', { class: 'progress-bar' }, [el('div', { style: 'width:' + (100 * done / total) + '%' })])
      ])
    ]);
  });
  const actions = [];
  if (settings.showTiebreakerSection) {
    actions.push(el('button', { class: 'btn', onclick: openTiebreakers }, ['Tiebreakers', el('span', { class: 'key' }, 'T')]));
  }
  actions.push(el('button', { class: 'btn', onclick: openRules }, ['Rulebook', el('span', { class: 'key' }, 'B')]));
  actions.push(el('button', { class: 'btn primary', onclick: openLeaderboard }, ['Leaderboard', el('span', { class: 'key' }, 'L')]));
  return el('div', { class: 'stage' }, [
    el('div', { class: 'main-board' }, tiles),
    el('div', { class: 'secondary-actions' }, actions)
  ]);
}

/* ---------- category board ---------- */
function renderCategoryBoard() {
  const cat = categoryByName(state.currentCategory);
  if (!cat) return el('div', { class: 'stage' }, 'Unknown category.');
  const opener = openerForCategory(cat.name);
  const complete = categoryComplete(cat.name);
  const round = roundForCategory(cat.name);

  // v5: opener strip — chips for every team. While unconfirmed, arrows /
  // clicks change the highlight; Enter confirms. Once confirmed, the slot
  // grid lights up and the strip shows "Opener: Team X — press U to change."
  const openerChips = state.teams.map((t) => {
    const cls = ['team-chip'];
    const focus = opener.team || state.originatorHighlight;
    if (opener.confirmed && opener.team === t.number) cls.push('active');
    else if (!opener.confirmed && focus === t.number) cls.push('highlight');
    return el('div', {
      class: cls.join(' '),
      onclick: () => {
        // Click commits in one step (mouse path).
        setPendingOpener(cat.name, t.number, true);
        state.originatorHighlight = t.number;
        saveState(); render();
      }
    }, [
      el('span', { class: 'n' }, '' + t.number),
      el('span', {}, t.name),
      el('span', { class: 'score' }, '· ' + t.score + ' pts')
    ]);
  });
  // v5.1: confirmed change uses a guarded handler. Unconfirmed change is
  // just a confirmed-toggle, no prompt needed.
  function confirmedChange() {
    if (confirm('Change the opener for the next pick? Current opener (Team ' + opener.team + ') will need re-confirming.')) {
      unconfirmOpenerOnBoard();
    }
  }
  const stripActions = opener.confirmed
    ? [el('button', { class: 'btn', onclick: confirmedChange }, ['Change opener', el('span', { class: 'key' }, 'U')])]
    : [el('button', { class: 'btn primary', onclick: confirmOpenerOnBoard, disabled: !((opener.team || state.originatorHighlight)) }, ['Confirm opener', el('span', { class: 'key' }, 'Enter')])];
  // v5.1: participant-facing label is short and factual. Operator hints
  // (snake suggestion, what to press) live in the bottom hint strip.
  const stripLabel = opener.confirmed
    ? ('Round ' + round + ' · Team ' + opener.team + ' to choose')
    : ('Round ' + round + ' · choose the team to open');
  const openerStrip = el('div', { class: 'opener-strip' + (opener.confirmed ? ' confirmed' : '') }, [
    el('div', { class: 'label' }, stripLabel),
    el('div', { class: 'chips' }, openerChips),
    el('div', { class: 'actions' }, stripActions)
  ]);

  // Slot grid — disabled while opener is unconfirmed.
  const slots = cat.board.map((slot, i) => {
    const picked = pickRecord(cat.name, slot.draw);
    const classes = ['slot'];
    if (picked) classes.push('done');
    if (opener.confirmed && i === state.focusSlot) classes.push('focus');
    return el('div', {
      class: classes.join(' '),
      onclick: () => { if (picked) reopenSlot(cat.name, slot.draw); else pickSlot(cat.name, slot.draw); }
    }, [
      el('div', { class: 'num' }, '' + slot.draw),
      picked && el('div', { class: 'tag' }, picked.scoringTeam ? ('+' + picked.points + ' → T' + picked.scoringTeam) : 'no score')
    ]);
  });

  // Round-end banner — shown once all 14 expected draws have been played.
  const children = [
    el('div', { class: 'board-head' }, [
      el('h2', {}, cat.name + ' · Round ' + round),
      el('div', { class: 'sub' }, picksMadeInCategory(cat.name) + ' of ' + cat.board.length + ' played')
    ])
  ];
  if (complete) {
    // Top team in this round only.
    const r = roundScores();
    let top = null;
    for (const t of state.teams) {
      const score = r[t.number].byCat[cat.name];
      if (!top || score > top.score) top = { name: t.name, score };
    }
    const i = ROUND_ORDER.indexOf(cat.name);
    const hasNext = i >= 0 && i + 1 < ROUND_ORDER.length;
    children.push(el('div', { class: 'round-banner' }, [
      el('div', { class: 'text' }, [
        'Round ' + round + ' complete · top of this round: ',
        el('strong', {}, (top ? (top.name + ' (' + top.score + ' pts)') : '—'))
      ]),
      el('div', { class: 'actions' }, [
        hasNext ? el('button', { class: 'btn primary', onclick: jumpToNextRound }, 'Go to Round ' + (round + 1)) : null,
        el('button', { class: 'btn', onclick: gotoMainBoard }, 'Main board'),
        el('button', { class: 'btn', onclick: openLeaderboard }, ['Leaderboard', el('span', { class: 'key' }, 'L')])
      ])
    ]));
  }
  children.push(openerStrip);
  children.push(el('div', { class: 'slot-grid' + (opener.confirmed ? '' : ' disabled') }, slots));
  return el('div', { class: 'stage' }, children);
}

/* ---------- tiebreaker boards ---------- */
function renderTbCatSelect() {
  const shortcuts = {};
  DATA.categories.forEach((c) => { shortcuts[c.name] = c.shortcutKey || c.name.charAt(0); });
  const tiles = DATA.categories.map((cat) =>
    el('div', { class: 'cat-tile ' + tileClassFor(cat.name), onclick: () => openTbBoard(cat.name) }, [
      el('div', { style: 'display:flex; justify-content:space-between; align-items:center;' }, [
        el('h2', {}, cat.name),
        el('span', { class: 'shortcut' }, shortcuts[cat.name] || '')
      ]),

    ])
  );
  return el('div', { class: 'stage' }, [
    el('div', { class: 'board-head' }, [
      el('h2', {}, 'Tiebreakers'),
      el('div', { class: 'sub' }, '3 questions per selected team, then sudden death if still tied')
    ]),
    el('div', { class: 'main-board' }, tiles)
  ]);
}
// v5.4: tiebreaker boards renumber their slots TB1…TBn (the operator never
// sees the source ID on the participant-facing board) and prepend a phase
// banner so the audience sees where we are in the tiebreaker.
// v5.5: banner is now phase-aware (penalty / sudden death) and lists the
// confirmed participants up front.
function renderTbRulesBanner() {
  // v5.6: the banner is now standings-aware. After every TB question, we
  // peek at the per-team TB totals — if exactly one team uniquely leads, we
  // surface a "Declare winner" affordance. Phase labels also track the
  // sudden-death round number (not just "Sudden death" with no context).
  const phase = state.tbPhase || 'penalty';
  const partsCount = (state.tbParticipants || []).length;
  const playedCount = (state.tbPicks || []).length;
  const penaltyTarget = tbPenaltyQuestionTarget();
  let phaseLabel;
  let phaseDetail;
  if (phase === 'penalty') {
    if (playedCount >= penaltyTarget) {
      phaseLabel = 'Penalty phase complete';
      phaseDetail = 'Each selected team has now started 3 tiebreakers (' + penaltyTarget + ' total). If there is a unique leader, declare the winner. Otherwise continue into sudden death.';
    } else {
      const upcoming = Math.min(playedCount + 1, penaltyTarget);
      phaseLabel = 'Penalty phase · question ' + upcoming + ' of ' + penaltyTarget;
      phaseDetail = 'Each selected team starts 3 tiebreakers. Standard +10 / +5 scoring; tiebreaker points feed the Total (+ TB) column on the leaderboard.';
    }
  } else if (phase === 'sudden-death') {
    const sdRound = Math.max(1, playedCount - penaltyTarget + 1);
    phaseLabel = 'Sudden death · round ' + sdRound;
    phaseDetail = 'Penalty phase covered 3 questions per team (' + penaltyTarget + ' total). Keep going until one team has a unique tiebreaker lead. Standard +10 / +5 scoring applies.';
  } else {
    phaseLabel = 'Tiebreaker resolved';
    phaseDetail = state.tbWinnerTeam ? ('Winner: ' + teamNameByNumber(state.tbWinnerTeam) + '.') : 'No further tiebreaker questions needed.';
  }
  // Compose a short standings line — useful when more than one team is tied
  // or trailing in the pool.
  const standings = (() => {
    const pts = tbPointsByTeam();
    const pool = tiebreakerPool();
    if (!pool.length) return null;
    const sorted = pool
      .map((n) => ({ n, p: pts[n] || 0 }))
      .sort((a, b) => b.p - a.p);
    return sorted.map((s) => 'T' + s.n + ': ' + s.p).join(' · ');
  })();
  const winner = tbWinnerCandidate();
  const winnerName = winner ? teamNameByNumber(winner) : null;
  const actions = [
    el('button', { class: 'btn', onclick: restartTiebreaker }, 'Change participants')
  ];
  if (winner && phase !== 'resolved' && playedCount >= penaltyTarget) {
    actions.push(el('button', { class: 'btn primary', onclick: declareTbWinner }, 'Declare ' + winnerName + ' winner'));
  }
  return el('div', { class: 'round-banner', style: 'background:var(--blue-bg); border-color:var(--blue-border); color:var(--blue);' }, [
    el('div', { class: 'text', style: 'color:var(--text);' }, [
      el('strong', { style: 'color:var(--blue);' }, phaseLabel + ' · '),
      partsCount + ' teams. ',
      phaseDetail,
      standings ? el('div', { style: 'margin-top:6px; color:var(--text-soft); font-size:13px;' }, 'TB standings · ' + standings) : null
    ]),
    el('div', { class: 'actions' }, actions)
  ]);
}

// v5.5: participant-selection screen — shown before any tiebreaker question
// is played. Default-fills with teams tied for first; operator can add /
// remove. We do not block entry when there is no tie — the operator may want
// to rehearse the tiebreaker flow.
function renderTbSetup() {
  const tied = topTiedTeams();
  const noTie = tied.length < 2;
  const participants = state.tbParticipants || [];
  const penaltyTarget = Math.max(3, participants.length * 3);
  const chips = state.teams.map((t) => {
    const isSelected = participants.includes(t.number);
    const isAutoTied = tied.includes(t.number);
    const cls = ['team-chip'];
    if (isSelected) cls.push('active');
    else if (isAutoTied) cls.push('highlight');
    return el('div', {
      class: cls.join(' '),
      onclick: () => toggleTbParticipant(t.number),
      style: 'font-size:clamp(14px,1.2vw,18px); padding:10px 14px;'
    }, [
      el('span', { class: 'n' }, '' + t.number),
      el('span', {}, t.name),
      el('span', { class: 'score' }, '· ' + t.score + ' pts')
    ]);
  });
  const explainText = noTie
    ? 'No clear tie for first place — the top team has a unique score. Add at least 2 teams below if you still want to run a tiebreaker (e.g., a deliberate rehearsal).'
    : ('Teams tied for first: ' + tied.map((n) => 'Team ' + n).join(', ') + '. They are pre-selected. Add or remove teams below, then confirm.');
  return el('div', { class: 'stage' }, [
    el('div', { class: 'board-head' }, [
      el('h2', {}, 'Tiebreaker setup'),
      el('div', { class: 'sub' }, participants.length + ' selected · need at least 2 to start')
    ]),
    el('div', { class: 'round-banner', style: 'background:var(--blue-bg); border-color:var(--blue-border); color:var(--blue);' }, [
      el('div', { class: 'text', style: 'color:var(--text);' }, [
        el('strong', { style: 'color:var(--blue);' }, 'How the tiebreaker works · '),
        'Phase 1 (penalty shootout): each selected team starts 3 tiebreakers. With the current pool, that is ' + penaltyTarget + ' questions in total. Standard +10 / +5 scoring. ',
        'Phase 2 (sudden death): if still tied after that, more tiebreakers are asked until one team has a unique lead. ',
        'Only selected teams play; pass rotation stays inside this pool.'
      ])
    ]),
    el('div', { style: 'background:var(--bg-soft); padding:clamp(14px,1.6vh,22px) clamp(16px,1.8vw,24px); border-radius:10px; margin-bottom:14px; font-size:clamp(14px,1.1vw,18px); line-height:1.5;' }, explainText),
    el('div', { class: 'team-row' }, [
      el('div', { class: 'label' }, 'Tiebreaker participants'),
      el('div', { class: 'team-chips' }, chips)
    ]),
    el('div', { style: 'display:flex; justify-content:space-between; margin-top:18px;' }, [
      el('button', { class: 'btn', onclick: gotoMainBoard }, ['Cancel', el('span', { class: 'key' }, 'Esc')]),
      el('button', {
        class: 'btn primary',
        onclick: confirmTbParticipants,
        disabled: participants.length < 2,
        style: 'font-size:clamp(15px,1.4vw,22px); padding:12px 24px;'
      }, ['Start tiebreaker', el('span', { class: 'key' }, 'Enter')])
    ])
  ]);
}
function renderTbBoard() {
  const cat = categoryByName(state.currentCategory);
  if (!cat) return el('div', { class: 'stage' }, 'Unknown category.');
  // v5.7: opener strip first (mirrors main category-board), then slots.
  // Slot grid is disabled until the opener has been confirmed.
  const tbOpener = state.tbPendingOpener || { team: null, confirmed: false };
  const slots = cat.tiebreakers.map((tb, i) => {
    const played = tbPickFor(cat.name, i);
    const classes = ['slot'];
    if (i === state.focusSlot) classes.push('focus');
    if (played) classes.push('done');
    return el('div', {
      class: classes.join(' '),
      onclick: () => { if (played) reopenTbSlot(cat.name, i); else pickTb(cat.name, i, null, i + 1); }
    }, [
      el('div', { class: 'num' }, 'TB' + (i + 1)),
      played && el('div', { class: 'tag' }, played.scoringTeam ? ('+' + played.points + ' → T' + played.scoringTeam) : 'no score')
    ]);
  });
  return el('div', { class: 'stage' }, [
    el('div', { class: 'board-head' }, [
      el('h2', {}, cat.name + ' · Tiebreakers'),
      el('div', { class: 'sub' }, cat.tiebreakers.length + ' tiebreakers in this category')
    ]),
    renderTbRulesBanner(),
    renderTbOpenerStrip(),
    el('div', { class: 'slot-grid tb' + (tbOpener.confirmed ? '' : ' disabled') }, slots)
  ]);
}

function renderTbJumbled() {
  // Jumbled grid: every tiebreaker across all categories interleaved. Slot
  // labels are TB1..TBn by position in the jumbled list — participants see
  // a single global numbering without category hints.
  // v5.6: used slots greyed out + tagged with the awarded points → team, and
  // a click on a used slot reopens it (same as main-board reopen flow).
  const list = jumbledTiebreakerList();
  const tiles = list.map((entry, i) => {
    const played = tbPickFor(entry.category, entry.idx);
    const classes = ['slot'];
    if (i === state.focusSlot) classes.push('focus');
    if (played) classes.push('done');
    return el('div', {
      class: classes.join(' '),
      onclick: () => { if (played) reopenTbSlot(entry.category, entry.idx); else pickTb(entry.category, entry.idx, entry.category, i + 1); }
    }, [
      el('div', { class: 'num' }, 'TB' + (i + 1)),
      played && el('div', { class: 'tag' }, played.scoringTeam ? ('+' + played.points + ' → T' + played.scoringTeam) : 'no score')
    ]);
  });
  const tbOpener = state.tbPendingOpener || { team: null, confirmed: false };
  return el('div', { class: 'stage' }, [
    el('div', { class: 'board-head' }, [
      el('h2', {}, 'Tiebreakers'),
      el('div', { class: 'sub' }, list.length + ' tiebreakers · numbered TB1–TB' + list.length)
    ]),
    renderTbRulesBanner(),
    renderTbOpenerStrip(),
    el('div', { class: 'slot-grid tb-jumbled' + (tbOpener.confirmed ? '' : ' disabled') }, tiles)
  ]);
}

// v5.7: TB-specific opener strip — analogous to the main category-board's
// opener-strip, but the chip list is the tiebreaker pool (not state.teams).
// Operator picks via click / number key / arrows; confirm via Enter or the
// "Confirm opener" button. Slot grid disables until confirmed (same idiom
// as the category board) so the operator cannot misclick a TB before the
// opener is locked in.
function renderTbOpenerStrip() {
  const pool = tiebreakerPool();
  if (!pool.length) return null;
  const tbOpener = state.tbPendingOpener || { team: null, confirmed: false };
  const suggestion = nextTbOpener();
  // Mirror the main board: before confirmation, the suggested / current
  // opener shows as the dotted highlight chip; after confirmation, it flips
  // to the solid active chip.
  const focus = tbOpener.team || state.originatorHighlight || suggestion;
  const chips = state.teams.filter((t) => pool.includes(t.number)).map((t) => {
    const cls = ['team-chip'];
    if (tbOpener.confirmed && tbOpener.team === t.number) cls.push('active');
    else if (!tbOpener.confirmed && focus === t.number) cls.push('highlight');
    return el('div', {
      class: cls.join(' '),
      onclick: () => {
        if (tbOpener.confirmed) {
          if (t.number === tbOpener.team) return;
          if (!confirm('Change the tiebreaker opener to Team ' + t.number + '? Confirmed opener (Team ' + tbOpener.team + ') will be replaced.')) return;
        }
        setTbPendingOpener(t.number, true);
        state.originatorHighlight = t.number;
        saveState(); render();
      }
    }, [
      el('span', { class: 'n' }, '' + t.number),
      el('span', {}, t.name),
      el('span', { class: 'score' }, '· ' + t.score + ' pts')
    ]);
  });
  const actions = [];
  if (!tbOpener.confirmed) {
    actions.push(el('button', { class: 'btn primary', onclick: confirmTbOpenerOnBoard, disabled: !(tbOpener.team || state.originatorHighlight || suggestion) }, ['Confirm opener', el('span', { class: 'key' }, 'Enter')]));
  } else {
    actions.push(el('button', { class: 'btn', onclick: () => { if (confirm('Unconfirm the tiebreaker opener so you can pick a different team?')) unconfirmTbOpenerOnBoard(); } }, ['Change opener', el('span', { class: 'key' }, 'U')]));
  }
  const label = tbOpener.confirmed
    ? 'Tiebreaker · Team ' + tbOpener.team + ' to choose'
    : 'Tiebreaker · choose the team to open';
  return el('div', { class: 'opener-strip' + (tbOpener.confirmed ? ' confirmed' : '') }, [
    el('div', { class: 'label' }, label),
    el('div', { class: 'chips' }, chips),
    el('div', { class: 'actions' }, actions)
  ]);
}

/* ---------- question view ---------- */
function renderQuestion() {
  const q = currentQuestion();
  if (!q) return el('div', { class: 'stage' }, 'No question selected.');

  // v5: tb-opener stage — only used for tiebreakers, since main-board questions
  // arrive with the opener already committed via the category-board strip.
  // v5.6: chips are limited to the confirmed tiebreaker pool so the operator
  // cannot accidentally open with a team outside the tiebreaker.
  if (state.stage === 'tb-opener') {
    const pool = tiebreakerPool();
    const chips = state.teams
      .filter((t) => pool.includes(t.number))
      .map((t) => {
        const cls = ['team-chip'];
        if (state.originatorHighlight === t.number) cls.push('highlight');
        return el('div', {
          class: cls.join(' '),
          onclick: () => setOriginator(t.number)
        }, [
          el('span', { class: 'n' }, '' + t.number),
          el('span', {}, t.name),
          el('span', { class: 'score' }, '· ' + t.score + ' pts')
        ]);
      });
    // Snake suggestion: pick the tied team that has not opened the most-recent
    // tiebreaker yet, so the opening team rotates instead of always being T1.
    return el('div', { class: 'stage' }, [
      el('div', { class: 'pick-team' }, [
        el('div', { class: 'draw-label' }, 'Tiebreaker'),
        el('div', { class: 'big-draw' }, state.tbDisplayLabel || ('TB' + (state.tbIndex + 1))),
        el('div', { class: 'prompt' }, 'Choose the team to start (from ' + pool.length + ' tiebreaker teams)'),
        el('div', { class: 'team-chips', style: 'margin-top:8px;' }, chips)
      ])
    ]);
  }

  // Active stages (idle / timing / pass / resolved)
  const round = state.inTiebreaker ? 0 : roundForCategory(state.currentCategory);
  const metaBits = [
    // v5.4: tiebreaker questions show only "TBn" in the meta — no category
    // and no theme label, so participants can't infer the source.
    el('span', { class: 'draw' }, state.inTiebreaker
      ? (state.tbDisplayLabel || ('TB' + (state.tbIndex + 1)))
      : ('Question ' + state.currentDraw)),
    state.inTiebreaker ? null : el('span', { class: 'pill' }, (q.theme || '').replace(/^Theme\s+\d+:\s*/i, '')),
    state.inTiebreaker
      ? el('span', { class: 'cat' }, 'Tiebreaker')
      : el('span', { class: 'cat' }, state.currentCategory + (round ? (' · Round ' + round) : ''))
  ];

  const children = [];
  // Row 1: meta + timer
  children.push(el('div', { class: 'qmeta-row' }, [
    el('div', { class: 'qmeta' }, metaBits),
    el('div', { class: 'qtimer-slot' }, [
      el('div', { class: 'timer idle' }, [el('div', { class: 'num' }, '—')]),
      el('div', { class: 'timer-label' }, renderTimerLabel())
    ])
  ]));
  // Row 2: question text (primary + optional secondary language)
  const showSecondary = secondaryEnabled();
  children.push(el('div', { class: 'qquestion' }, [
    el('div', { class: 'eng' }, q.primaryQuestion),
    (showSecondary && q.secondaryQuestion) ? el('div', { class: 'secondary-lang' }, q.secondaryQuestion) : null
  ]));
  // Row 3: image (only when the question carries one — no placeholder when absent).
  const imgEl = questionImageEl(q);
  if (imgEl) children.push(el('div', { class: 'qimage' }, [imgEl]));
  // Row 4: answer (always reserved space; visibility flips on reveal)
  children.push(el('div', { class: 'qanswer' + (state.showAnswer ? ' shown' : '') }, [
    el('div', { class: 'eng' }, 'Answer: ' + q.primaryAnswer),
    (showSecondary && q.secondaryAnswer) ? el('div', { class: 'secondary-lang' }, q.secondaryAnswer) : null
  ]));

  // Below the question: status banner + team chips + actions
  const stage = el('div', { class: 'stage' }, [
    el('div', { class: 'qview' }, children),
    el('div', { class: 'qlower' }, [
      renderQStatus(),
      renderTeamRow(),
      renderQActions()
    ])
  ]);
  setTimeout(updateTimerDom, 0);
  return stage;
}
function renderTimerLabel() {
  // v5.1: short factual labels — operator hints go to the bottom strip.
  if (state.stage === 'idle') return 'Ready';
  if (state.stage === 'timing') return (DATA.event.timerSeconds || 30) + ' seconds';
  if (state.stage === 'pass') return 'Pass';
  if (state.stage === 'resolved') return '';
  return '';
}
function renderQStatus() {
  // v5.1: participant-facing banners are short and factual. Operator cues
  // (Space, Esc, etc.) live in the bottom hint strip — duplicating them here
  // makes the projection look like a tutorial.
  if (state.stage === 'idle') {
    const tname = (state.teams.find((x) => x.number === state.originatorTeam) || {}).name || ('Team ' + state.originatorTeam);
    return el('div', { class: 'qstatus shown blue' }, tname + ' is up');
  }
  if (state.stage === 'pass') {
    if (state.currentPassTeam) {
      const tname = (state.teams.find((x) => x.number === state.currentPassTeam) || {}).name || ('Team ' + state.currentPassTeam);
      return el('div', { class: 'qstatus shown' }, 'Pass to ' + tname);
    }
    return el('div', { class: 'qstatus shown' }, 'Choose the next team');
  }
  if (state.stage === 'resolved') {
    if (state.inTiebreaker) {
      // v5.6: reflect the actual TB scoring outcome instead of always saying
      // "Tiebreaker complete" (the tiebreaker may still be in progress).
      const tbPick = (state.tbPicks || []).slice(-1)[0] || {};
      if (tbPick.scoringTeam) {
        const tname = (state.teams.find((x) => x.number === tbPick.scoringTeam) || {}).name || ('Team ' + tbPick.scoringTeam);
        return el('div', { class: 'qstatus shown good' }, tname + ' · +' + tbPick.points + ' tiebreaker points');
      }
      return el('div', { class: 'qstatus shown bad' }, 'No team scored this tiebreaker');
    }
    const pick = pickRecord(state.currentCategory, state.currentDraw) || {};
    if (pick.scoringTeam) {
      const tname = (state.teams.find((x) => x.number === pick.scoringTeam) || {}).name || ('Team ' + pick.scoringTeam);
      return el('div', { class: 'qstatus shown good' }, tname + ' · +' + pick.points + ' points');
    }
    return el('div', { class: 'qstatus shown bad' }, 'No team scored');
  }
  return el('div', { class: 'qstatus' }); // placeholder during `timing`
}
function renderTeamRow() {
  if (state.stage === 'timing' || state.stage === 'resolved') return el('div', { class: 'team-row' });
  // v5.6: in tiebreaker, the team row shows only the confirmed participants so
  // it cannot be confused with the main-game roster (non-participant teams are
  // not eligible to open or to receive a pass during the tiebreaker).
  const pool = state.inTiebreaker ? tiebreakerPool() : state.teams.map((t) => t.number);
  const chips = state.teams.filter((t) => pool.includes(t.number)).map((t) => {
    const cls = ['team-chip'];
    if (state.stage === 'idle' && state.originatorTeam === t.number) cls.push('active');
    if (state.stage === 'pass') {
      if (t.number === state.originatorTeam) cls.push('passed');
      else if (state.passedTeams.includes(t.number)) cls.push('passed');
      else if (t.number === state.currentPassTeam) cls.push('active');
      else if (t.number === state.passHighlight) cls.push('highlight');
    }
    return el('div', {
      class: cls.join(' '),
      onclick: () => {
        // v5.1: chip click in idle swaps the opener — guard with confirm()
        // so a stray click cannot quietly change who is answering.
        if (state.stage === 'idle') {
          if (t.number === state.originatorTeam) return;
          if (!confirm('Change the opener to Team ' + t.number + '? Team ' + state.originatorTeam + ' will be replaced.')) return;
          setOriginator(t.number);
        } else if (state.stage === 'pass') pickPassTeam(t.number);
      }
    }, [
      el('span', { class: 'n' }, '' + t.number),
      el('span', {}, t.name),
      el('span', { class: 'score' }, '· ' + t.score + ' pts')
    ]);
  });
  // v5.1: simple two-word labels — chips show the state visually.
  const label = state.stage === 'idle'
    ? 'Answering'
    : (state.currentPassTeam ? 'Pass to' : 'Choose next team');
  return el('div', { class: 'team-row' }, [
    el('div', { class: 'label' }, label),
    el('div', { class: 'team-chips' }, chips)
  ]);
}
function renderQActions() {
  const buttons = [];
  if (state.stage === 'idle') {
    buttons.push(el('button', { class: 'btn primary', onclick: startMainTimer, disabled: !state.originatorTeam }, ['Start timer', el('span', { class: 'key' }, 'Space / Enter')]));
  } else if (state.stage === 'timing') {
    buttons.push(el('button', { class: 'btn good', onclick: markCorrect }, ['Got it (+' + DATA.event.pointsOriginal + ')', el('span', { class: 'key' }, 'G')]));
    buttons.push(el('button', { class: 'btn bad', onclick: markWrong }, ['Wrong / time up', el('span', { class: 'key' }, 'W')]));
  } else if (state.stage === 'pass') {
    const canMark = state.currentPassTeam != null;
    buttons.push(el('button', { class: 'btn good', onclick: markCorrect, disabled: !canMark }, ['Got it (+' + DATA.event.pointsPassed + ')', el('span', { class: 'key' }, 'G')]));
    buttons.push(el('button', { class: 'btn bad',  onclick: markWrong,   disabled: !canMark }, ['Wrong', el('span', { class: 'key' }, 'W')]));
  } else if (state.stage === 'resolved') {
    buttons.push(el('button', { class: 'btn primary', onclick: continueAfterResolved }, ['Continue', el('span', { class: 'key' }, 'Space / Enter')]));
  }
  // v5: allow Reveal / Hide in idle too, so preview mode (and casual checks
  // before starting the timer) work via the visible button — not just the key.
  if (state.stage !== 'tb-opener') {
    if (!state.showAnswer) buttons.push(el('button', { class: 'btn', onclick: revealAnswer }, ['Reveal answer', el('span', { class: 'key' }, 'R')]));
    else                   buttons.push(el('button', { class: 'btn', onclick: hideAnswer  }, ['Hide answer',   el('span', { class: 'key' }, 'U')]));
  }
  return el('div', { class: 'qactions' }, buttons);
}

/* ---------- op bar (bottom) ---------- */
function renderOpBar() {
  const hint = settings.showHintStrip ? hintForView() : '';
  const actions = [
    el('button', { onclick: gotoMainBoard }, 'Main board'),
    // Cover (C) — re-reachable any time; from the cover the operator can revisit
    // team setup to rename teams (scores are preserved mid-game).
    el('button', { onclick: gotoCover }, 'Cover (C)'),
    el('button', { onclick: undo, disabled: !canUndo() }, 'Undo (Z)'),
    el('button', { onclick: openRules }, 'Rulebook (B)'),
    el('button', { onclick: openLeaderboard }, 'Leaderboard (L)')
  ];
  // v5.2: Tiebreakers button always present on the op-bar (with T keybinding)
  // so the pool can be reached from any view, not only the main board.
  if (settings.showTiebreakerSection) {
    actions.push(el('button', { onclick: openTiebreakers }, 'Tiebreakers (T)'));
  }
  actions.push(el('button', { onclick: openSettings }, 'Settings (O)'));
  actions.push(el('button', { onclick: openHelp }, 'Help (?)'));
  actions.push(el('button', { onclick: togglePresentation }, state.presentationMode ? 'Show controls' : 'Presentation (F)'));
  return el('div', { class: 'op-bar' }, [
    el('div', { class: 'hint', html: hint }),
    el('div', { class: 'actions' }, actions)
  ]);
}
function hintForView() {
  // v5: per-view + per-stage hints. Global suffix only includes keys that
  // work everywhere; stage-specific keys are prepended so the most relevant
  // shortcuts appear first.
  const globals = '<kbd>L</kbd> Leaderboard · <kbd>B</kbd> Rulebook · <kbd>F</kbd> Presentation · <kbd>?</kbd> Help';
  if (state.view === 'cover') return '<kbd>Enter</kbd> Start setup · ' + globals;
  if (state.view === 'splash') return '<kbd>Enter</kbd> Start quiz · <kbd>Esc</kbd> Back to cover · ' + globals;
  if (state.view === 'main-board') {
    const keys = DATA.categories.map((c) => '<kbd>' + (c.shortcutKey || c.name.charAt(0)) + '</kbd>').join('/');
    return keys + ' Open round' + (settings.showTiebreakerSection ? ' · <kbd>T</kbd> Tiebreakers' : '') + ' · ' + globals;
  }
  if (state.view === 'category-board') {
    const opener = openerForCategory(state.currentCategory);
    if (!opener.confirmed) return '<kbd>← →</kbd> Change opener · <kbd>Enter</kbd> Confirm · <kbd>1–' + state.numTeams + '</kbd> Instant pick · <kbd>Esc</kbd> Back · ' + globals;
    return '<kbd>← →</kbd> Navigate slot · <kbd>Enter</kbd> Pick · <kbd>U</kbd> Change opener · <kbd>Esc</kbd> Back · ' + globals;
  }
  if (state.view === 'tb-setup') return '<kbd>1–' + state.numTeams + '</kbd> Toggle team · <kbd>Enter</kbd> Start tiebreaker · <kbd>Esc</kbd> Back · ' + globals;
  if (state.view === 'tb-board' || state.view === 'tb-jumbled') {
    const tbOpener = state.tbPendingOpener || { team: null, confirmed: false };
    if (!tbOpener.confirmed) return '<kbd>← →</kbd> Change opener · <kbd>Enter</kbd> Confirm · <kbd>1–' + state.numTeams + '</kbd> Instant pick · <kbd>Esc</kbd> Back · ' + globals;
    return '<kbd>← →</kbd> Navigate tiebreaker · <kbd>Enter</kbd> Pick · <kbd>U</kbd> Change opener · <kbd>Esc</kbd> Back · ' + globals;
  }
  if (state.view === 'tb-cat-select') {
    const keys = DATA.categories.map((c) => '<kbd>' + (c.shortcutKey || c.name.charAt(0)) + '</kbd>').join('/');
    return keys + ' Pick category · <kbd>Esc</kbd> Back · ' + globals;
  }
  if (state.view === 'question') {
    if (state.stage === 'tb-opener') return '<kbd>← →</kbd> Move highlight · <kbd>Enter</kbd> Confirm · <kbd>1–' + state.numTeams + '</kbd> Instant · <kbd>Esc</kbd> Cancel · <kbd>Z</kbd> Undo · ' + globals;
    if (state.stage === 'idle') return '<kbd>Space</kbd>/<kbd>Enter</kbd> Start timer · <kbd>1–' + state.numTeams + '</kbd> Swap opener · <kbd>R</kbd> Reveal · <kbd>Esc</kbd> Cancel · <kbd>Z</kbd> Undo · ' + globals;
    if (state.stage === 'timing') return '<kbd>G</kbd> Correct (+10) · <kbd>W</kbd> Wrong/timeout · <kbd>R</kbd> Reveal · <kbd>U</kbd> Hide · <kbd>Z</kbd> Undo · ' + globals;
    if (state.stage === 'pass') {
      const committed = state.currentPassTeam != null;
      const status = committed ? '<strong>Pass team committed</strong> — <kbd>G</kbd>/<kbd>W</kbd> active' : '<em>Highlight only</em> — press <kbd>Enter</kbd> or a number to commit';
      return '<kbd>← →</kbd> Move highlight · ' + status + ' · <kbd>Z</kbd> Undo · ' + globals;
    }
    if (state.stage === 'resolved') return '<kbd>Space</kbd>/<kbd>Enter</kbd> Continue · <kbd>U</kbd> Hide answer · <kbd>Z</kbd> Undo · <kbd>Esc</kbd> Back · ' + globals;
  }
  return globals;
}

/* ---------- leaderboard overlay (round breakdown) ---------- */
// v5.4: scoring-log toggle inside the leaderboard. Mirrors the per-question
// columns of the printed scoring sheet (Opening Team | Chosen Question |
// Scoring Team | Scored Points). Operator-only — accessed via the button on
// the leaderboard overlay so it doesn't expose to participants by default.
function teamNameByNumber(n) {
  if (n == null) return '—';
  const t = state.teams.find((x) => x.number === n);
  return t ? t.name : ('Team ' + n);
}
function scoringLogRows() {
  const out = [];
  for (const cat of DATA.categories) {
    const inCat = state.picks[cat.name] || {};
    // Sort by question order so the log reads chronologically within a category.
    const drawList = Object.keys(inCat)
      .map((d) => parseInt(d, 10))
      .sort((a, b) => a - b);
    for (const d of drawList) {
      const p = inCat[d];
      out.push({
        groupKey: 'R' + roundForCategory(cat.name),
        groupLabel: 'R' + roundForCategory(cat.name) + ' · ' + cat.shortName,
        chosen: 'Question ' + d,
        opener: p.originatorTeam,
        scorer: p.scoringTeam,
        points: p.points || 0,
        passed: (p.passedTeams && p.passedTeams.length) || 0
      });
    }
  }
  // v5.6: tiebreaker rows are appended after the main-game rows in the order
  // they were played, so the log reads chronologically end-to-end.
  for (const p of (state.tbPicks || [])) {
    const phaseLabel = p.phase === 'sudden-death'
      ? ('TB · Sudden death R' + (p.sdRound || '?'))
      : ('TB · Penalty Q' + p.qNum);
    out.push({
      groupKey: 'TB',
      groupLabel: phaseLabel,
      chosen: p.displayLabel || ('TB' + (p.idx + 1)),
      opener: p.originatorTeam,
      scorer: p.scoringTeam,
      points: p.points || 0,
      passed: (p.passedTeams && p.passedTeams.length) || 0
    });
  }
  return out;
}
function renderScoringLog() {
  const rows = scoringLogRows();
  if (!rows.length) return el('div', { style: 'margin-top:14px; color:var(--text-soft);' }, 'No scoring rows yet — the log fills in as questions are played.');
  const head = el('tr', {}, [
    el('th', {}, 'Phase'),
    el('th', {}, 'Question'),
    el('th', {}, 'Opening team'),
    el('th', {}, 'Scoring team'),
    el('th', { class: 'num' }, 'Points')
  ]);
  const body = rows.map((r) => el('tr', {}, [
    el('td', {}, r.groupLabel),
    el('td', {}, r.chosen),
    el('td', {}, teamNameByNumber(r.opener)),
    el('td', {}, r.scorer ? teamNameByNumber(r.scorer) + (r.passed ? (' (after ' + r.passed + ' pass' + (r.passed > 1 ? 'es' : '') + ')') : '') : '— no score'),
    el('td', { class: 'num total' }, r.points ? ('+' + r.points) : '0')
  ]));
  return el('div', { style: 'margin-top:18px;' }, [
    el('h3', { style: 'color:var(--blue); margin-bottom:6px;' }, 'Scoring log'),
    el('div', { style: 'color:var(--text-soft); font-size:13px; margin-bottom:8px;' }, 'Chronological record of every scored question, including tiebreakers. Mirrors the printed scoring sheet.'),
    el('table', {}, [el('thead', {}, [head]), el('tbody', {}, body)])
  ]);
}
function renderLeaderboard() {
  const rows = leaderboardRows();
  const cats = DATA.categories;
  const anyTb = rows.some((r) => r.tieBreak !== 0);
  // v5.6: when a tiebreaker has happened, split the Total column into two:
  //   - "Total (no TB)"  → sum of per-category scores only (= roundsTotal)
  //   - "Total (+ TB)"   → includes tiebreaker points (= team.score)
  // Pre-TB is the meaningful ranking pre-tiebreaker; the TB column shows the
  // delta; Total (+ TB) is the final ranking. Without the split, it is hard
  // to see what the standings looked like before the tiebreaker was played.
  const head = [el('th', {}, '#'), el('th', {}, 'Team')];
  cats.forEach((c) => head.push(el('th', { class: 'num' }, c.shortName)));
  if (anyTb) {
    head.push(el('th', { class: 'num' }, 'Total (no TB)'));
    head.push(el('th', { class: 'num' }, 'TB'));
    head.push(el('th', { class: 'num' }, 'Total (+ TB)'));
  } else {
    head.push(el('th', { class: 'num' }, 'Total'));
  }

  const body = rows.map((r, i) => {
    const tds = [
      el('td', { class: 'rank' }, '#' + (i + 1)),
      el('td', {}, r.name)
    ];
    cats.forEach((c) => tds.push(el('td', { class: 'num' }, '' + r.byCat[c.name])));
    if (anyTb) {
      tds.push(el('td', { class: 'num' }, '' + r.roundsTotal));
      tds.push(el('td', { class: 'num' }, r.tieBreak ? ('+' + r.tieBreak) : '—'));
      tds.push(el('td', { class: 'num total' }, '' + r.total));
    } else {
      tds.push(el('td', { class: 'num total' }, '' + r.total));
    }
    return el('tr', { class: i === 0 ? 'first' : '' }, tds);
  });

  const logShown = !!state.showScoringLog;
  return el('div', { class: 'overlay-mask', onclick: (e) => { if (e.target.classList.contains('overlay-mask')) closeOverlay(); } }, [
    el('div', { class: 'overlay-card leaderboard' }, [
      el('h2', {}, 'Leaderboard'),
      el('table', {}, [
        el('thead', {}, [el('tr', {}, head)]),
        el('tbody', {}, body)
      ]),
      el('div', { class: 'footnote' }, anyTb
        ? 'Total (no TB) is the pre-tiebreaker ranking. TB shows points awarded from tiebreaker questions. Total (+ TB) is the final ranking with tiebreaker points added.'
        : 'Round columns show points earned per category.'),
      logShown ? renderScoringLog() : null,
      el('div', { style: 'display:flex; justify-content:space-between; gap:10px; margin-top:14px;' }, [
        el('div', { style: 'display:flex; gap:8px;' }, [
          el('button', { class: 'btn', onclick: () => { state.showScoringLog = !state.showScoringLog; saveState(); render(); } }, logShown ? 'Hide scoring log' : 'Show scoring log'),
          el('button', { class: 'btn', onclick: exportLeaderboard }, 'Export results (CSV)')
        ]),
        el('button', { class: 'btn primary', onclick: closeOverlay }, ['Close', el('span', { class: 'key' }, 'Esc')])
      ])
    ])
  ]);
}

/* ---------- rulebook overlay (tile reveal, gameplay-focused) ----------
   The tile grid lets the operator surface one section at a time so participants
   read each rule without being buried in a wall of text. Sections are kept
   short and punchy; snake order is folded into the Gameplay section. */
// Builds the rulebook. A fully custom rulebook can be supplied as
// DATA.config.rulebook (array of { key, title, blurb, body[] }); otherwise the
// default sections are generated from the configured categories, timer, and
// point values so the rules always match this event's settings.
function buildRulesSections() {
  if (DATA.config && Array.isArray(DATA.config.rulebook) && DATA.config.rulebook.length) {
    return DATA.config.rulebook.map((s, i) => ({
      key:   s.key || ('rule' + i),
      title: s.title || ('Section ' + (i + 1)),
      blurb: s.blurb || '',
      body:  s.body || []
    }));
  }
  const ev = DATA.event;
  const nRounds   = DATA.categories.length;
  const picks     = ev.picksPerCategoryPerTeam || 2;
  const timer     = ev.timerSeconds || 30;
  const passTimer = ev.passTimerSeconds || 5;
  const ptsO      = ev.pointsOriginal || 10;
  const ptsP      = ev.pointsPassed || 5;
  const per       = (ev.tiebreakerPenaltyPerTeam != null) ? ev.tiebreakerPenaltyPerTeam : 3;
  const passes    = ev.passingEnabled !== false;   // main-round passing on/off
  const catList   = DATA.categories.map((c) => c.name).join(', ');
  const orderText = (ev.openingOrder === 'circular')
    ? 'Teams open in a repeating order (1, 2, …, n, 1, 2, …, n).'
    : 'Teams open in snake order (1, 2, …, n, n, …, 1), reversing each round so the order stays fair.';

  const gameplayBody = [
    nRounds + ' round' + (nRounds === 1 ? '' : 's') + ': ' + catList + '.',
    'Each team answers ' + picks + ' question' + (picks === 1 ? '' : 's') + ' per round'
      + (passes ? ', plus any passed questions.' : '.'),
    orderText
  ];
  if (secondaryEnabled()) gameplayBody.push('Some questions are shown in a second language; answers may be given in either.');
  gameplayBody.push('A tiebreaker may follow if teams are tied for first.');

  return [
    { key: 'team', title: 'Teams', blurb: 'Confer quietly · one final answer',
      body: [
        'Each team discusses quietly and gives one final answer.',
        'Decide who will speak for the team before you begin.'
      ] },
    { key: 'gameplay', title: 'Gameplay',
      blurb: nRounds + ' round' + (nRounds === 1 ? '' : 's') + ' · ' + picks + ' per team · snake order',
      body: gameplayBody },
    { key: 'timing', title: 'Timing',
      blurb: timer + ' seconds · bell at zero' + (passes ? ' · ~' + passTimer + ' s on a pass' : ''),
      body: ([
        'Opening team: ' + timer + ' seconds.',
        'A bell rings when the timer reaches zero.'
      ]).concat(passes
        ? [
            'Passed team: about ' + passTimer + ' seconds, at the quiz master’s discretion.',
            'A passed team gets one attempt at the question.'
          ]
        : ['If the opening team misses, the question is closed — there is no passing.']) },
    { key: 'scoring', title: 'Scoring',
      blurb: '+' + ptsO + ' first try' + (passes ? ' · +' + ptsP + ' on a pass' : '') + ' · no penalty',
      body: ([
        'Answered correctly by the opening team: +' + ptsO + '.'
      ]).concat(passes ? ['Answered correctly after a pass: +' + ptsP + '.'] : [])
        .concat([
          'Wrong answer: no penalty.',
          'The leaderboard shows per-round totals and an overall total.'
        ]) },
    { key: 'tiebreaker', title: 'Tiebreaker',
      blurb: (per > 0 ? (per + ' penalty question' + (per === 1 ? '' : 's') + ' each, then sudden death') : 'sudden death'),
      body: (per > 0
        ? [
            'If teams tie for first, each tied team faces ' + per + ' penalty question' + (per === 1 ? '' : 's') + '.',
            'If still tied after that, sudden death decides it: the tied teams answer in turn.',
            'In sudden death, if one team misses and the other answers it (including on a pass), that other team wins.',
            'If both teams score, or both miss, in the same turn, sudden death continues.'
          ]
        : [
            'If teams tie for first, sudden death decides it: the tied teams answer in turn.',
            'If one team misses and the other answers it (including on a pass), that other team wins.',
            'If both teams score, or both miss, in the same turn, sudden death continues.'
          ]) },
    { key: 'conduct', title: 'Conduct', blurb: 'No phones or outside help',
      body: [
        'No calculators, phones, or outside help — including from the audience.',
        'Wait for the quiz master to finish reading the question.',
        'Keep discussion within your team. Be respectful.',
        'The quiz master’s decision is final.'
      ] }
  ];
}
const RULES_SECTIONS = buildRulesSections();
// v5.4: rulebook is now bigger and supports keyboard nav — arrows / Tab to
// move between sections, Enter to advance, Esc / B to close. The overlay's
// keys are handled inside the global keydown listener (see goToRulesSection).
function goToRulesSection(key) {
  state.rulesOpenKey = key;
  state.rulesProgress = state.rulesProgress || {};
  state.rulesProgress[key] = true;
  saveState(); render();
}
function rulesAdvance(delta) {
  const cur = state.rulesOpenKey || RULES_SECTIONS[0].key;
  const idx = RULES_SECTIONS.findIndex((s) => s.key === cur);
  const next = idx + delta;
  if (next < 0 || next >= RULES_SECTIONS.length) return;
  goToRulesSection(RULES_SECTIONS[next].key);
}
function renderRules() {
  // Default to the first section so the overlay always shows content (the
  // tile grid + an open panel) instead of an empty card.
  const openKey = state.rulesOpenKey || RULES_SECTIONS[0].key;
  const tiles = RULES_SECTIONS.map((s) => {
    const isRead = state.rulesProgress && state.rulesProgress[s.key];
    const isActive = openKey === s.key;
    const cls = ['rules-tile'];
    if (isRead) cls.push('read');
    if (isActive) cls.push('active');
    return el('div', {
      class: cls.join(' '),
      onclick: () => goToRulesSection(s.key)
    }, [
      el('h3', {}, s.title),
      el('div', { class: 'blurb' }, s.blurb)
    ]);
  });
  const idx = RULES_SECTIONS.findIndex((s) => s.key === openKey);
  const s = RULES_SECTIONS[idx];
  const prev = RULES_SECTIONS[idx - 1];
  const next = RULES_SECTIONS[idx + 1];
  // v5.7: Timing section embeds the bell-preview button INSIDE the ordered
  // list, immediately under the "call-bell rings at zero" line (rule #2).
  // For all other sections, the body is a plain <ol>.
  const sectionChildren = [
    el('h3', {}, (idx + 1) + '. ' + s.title)
  ];
  if (s.key === 'timing') {
    const items = s.body.map((line, i) => {
      const li = el('li', {}, line);
      // After the bell rule (index 1, second item), render the preview button
      // as its own non-list-item block so the OL numbering stays intact.
      return [li, i === 1 ? el('div', { style: 'margin: 8px 0 14px 0;' }, [
        el('button', {
          class: 'btn',
          onclick: bellPreview,
          style: 'font-size:clamp(14px,1.2vw,18px); padding:10px 18px;'
        }, '🔔 Hear the timer bell')
      ]) : null];
    });
    // Flatten and drop nulls. The non-li blocks are intentionally siblings of
    // the <ol> so they break the visual list without breaking the numbering.
    sectionChildren.push(el('ol', {}, items.map((pair) => pair[0])));
    // Insert the bell button right after the second item by re-rendering as
    // a custom structure (the simplest path that preserves the OL numbering
    // is to render an <ol> with two items, the button, then a continuing <ol
    // start=3>).
    sectionChildren.pop();
    sectionChildren.push(el('ol', {}, s.body.slice(0, 2).map((line) => el('li', {}, line))));
    sectionChildren.push(el('div', { style: 'margin: 4px 0 10px 28px;' }, [
      el('button', {
        class: 'btn',
        onclick: bellPreview,
        style: 'font-size:clamp(14px,1.2vw,18px); padding:10px 18px;'
      }, '🔔 Hear the timer bell')
    ]));
    sectionChildren.push(el('ol', { start: 3 }, s.body.slice(2).map((line) => el('li', {}, line))));
  } else {
    sectionChildren.push(el('ol', {}, s.body.map((line) => el('li', {}, line))));
  }
  sectionChildren.push(el('div', { class: 'rules-nav' }, [
    prev ? el('button', { class: 'btn', onclick: () => goToRulesSection(prev.key) }, '← ' + prev.title) : el('span', {}, ''),
    next ? el('button', { class: 'btn primary', onclick: () => goToRulesSection(next.key) }, next.title + ' →') : el('button', { class: 'btn primary', onclick: dismissRules }, 'Done · close rulebook')
  ]));
  const section = el('div', { class: 'rules-section' }, sectionChildren);
  // Auto-mark the default-open first section as read on first view.
  if (!state.rulesProgress || !state.rulesProgress[openKey]) {
    state.rulesProgress = state.rulesProgress || {};
    state.rulesProgress[openKey] = true;
    // No render() here — already inside one. The class will catch up next tick.
  }
  return el('div', { class: 'overlay-mask', onclick: (e) => { if (e.target.classList.contains('overlay-mask')) dismissRules(); } }, [
    el('div', { class: 'overlay-card rules-card' }, [
      el('h2', {}, 'Rulebook'),
      el('p', {}, 'Click a tile to reveal that section. Sections you have read turn green; the active section is highlighted.'),
      el('div', { class: 'rules-tiles' }, tiles),
      section,
      el('div', { class: 'rules-keyhint' }, [
        el('kbd', {}, '← →'), ' between sections · ',
        el('kbd', {}, 'Enter'), ' next · ',
        el('kbd', {}, 'Esc'), ' or ',
        el('kbd', {}, 'B'), ' close'
      ]),
      el('div', { style: 'display:flex; justify-content:flex-end; margin-top:10px;' }, [
        el('button', { class: 'btn', onclick: dismissRules }, ['Close', el('span', { class: 'key' }, 'Esc / B')])
      ])
    ])
  ]);
}

/* ---------- boot ---------- */
// Set the browser tab/window title from the event so it is not the generic
// placeholder baked into the static HTML.
if (DATA.event.title) document.title = DATA.event.title;

// Inject the secondary-language font and colour from config. Doing it here
// (rather than hardcoding in CSS) keeps the runner language-agnostic: a single
// rule restyles every .secondary-lang element wherever it appears. We use
// !important so it wins over the per-context size rules' inherited colour.
(function applySecondaryLanguage() {
  const sl = DATA.config && DATA.config.secondaryLanguage;
  if (!sl || !sl.enabled) return;
  const decls = [];
  if (sl.font)   decls.push('font-family: ' + sl.font + ' !important;');
  if (sl.colour) decls.push('color: ' + sl.colour + ' !important;');
  if (!decls.length) return;
  const style = document.createElement('style');
  style.textContent = '.secondary-lang { ' + decls.join(' ') + ' }';
  document.head.appendChild(style);
})();

if (state.presentationMode) document.body.classList.add('presentation');
render();
</script>
</body>
</html>
