<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz Runner</title>
<style>
  /* ============================================================
     Palette. A warm-white background keeps the accent colours easy
     on the eye at projector distance.
       --blue   primary actions, draw numbers, slot numbers, headings
       --green  used by the green category tile (and a common accent)
       --ans    answer-panel maroon
       --teal   header underline and secondary accents
     Category tiles map their `colour` to the tile-* classes further down.
     ============================================================ */
  :root {
    --bg: #fbf9f4;
    --bg-soft: #f1ebde;
    --panel: #ffffff;
    --border: #d8d2c4;
    --line: #c8c0ad;

    --blue: #00468c;             /* text, draw numbers, headings */
    --blue-bg: #ebf2fa;          /* pastel category fill */
    --blue-border: #dce6f3;
    --blue-soft: #4775b3;
    --teal: #345e5c;             /* header rule, secondary accents */
    --teal-bg: #e8efee;
    --green: #006e3c;
    --green-bg: #e8f2ec;         /* soft mint tile fill */
    --ans: #780000;
    --ans-bg: #fdecec;
    --warm-bg: #faecd5;          /* soft amber tile fill */
    --warm-border: #ecdcc4;

    --text: #2a2e34;
    --text-soft: #5b6471;
    --text-dim: #8a8f99;
    --good: #1f7a3f;
    --good-bg: #d9f0e1;
    --bad: #a83242;
    --bad-bg: #fbe1e4;
    --warn: #a87a14;
    --warn-bg: #fcf1d0;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Helvetica Neue', Arial, sans-serif;
    overflow: hidden;
  }
  /* Secondary-language text. The font family and colour are injected at
     runtime from DATA.config.secondaryLanguage (see applySecondaryLanguage()),
     so this rule only needs a sensible cross-platform fallback stack. The same
     stack covers Devanagari, CJK, Arabic, etc. when no custom font is set. */
  .secondary-lang {
    font-family: 'Noto Sans', 'Noto Sans Devanagari', 'Noto Sans CJK SC',
                 'Hiragino Sans', 'Arial Unicode MS', sans-serif;
  }

  /* ---------- app shell: header / stage / op-bar ----------
     Most sizes use clamp(min, viewport-relative, max) so the same runner reads
     well on a small laptop and scales up on a large external display or
     projector without any per-device tweaking. */
  #app {
    display: grid;
    grid-template-rows: clamp(96px, 9vh, 156px) 1fr clamp(40px, 4vh, 64px);
    height: 100vh;
  }
  body.cover-view #app { display: block; height: 100vh; }
  body.cover-view #app > .stage { height: 100vh; overflow: auto; }
  .app-header {
    background: var(--panel);
    border-bottom: 2px solid var(--teal);
    padding: clamp(8px, 1vh, 18px) clamp(18px, 2.5vw, 40px);
    display: grid;
    grid-template-columns: clamp(180px, 18vw, 320px) 1fr clamp(180px, 18vw, 320px);
    align-items: center;
    gap: 18px;
  }
  .app-header .logo-slot { display: flex; align-items: center; }
  .app-header .logo-slot.right { justify-content: flex-end; }
  /* Logo max-height and title fonts use clamp() so the same runner reads well
     on a laptop and scales up on a large external display / projector. */
  .app-header img { max-height: clamp(72px, 7.5vh, 124px); max-width: 100%; object-fit: contain; }
  .app-header .title-block { text-align: center; }
  .app-header .title-block .en { color: var(--blue); font-weight: 700; font-size: clamp(28px, 2.6vw, 56px); line-height: 1.05; letter-spacing: 0.5px; }
  .app-header .title-block .secondary-lang { font-size: clamp(20px, 1.9vw, 40px); line-height: 1.2; }
  body.presentation .app-header { background: var(--bg); }

  .op-bar {
    background: var(--blue);
    color: #fff;
    padding: 0 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 13px;
  }
  .op-bar .hint { flex: 1; opacity: 0.92; }
  .op-bar .hint kbd {
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.32);
    border-radius: 4px;
    padding: 1px 6px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    margin: 0 2px;
  }
  .op-bar .actions { display: flex; gap: 6px; }
  .op-bar button {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  .op-bar button:hover { background: rgba(255,255,255,0.22); }
  body.presentation .op-bar { display: none; }

  .stage {
    overflow: auto;
    padding: 18px 32px 22px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  /* ---------- buttons (no transforms — keeps bounding box stable) ---------- */
  button.btn {
    font: inherit;
    cursor: pointer;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 16px;
    border-radius: 6px;
    font-size: 14px;
    user-select: none;
  }
  button.btn:hover { background: var(--bg-soft); }
  button.btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  button.btn.primary { background: var(--blue); color: #fff; border-color: var(--blue); }
  button.btn.primary:hover { background: var(--blue-soft); }
  button.btn.teal { background: var(--teal); color: #fff; border-color: var(--teal); }
  button.btn.teal:hover { background: #4b7c79; }
  button.btn.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  button.btn.good:hover { background: #c6e7d2; }
  button.btn.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  button.btn.bad:hover { background: #f5cdd2; }
  button.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
  button.btn .key {
    display: inline-block;
    background: rgba(0,0,0,0.06);
    border-radius: 4px;
    padding: 1px 6px;
    margin-left: 8px;
    font-size: 11px;
    font-family: ui-monospace, Menlo, monospace;
    opacity: 0.85;
  }
  button.btn.primary .key,
  button.btn.teal .key { background: rgba(255,255,255,0.22); }

  /* ---------- splash ----------
     v5.7: page now opens with a clear "Team Setup" header + a subtitle in
     parentheses (matches the header pattern used elsewhere). Credits are
     pushed to the bottom via space-between so the form sits visually in the
     upper third while the supporters lineup hugs the page foot. */
  .splash {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    text-align: center;
    padding: clamp(18px, 3vh, 40px) clamp(20px, 3vw, 60px) clamp(14px, 2vh, 28px);
  }
  /* v5.7: splash header — matches the cover-title visual hierarchy.
     The h2 is the main label, the .sub line in parentheses is the cue. */
  .splash .setup-header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    margin-bottom: clamp(6px, 1vh, 14px);
  }
  .splash .setup-header h2 {
    margin: 0;
    color: var(--blue);
    font-size: clamp(28px, 2.6vw, 48px);
    font-weight: 700;
  }
  .splash .setup-header .sub {
    color: var(--text-soft);
    font-size: clamp(14px, 1.2vw, 19px);
    font-style: italic;
  }
  .splash .form-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .splash .credits-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(8px, 1.2vh, 16px);
    margin-top: auto;
  }
  .splash .org-row { display: flex; gap: 22px; align-items: center; justify-content: center; }
  .splash .org-row img { height: 64px; max-width: 180px; object-fit: contain; }
  .splash h1 { margin: 10px 0 0; font-size: 40px; color: var(--blue); }
  .splash .meta { color: var(--text-soft); }
  .splash .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 22px;
    margin-top: 10px;
    min-width: 540px;
  }
  .splash .row { display: flex; align-items: center; gap: 12px; margin: 6px 0; }
  .splash label { width: 110px; text-align: right; color: var(--text-soft); font-size: 14px; }
  .splash input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 6px;
    font: inherit;
  }
  .splash input[type=number] { max-width: 80px; }
  /* Credit / footer line under the team-setup form. */
  .splash .assoc { color: var(--text-dim); font-size: 14px; margin-top: 10px; }
  .splash .assoc-logos { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; margin-top: 4px; }
  .splash .assoc-logos img { height: 38px; max-width: 130px; object-fit: contain; opacity: 0.88; }

  /* ---------- main board (category tiles) ----------
     v5.3: tile h2 centered + scaled with viewport so the category names read
     from the back of the hall. Tile padding stays modest so the bigger
     header has room to breathe. */
  .main-board {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(14px, 1.5vw, 28px);
    align-items: stretch;
    margin: clamp(8px, 1vh, 20px) 0;
  }
  .cat-tile {
    background: var(--blue-bg);
    border: 1px solid var(--blue-border);
    border-radius: 14px;
    padding: clamp(14px, 1.4vw, 26px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    text-align: center;
    gap: clamp(8px, 1vh, 18px);
    cursor: pointer;
    transition: filter 0.12s, border-color 0.12s;
  }
  /* Named category-tile colours. config.json sets a `colour` per category and
     build.js maps it to one of these classes. Add more here if you need them. */
  .cat-tile.tile-blue   { background: var(--blue-bg);  border-color: var(--blue-border); }
  .cat-tile.tile-green  { background: var(--green-bg); border-color: #d4e6da; }
  .cat-tile.tile-amber  { background: var(--warm-bg);  border-color: var(--warm-border); }
  .cat-tile.tile-teal   { background: var(--teal-bg);  border-color: #cfe0de; }
  .cat-tile.tile-purple { background: #efe9f7;         border-color: #ddd0ee; }
  .cat-tile.tile-rose   { background: #fbe9ec;         border-color: #f2d2d9; }
  .cat-tile:hover { filter: brightness(0.97); border-color: var(--blue); }
  /* v5.4: bumped 15% from v5.3 (20→23, 2.2→2.5, 44→50). */
  .cat-tile h2 { margin: 0; font-size: clamp(23px, 2.5vw, 50px); color: var(--blue); line-height: 1.2; }
  .cat-tile .sub { color: var(--text-soft); font-size: clamp(12px, 1vw, 20px); }
  .cat-tile .progress { color: var(--text-soft); font-size: clamp(12px, 1vw, 20px); }
  .cat-tile .progress-bar { background: var(--bg-soft); height: 10px; border-radius: 5px; overflow: hidden; width: 100%; }
  .cat-tile .progress-bar > div { background: var(--blue); height: 100%; transition: width 0.3s; }
  .cat-tile .tile-head { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cat-tile .shortcut {
    display: inline-block;
    background: var(--blue-bg);
    color: var(--blue);
    border: 1px solid var(--blue);
    border-radius: 4px;
    padding: 1px 8px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    font-weight: 600;
  }
  .secondary-actions { display: flex; gap: 12px; justify-content: center; padding: 6px 0 0; }

  /* ---------- category / tiebreaker boards: compact slot grid ---------- */
  .board-head { display: flex; align-items: baseline; justify-content: space-between; }
  .board-head h2 { margin: 0; color: var(--blue); font-size: 24px; }
  .board-head .sub { color: var(--text-soft); font-size: 13px; }
  .slot-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 12px;
    padding: 14px 0;
    align-content: start;
  }
  .slot-grid.tb { grid-template-columns: repeat(5, 1fr); }
  .slot {
    aspect-ratio: 1.4 / 1;
    background: var(--blue-bg);
    border: 1px solid var(--blue-border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: filter 0.1s, border-color 0.1s;
    position: relative;
  }
  .slot .num { font-size: 28px; font-weight: 700; color: var(--blue); line-height: 1; }
  .slot.focus { border-color: var(--blue); background: #d6e3f4; }
  .slot:hover { border-color: var(--blue); filter: brightness(0.96); }
  .slot.done {
    background: var(--bg-soft);
    border-style: dashed;
    cursor: not-allowed;
  }
  .slot.done .num { color: var(--text-dim); }
  .slot.done .tag {
    position: absolute;
    bottom: 4px;
    font-size: 10px;
    color: var(--text-dim);
    font-family: ui-monospace, Menlo, monospace;
  }
  .slot.done:hover { background: var(--bg-soft); border-color: var(--border); }
  /* Tiebreaker slots show the source ID since the operator needs it; */
  /* main board slots intentionally hide it from participant view.   */
  .slot-grid.tb .slot .num { font-size: 22px; }
  .slot-grid.tb .slot .sid { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

  /* ============================================================
     Question view layout:
       row 1: meta strip (top-left) + timer (top-right)
       row 2: question text (flex-grows, on top)
       row 3: image bay (only present when imageFile set)
       row 4: answer panel (visibility-flipped; height reserved)
       row 5: status banner (visibility-flipped; height reserved)
       row 6: team chips (only when relevant stage)
       row 7: action buttons
     No dashed placeholder when image is absent — the space is
     simply unused, but rows above/below still occupy their natural
     positions so the question text always lives at the top.
     ============================================================ */
  .qview {
    /* v5.7: shrink-to-content so the qstatus/team-row/qactions below it
       sit immediately under the question (instead of pushed to the bottom
       of the available stage area). */
    flex: 0 1 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 0;
  }
  .qlower {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 8px;
  }
  .qmeta-row {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: start;
    gap: 18px;
  }
  .qmeta {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: baseline;
    color: var(--text-soft);
    font-size: 14px;
  }
  .qmeta .draw {
    color: var(--blue);
    font-weight: 700;
    font-size: 22px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .qmeta .pill {
    background: var(--teal-bg);
    color: var(--teal);
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 12px;
  }
  .qmeta .cat { color: var(--text-dim); font-size: 13px; }

  /* v5.5: question container expanded to use most of the screen width on
     bigger displays — was capped near 1200 px, leaving big margins on a 27".
     Switched to min(2200px, 94vw) so it scales naturally with viewport.
     v5.7: alignment switched from center to flex-start so the question text
     sits high on the page (was vertically centred, which floated it down on
     short prompts). qview also no longer flex-grows so the status/team-row/
     actions block at the bottom moves up alongside the question. */
  .qquestion {
    flex: 0 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    text-align: center;
    gap: 14px;
    padding: clamp(6px, 0.8vh, 14px) clamp(16px, 2vw, 48px);
    min-height: 80px;
  }
  .qquestion .eng { color: var(--blue); font-size: clamp(24px, 2.6vw, 60px); line-height: 1.3; max-width: min(2200px, 94vw); }
  .qquestion .secondary-lang { font-size: clamp(20px, 2.2vw, 52px); line-height: 1.45; max-width: min(2200px, 94vw); }

  .qimage {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    max-height: 30vh;
  }
  .qimage img {
    max-height: 36vh;
    max-width: 90vw;
    object-fit: contain;
    border-radius: 8px;
  }
  .qimage .missing {
    color: var(--bad);
    font-size: 13px;
    background: var(--bad-bg);
    border: 1px solid var(--bad);
    padding: 8px 14px;
    border-radius: 6px;
  }

  .qanswer {
    flex: 0 0 auto;
    background: var(--ans-bg);
    border: 1px solid var(--ans);
    border-radius: 10px;
    padding: 12px 18px;
    color: var(--ans);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    visibility: hidden;
    min-height: 70px;
  }
  .qanswer.shown { visibility: visible; }
  .qanswer .eng { font-size: 22px; font-style: italic; }
  .qanswer .secondary-lang { font-size: 20px; font-style: italic; margin-top: 4px; }

  /* ---------- timer ring (top-right of qmeta row) ---------- */
  .qtimer-slot { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .timer {
    --pct: 1;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: conic-gradient(var(--blue) calc(var(--pct) * 360deg), var(--bg-soft) 0);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  .timer::before {
    content: '';
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: var(--panel);
  }
  .timer .num {
    position: relative;
    z-index: 1;
    font-size: 32px;
    font-weight: 700;
    color: var(--blue);
    font-variant-numeric: tabular-nums;
  }
  .timer.warn { background: conic-gradient(var(--warn) calc(var(--pct) * 360deg), var(--bg-soft) 0); }
  .timer.warn .num { color: var(--warn); }
  .timer.danger { background: conic-gradient(var(--bad) calc(var(--pct) * 360deg), var(--bg-soft) 0); }
  .timer.danger .num { color: var(--bad); }
  .timer.idle { background: var(--bg-soft); }
  .timer.idle .num { color: var(--text-dim); }
  .timer-label { color: var(--text-soft); font-size: 11px; text-align: center; max-width: 160px; }

  /* ---------- status banner + team chips + action buttons ----------
     v5.7: status banner is now centred at ~half-width with a taller
     vertical footprint (~+20%). Reads more like a callout than a
     wall-spanning bar. */
  .qstatus {
    padding: 12px 20px;
    border-radius: 8px;
    background: var(--warn-bg);
    border: 1px solid var(--warn);
    color: var(--warn);
    font-size: 16px;
    text-align: center;
    visibility: hidden;
    min-height: 44px;
    max-width: 50%;
    width: clamp(280px, 50%, 640px);
    margin: 0 auto;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .qstatus.shown { visibility: visible; }
  .qstatus.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
  .qstatus.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
  .qstatus.blue { background: var(--blue-bg); border-color: var(--blue); color: var(--blue); }

  .team-row {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    min-height: 60px;
  }
  .team-row .label { color: var(--text-soft); font-size: 13px; }
  .team-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .team-chip {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 12px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .team-chip:hover { background: var(--blue-bg); border-color: var(--blue); }
  .team-chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .team-chip.highlight {
    background: var(--blue-bg);
    border-color: var(--blue);
    box-shadow: 0 0 0 2px var(--blue-bg);
    outline: 2px dashed var(--blue);
    outline-offset: 2px;
  }
  .team-chip.passed { opacity: 0.55; text-decoration: line-through; cursor: not-allowed; }
  .team-chip .n {
    background: var(--blue-bg);
    color: var(--blue);
    padding: 2px 7px;
    border-radius: 4px;
    font-weight: 700;
    font-size: 12px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .team-chip.active .n { background: rgba(255,255,255,0.25); color: #fff; }
  .team-chip .score { font-size: 12px; color: var(--text-dim); }
  .team-chip.active .score { color: rgba(255,255,255,0.85); }

  .qactions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; min-height: 42px; }

  /* ---------- overlays (help, settings, leaderboard) ---------- */
  .overlay-mask {
    position: fixed;
    inset: 0;
    background: rgba(20, 25, 30, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99;
  }
  .overlay-card {
    background: var(--panel);
    border-radius: 14px;
    padding: 24px 28px;
    max-width: 880px;
    max-height: 86vh;
    width: 90vw;
    overflow: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }
  .overlay-card h2 { margin-top: 0; color: var(--blue); }
  .overlay-card h3 { color: var(--teal); margin-top: 18px; margin-bottom: 6px; }
  .overlay-card kbd {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 12px;
    margin: 0 1px;
  }
  .overlay-card table { width: 100%; border-collapse: collapse; }
  .overlay-card td { padding: 5px 10px; vertical-align: top; font-size: 14px; }
  .overlay-card td:first-child { white-space: nowrap; width: 220px; }
  .overlay-card p { color: var(--text-soft); line-height: 1.5; font-size: 14px; }
  .overlay-card code {
    background: var(--bg-soft);
    border-radius: 4px;
    padding: 1px 5px;
    font-family: ui-monospace, Menlo, monospace;
    font-size: 13px;
  }

  /* ---------- leaderboard overlay ----------
     v5.7: card dimensions bumped — the leaderboard now reads at nearly twice
     the previous height so per-round columns, the scoring log, and the
     pre-TB/Total split don't crowd. Cap to viewport so it stays scrollable
     on smaller laptop screens. */
  .overlay-card.leaderboard {
    max-width: min(1200px, 92vw);
    width: min(1200px, 92vw);
    max-height: 95vh;
    height: min(95vh, 1200px);
  }
  .leaderboard h2 { font-size: 32px; }
  .leaderboard table { font-size: 18px; margin-top: 12px; }
  .leaderboard th { text-align: left; padding: 8px 12px; color: var(--text-soft); font-weight: 600; border-bottom: 2px solid var(--blue); }
  .leaderboard td { padding: 9px 12px; border-bottom: 1px solid var(--bg-soft); }
  .leaderboard td.rank { width: 50px; color: var(--text-soft); font-family: ui-monospace, Menlo, monospace; }
  .leaderboard td.num, .leaderboard th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .leaderboard td.total { color: var(--blue); font-weight: 700; }
  .leaderboard tr.first td { background: var(--blue-bg); }
  .leaderboard tr.first td.total { color: var(--blue); }
  .leaderboard .footnote { color: var(--text-dim); font-size: 12px; margin-top: 12px; }

  /* ---------- settings overlay ---------- */
  .settings .row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 10px 0;
    border-bottom: 1px solid var(--bg-soft);
  }
  .settings .row:last-child { border-bottom: none; }
  .settings .row .desc { flex: 1; }
  .settings .row .desc .label { font-weight: 600; color: var(--text); }
  .settings .row .desc .hint { font-size: 12px; color: var(--text-soft); }
  .toggle {
    position: relative;
    width: 44px;
    height: 24px;
    background: var(--bg-soft);
    border-radius: 12px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.15s;
  }
  .toggle::after {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 18px; height: 18px;
    background: var(--panel);
    border-radius: 50%;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
    transition: left 0.15s;
  }
  .toggle.on { background: var(--blue); border-color: var(--blue); }
  .toggle.on::after { left: 22px; }

  /* ---------- pick-team stage (legacy; kept for tiebreaker fallback) ---------- */
  .pick-team {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
  }
  .pick-team .big-draw {
    font-size: 96px;
    font-weight: 700;
    color: var(--blue);
    line-height: 1;
    font-family: ui-monospace, Menlo, monospace;
  }
  .pick-team .draw-label { color: var(--text-soft); font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
  .pick-team .prompt { color: var(--teal); font-size: 22px; font-weight: 600; }
  .pick-team .sub { color: var(--text-soft); font-size: 14px; }

  /* ============================================================
     Cover page. Press Enter or click "Start setup" to advance to the
     team-setup splash. Uses space-between so content fills the page
     top-to-bottom instead of clustering in the middle; all sizes scale
     with the viewport.
     ============================================================ */
  .cover {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    text-align: center;
    padding: clamp(28px, 5vh, 80px) clamp(20px, 4vw, 80px);
    min-height: 100vh;
    gap: clamp(10px, 1.5vh, 24px);
  }
  /* Group 1 — festival + organiser at the top. */
  .cover .top-group { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 0.8vh, 14px); margin-bottom: clamp(-6px, -0.8vh, -14px); }
  /* Group 2 — collaborators in the middle */
  .cover .mid-group { display: flex; flex-direction: column; align-items: center; gap: clamp(4px, 0.6vh, 10px); }
  /* Group 3 — runner title + date/venue + CTA (extra top margin on .cta below) */
  .cover .title-group { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 1.5vh, 22px); }
  /* Group 4 — supporters footer */
  .cover .footer-group { display: flex; flex-direction: column; align-items: center; gap: clamp(6px, 1vh, 14px); }
  /* v5.7: push the Start setup CTA visibly below the location/date line so it
     reads as the next action rather than a footnote of the venue text. */
  .cover .cta { margin-top: clamp(18px, 3vh, 44px); }
  /* Festival headline can stretch wide so a long name stays on one line on
     common laptops/projectors. `text-wrap: balance` distributes the wrap
     cleanly when it does have to break (older browsers fall back gracefully). */
  .cover .fest {
    font-size: clamp(22px, 2.4vw, 56px);
    color: var(--blue);
    font-weight: 700;
    max-width: min(1800px, 94vw);
    line-height: 1.2;
    text-wrap: balance;
  }
  .cover .org-line { color: var(--text-soft); font-size: clamp(14px, 1.3vw, 26px); }
  .cover .org-line strong { color: var(--teal); }
  .cover .org-logo img { height: clamp(60px, 7vh, 110px); object-fit: contain; }
  .cover .collab-row { display: flex; gap: clamp(20px, 3vw, 60px); align-items: center; justify-content: center; }
  .cover .collab-row img { height: clamp(70px, 8vh, 130px); max-width: 240px; object-fit: contain; }
  /* A logo that reads small at equal height (lots of transparent padding) can be
     enlarged per-logo via the `scale` option in the config — see logoImg(). */
  .cover .runner-title { font-size: clamp(32px, 3.4vw, 68px); color: var(--blue); font-weight: 700; line-height: 1.1; }
  .cover .runner-title .secondary-lang { font-size: clamp(22px, 2.4vw, 50px); font-weight: 500; display: block; margin-top: clamp(2px, 0.5vh, 8px); }
  .cover .when  { color: var(--text); font-size: clamp(16px, 1.5vw, 28px); }
  .cover .where { color: var(--text); font-size: clamp(14px, 1.3vw, 24px); }
  .cover .supporters-label { color: var(--text-soft); font-size: clamp(12px, 1.1vw, 20px); }
  .cover .supporters-row { display: flex; gap: clamp(18px, 2.5vw, 40px); align-items: center; justify-content: center; flex-wrap: wrap; }
  .cover .supporters-row img { height: clamp(40px, 5vh, 80px); max-width: 200px; object-fit: contain; opacity: 0.9; }
  .cover .cta .btn { font-size: clamp(15px, 1.4vw, 26px); padding: clamp(11px, 1.2vh, 18px) clamp(22px, 2.4vw, 44px); }

  /* ---------- opener strip (top of category-board) ----------
     v5.3: strip + confirm button scaled up so it's the dominant CTA when
     the operator is mid-flow. */
  .opener-strip {
    background: var(--blue-bg);
    border: 1px solid var(--blue-border);
    border-radius: 12px;
    padding: clamp(14px, 1.6vh, 22px) clamp(16px, 1.8vw, 26px);
    margin-bottom: clamp(12px, 1.5vh, 22px);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: clamp(12px, 1.5vw, 22px);
  }
  .opener-strip .label { color: var(--teal); font-weight: 600; font-size: clamp(15px, 1.4vw, 26px); min-width: 150px; }
  .opener-strip .chips { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
  .opener-strip .actions { display: flex; gap: 10px; }
  .opener-strip.confirmed { background: var(--good-bg); border-color: var(--good); }
  .opener-strip.confirmed .label { color: var(--good); }
  /* Bigger CTA: the "Confirm opener" button is the most-used affordance on
     this surface — it deserves to be eye-catching. */
  .opener-strip .actions .btn {
    font-size: clamp(14px, 1.2vw, 22px);
    padding: clamp(10px, 1vh, 16px) clamp(18px, 1.8vw, 32px);
  }
  .slot-grid.disabled .slot {
    opacity: 0.45;
    cursor: not-allowed;
    pointer-events: none;
  }

  /* ---------- round-end banner (v5) ---------- */
  .round-banner {
    background: var(--good-bg);
    border: 1px solid var(--good);
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 14px;
  }
  .round-banner .text { flex: 1; color: var(--good); font-size: 15px; }
  .round-banner .text strong { color: var(--good); }
  .round-banner .actions { display: flex; gap: 8px; }

  .rules-card h3 { color: var(--blue); }
  .rules-card .toc {
    background: var(--blue-bg);
    border: 1px solid var(--blue-border);
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 14px;
    font-size: 13px;

    display: inline-block;
    background: var(--warn-bg);

  .settings h3 { color: var(--blue); margin-top: 18px; margin-bottom: 6px; font-size: 15px; border-bottom: 1px solid var(--bg-soft); padding-bottom: 4px; }

  /* ---------- jumbled tiebreaker grid (v5) ---------- */
  .slot-grid.tb-jumbled { grid-template-columns: repeat(6, 1fr); }
  .slot-grid.tb-jumbled .slot { aspect-ratio: 1.2 / 1; }
  .slot-grid.tb-jumbled .slot .cat-mini {
    font-size: 9px;
    color: var(--text-dim);
    margin-top: 2px;
    text-transform: uppercase;
    letter-spacing: 0.5px;

     even in presentation mode so the operator never has to recall keys
     blind. Click to expand a per-view shortcut list. */
  .hints-pill {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 90;
    background: rgba(0, 70, 140, 0.92);
    color: #fff;
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);

    line-height: 1.4;

    margin: 0 1px;

  .hints-pill.expanded {
    border-radius: 12px;
    padding: 12px 18px;
    max-width: 540px;
    line-height: 1.7;
  }
  .hints-pill .pill-toggle { font-size: 11px; opacity: 0.8; margin-left: 8px; }
  .hints-pill.hidden { display: none; }

  /* ---------- rulebook (v5.6: constant card size; section scrolls) ----------
     Card dimensions are now FIXED so the popup never shrinks/grows as the
     active tile changes. The card uses flex column layout; the section panel
     takes the remaining height and scrolls internally if a section's body
     ever outgrows it. Tile grid + nav stay at constant size. */
  .overlay-card.rules-card {
    width: min(1100px, 92vw);
    /* v5.7: vertical size bumped — the rulebook content now reads more
       comfortably without scrolling on the 27" projector. */
    height: min(94vh, 1000px);
    max-width: none;
    max-height: none;
    padding: clamp(20px, 2.5vh, 36px) clamp(24px, 3vw, 48px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .rules-card > h2 { flex: 0 0 auto; margin-bottom: 4px; }
  .rules-card > p { flex: 0 0 auto; margin-top: 0; }
  .rules-card .rules-tiles {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: clamp(10px, 1.2vw, 18px);
    margin: clamp(12px, 1.4vh, 20px) 0;
    flex: 0 0 auto;
  }
  .rules-card .rules-tile {
    background: var(--blue-bg);
    border: 1px solid var(--blue-border);
    border-radius: 12px;
    padding: clamp(14px, 1.6vh, 22px) clamp(16px, 1.8vw, 24px);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s, transform 0.08s;
  }
  .rules-card .rules-tile:hover { background: #dbe7f5; border-color: var(--blue); }
  .rules-card .rules-tile.read {
    background: var(--good-bg);
    border-color: var(--good);
  }
  .rules-card .rules-tile.active {
    background: var(--blue);
    border-color: var(--blue);
    color: #fff;
  }
  .rules-card .rules-tile.active h3,
  .rules-card .rules-tile.active .blurb { color: #fff; }
  .rules-card .rules-tile h3 { margin: 0 0 4px; color: var(--blue); font-size: clamp(15px, 1.3vw, 22px); }
  .rules-card .rules-tile .blurb { color: var(--text-soft); font-size: clamp(12px, 1vw, 18px); line-height: 1.4; }
  .rules-card .rules-section {
    background: var(--bg-soft);
    border-radius: 12px;
    padding: clamp(16px, 2vh, 26px) clamp(20px, 2.4vw, 32px);
    margin-top: clamp(12px, 1.5vh, 20px);
    font-size: clamp(14px, 1.15vw, 20px);
    line-height: 1.55;
    flex: 1 1 auto;
    overflow-y: auto;
    min-height: 0;
  }
  .rules-card .rules-nav,
  .rules-card .rules-keyhint,
  .rules-card .rules-footer-actions { flex: 0 0 auto; }
  .rules-card .rules-section h3 { margin-top: 0; color: var(--blue); font-size: clamp(18px, 1.6vw, 28px); }
  .rules-card .rules-section ol { padding-left: 1.4em; }
  .rules-card .rules-section li { margin-bottom: 0.5em; }
  .rules-card .rules-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: clamp(12px, 1.5vh, 20px);
    gap: 10px;
  }
  .rules-card .rules-keyhint {
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    margin-top: 6px;
  }

const STORAGE_KEY = 'quiz-runner-' + _STORAGE_SLUG;
const SETTINGS_KEY = 'quiz-runner-' + _STORAGE_SLUG + '-settings';
// Logos are supplied fully-resolved in DATA.assets.logos (base64 data URIs when
// images are embedded, or relative paths otherwise) — there is no logo prefix.
// IMAGE_PREFIX only matters in non-embed mode, where question images are
// referenced by relative path; build.js puts that prefix in DATA.meta.
const IMAGE_PREFIX = (DATA.meta && DATA.meta.imagePrefix) || '';

/* ============================================================
   State machine
   The question view has five stages — `pre` was added in v3 so
   the operator can pick the opening team BEFORE the question is
   shown on the projector. Without this, teams got an extra few
   seconds of unfair preview while a team was being chosen.
   ============================================================ */
function initialState() {
  return {
    view: 'cover',                  // v5: 'cover' → 'splash' → 'main-board' → ...
    numTeams: DATA.event.teamsDefault || 4,
    teams: [],
    picks: {},
    currentCategory: null,
    currentDraw: null,
    inTiebreaker: false,
    tbIndex: 0,
    tbCategoryForJumbled: null,      // v5: when jumbled mode picks a TB, remember its home category
    // v5: 'pre' stage removed — opener is set up FRONT in category-board, then
    // pickSlot drops the user straight into 'idle' with the originator already
    // committed. Stages now: idle | timing | pass | resolved.
    stage: 'idle',
    originatorTeam: null,
    originatorHighlight: null,       // still used while user is choosing opener on the category board
    currentPassTeam: null,
    passHighlight: null,
    passedTeams: [],
    timerSeconds: DATA.event.timerSeconds || 30,
    timerExpiresAt: null,
    showAnswer: false,
    focusSlot: 0,
    // v5: per-category "opener confirmed for next pick" flag. Reset after every
    // resolved/cancelled question so the operator confirms the opener again
    // for the next draw in that category.
    pendingOpener: {},               // { [categoryName]: { team: number, confirmed: bool } }
    overlay: null,                  // null | help | settings | leaderboard | rules
    rulesDismissed: false,           // v5: rules auto-open until first dismissal
    rulesProgress: {},               // v5.2: which rule tiles the operator has read
    hintsExpanded: false,            // v5.2: hints-pill collapse/expand state
    // v5.5: tiebreaker setup — participants are operator-confirmed BEFORE any
    // tb question is played. The flow auto-suggests teams tied at #1 but lets
    // the operator override (e.g., scorer wants to include a near-tie team).
    tbParticipants: [],             // team numbers selected for the tiebreaker
    tbConfirmed: false,             // operator has locked in the participants
    tbPhase: 'penalty',             // 'penalty' (3 questions per selected team) | 'sudden-death' | 'resolved'
    tbQuestionCount: 0,             // count of tb questions resolved
    // v5.7: TB opener strip — mirrors the main-board pendingOpener pattern so
    // the TB board has the same "pick opener → confirm → pick question" flow
    // as a regular category. Without this, the opener was only chosen AFTER
    // the question opened, which broke the flow consistency the operator
    // already knew from the main rounds.
    tbPendingOpener: { team: null, confirmed: false },
    // v5.6: TB-question outcomes recorded chronologically so we can:
    //   - mark used slots on the TB boards (with +pts → T tag),
    //   - drive the TB scoring log rows,
    //   - compute per-team TB points for the leaderboard split.
    // Each entry: { qNum, phase, sdRound, category, idx, displayLabel,
    //               originatorTeam, scoringTeam, points, passedTeams }
    tbPicks: [],
    tbWinnerTeam: null,             // set when operator declares the TB winner
    presentationMode: false,
    _draftNames: null
  };
}
function defaultSettings() {
  const base = {
    autoPass: true,
    audioOn: true,
    autoReveal: true,
    // v5: pass direction is now round-aware by default. When roundAwarePass is
    // ON, odd rounds use forward (1→2→3…) and even rounds use reverse, mirroring
    // the snake-order opening pattern. When OFF, the manual passDirection
    // setting applies globally.
    roundAwarePass: true,
    passDirection: 'forward',        // 'forward' or 'reverse' — used when roundAwarePass is OFF
    suggestOriginator: true,         // snake-order auto-highlight in opener strip
    showTiebreakerSection: true,     // v5: hide the tiebreaker entry from the main board
    tbJumbled: true,                 // v5: default to a single jumbled tiebreaker grid
    previewMode: false,              // v5: when ON, picking a slot reveals without scoring
    showHintStrip: true              // v5: op-bar hint strip visibility
  };
  // The setup wizard / config.json can preset a handful of operator toggles via
  // DATA.config.defaultSettings. We only copy across known keys so an old
  // saved-settings blob or a stray config field can never inject junk. These
  // are first-run defaults only — once the operator changes a toggle in
  // Settings, their saved choice (in localStorage) wins on the next load.
  const seedable = ['autoReveal', 'audioOn', 'tbJumbled', 'showHintStrip'];
  const seed = (DATA.config && DATA.config.defaultSettings) || {};
  for (const k of seedable) {
    if (typeof seed[k] === 'boolean') base[k] = seed[k];
  }
  return base;
}

// Passing is on by default. When the event is configured with passing turned
// off (DATA.event.passingEnabled === false), a missed main-round question
// simply scores nobody — no pass flow. The tiebreaker's pass-elimination
// mechanic is independent of this and always applies during sudden death.
function passingEnabled() {
  return !DATA.event || DATA.event.passingEnabled !== false;
}

// Undo stack — snapshots of the state taken before every committed action
// (markCorrect, markWrong, continueAfterResolved, cancelQuestion). The user
// can press Z (or click the toolbar button) to roll back the last commit.
// Capped at 20 entries so we never balloon localStorage.
const UNDO_MAX = 20;
let undoStack = [];
function snapshot(label) {
  try {
    undoStack.push({ label, json: JSON.stringify(state), teamsJson: JSON.stringify(state.teams) });
    if (undoStack.length > UNDO_MAX) undoStack.shift();
  } catch (e) {}
}
function canUndo() { return undoStack.length > 0; }
function undo() {
  if (!canUndo()) return;
  const snap = undoStack.pop();
  try {
    const restored = JSON.parse(snap.json);
    state = restored;
    state.timerExpiresAt = null;  // never resume a stale timer
    state.overlay = null;
    saveState();
    stopTimer();
    render();
  } catch (e) {}
}
let state = loadState() || initialState();
let settings = loadSettings();
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    parsed.timerExpiresAt = null;
    parsed.overlay = null;
    // v5.6: defensive migrations for state saved before TB-picks tracking
    // existed. Without these, an in-progress event reloaded from old storage
    // would throw on tbPicks lookups.
    if (!Array.isArray(parsed.tbPicks)) parsed.tbPicks = [];
    if (parsed.tbWinnerTeam === undefined) parsed.tbWinnerTeam = null;
    if (!parsed.tbPendingOpener) parsed.tbPendingOpener = { team: null, confirmed: false };
    return parsed;
  } catch (e) { return null; }
}
function saveState() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {} }
function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return defaultSettings();
    return Object.assign(defaultSettings(), JSON.parse(raw));
  } catch (e) { return defaultSettings(); }
}
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {} }
function resetState() {
  if (!confirm('Reset the entire quiz state? Team names and all scores will be cleared.')) return;
  localStorage.removeItem(STORAGE_KEY);
  state = initialState();
  render();
}

// v5.4: snapshot save / load — gives a fallback if localStorage gets cleared
// or the browser crashes mid-event. Save downloads a JSON file of the
// current state; load reads that file back via a hidden <input type=file>.
function saveSnapshotToFile() {
  try {
    const payload = {
      // schema 2 adds a self-describing block (event + categories + points) so a
      // results viewer can render the snapshot without the original quiz file.
      // The viewer still falls back gracefully for schema-1 snapshots.
      schema: 2,
      title: DATA.event.title,
      savedAt: new Date().toISOString(),
      event: { title: DATA.event.title, dateLong: DATA.event.dateLong || '', venue: DATA.event.venue || '',
               penaltyPerTeam: DATA.event.tiebreakerPenaltyPerTeam != null ? DATA.event.tiebreakerPenaltyPerTeam : 3 },
      categories: DATA.categories.map((c) => ({ name: c.name, shortName: c.shortName, colour: c.colour })),
      points: { original: DATA.event.pointsOriginal, passed: DATA.event.pointsPassed },
      state: state
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.href = url;
    a.download = 'quiz-snapshot-' + stamp + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  } catch (e) {
    alert('Could not save snapshot: ' + (e.message || e));
  }
}
function loadSnapshotFromFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = function () {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function () {
      try {
        const payload = JSON.parse(reader.result);
        const restored = payload && payload.state ? payload.state : payload;
        if (!restored || !restored.teams) throw new Error('snapshot has no teams');
        if (!confirm('Load this snapshot? Current state will be replaced (team names, scores, picks).')) return;
        state = restored;
        state.timerExpiresAt = null;  // don't resume a stale timer
        state.overlay = null;
        saveState();
        stopTimer();
        render();
      } catch (e) {
        alert('Could not load snapshot: ' + (e.message || e));
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ---------- helpers ---------- */
function categoryByName(name) { return DATA.categories.find((c) => c.name === name); }
function pickRecord(cat, draw) { return state.picks[cat] && state.picks[cat][draw]; }
function isPicked(cat, draw) { return !!pickRecord(cat, draw); }

// v5: returns true once any pick has been made. Used to lock structural
// settings (snake order, team count, round order) so the operator cannot
// accidentally change them mid-event in a way that would invalidate state.
function isGameInProgress() {
  if (!state.teams || !state.teams.length) return false;
  if (state.view !== 'main-board' && state.view !== 'category-board' &&
      state.view !== 'question' && state.view !== 'tb-board' &&
      state.view !== 'tb-cat-select') return false;
  for (const c of Object.keys(state.picks || {})) {
    if (Object.keys(state.picks[c] || {}).length > 0) return true;
  }
  return false;
}

// v5: per-category opener state — exposes confirm/team for the strip.
function openerForCategory(name) {
  return (state.pendingOpener && state.pendingOpener[name]) || { team: null, confirmed: false };
}
function setPendingOpener(name, team, confirmed) {
  if (!state.pendingOpener) state.pendingOpener = {};
  state.pendingOpener[name] = { team, confirmed: !!confirmed };
}
function clearPendingOpener(name) {
  if (state.pendingOpener && state.pendingOpener[name]) delete state.pendingOpener[name];
}

/* ============================================================
   Round, snake order, tile classes
   Each category is one round, played in the order they appear in the
   config. Within a round the opening-team order is a snake:
     odd rounds : 1,2,...,n,n,n-1,...,1
     even round : n,n-1,...,1,1,2,...,n
   The runner uses this to suggest the next opening team as a
   HIGHLIGHT only — the operator must confirm before the question
   is revealed, so we never auto-commit to the wrong team.
   ============================================================ */
// ROUND_ORDER + TILE_CLASS derive entirely from DATA.categories, so the runner
// adapts to whatever categories the config defines.
const ROUND_ORDER = DATA.categories.map((c) => c.name);
const TILE_CLASS = {};
DATA.categories.forEach((c, i) => {
  // Map the configured colour name to a tile class; fall back to cycling
  // through the palette if a category omits its colour.
  const PALETTE = ['tile-blue', 'tile-green', 'tile-amber', 'tile-teal', 'tile-purple', 'tile-rose'];
  TILE_CLASS[c.name] = c.colour ? ('tile-' + c.colour) : PALETTE[i % PALETTE.length];
});
function tileClassFor(name) { return TILE_CLASS[name] || ''; }
function roundForCategory(name) {
  const i = ROUND_ORDER.indexOf(name);
  return i < 0 ? 0 : i + 1;
}
function categoryByShortcutKey(k) {
  if (!k) return null;
  const up = k.toUpperCase();
  return DATA.categories.find((c) => (c.shortcutKey || '').toUpperCase() === up) || null;
}
// Builds the full opening-team order for a round, with one entry per question
// (length = teams × picks-per-team). Two modes, set by DATA.event.openingOrder:
//   'snake'    — 1,2,…,n,n,…,1 (each pass reverses; the round parity sets the
//                starting direction so the overall order stays fair).
//   'circular' — 1,2,…,n,1,2,…,n (always ascending, every pass and round).
function openingSequence(round, n) {
  const picks = DATA.event.picksPerCategoryPerTeam || 2;
  const mode = DATA.event.openingOrder || 'snake';
  const asc = [];
  for (let i = 1; i <= n; i++) asc.push(i);
  const desc = asc.slice().reverse();
  const out = [];
  for (let p = 0; p < picks; p++) {
    if (mode === 'circular') {
      out.push.apply(out, asc);
    } else {
      // Snake: alternate direction each pass; odd rounds start ascending.
      const ascending = (round % 2 === 1) ? (p % 2 === 0) : (p % 2 === 1);
      out.push.apply(out, ascending ? asc : desc);
    }
  }
  return out;
}
function picksMadeInCategory(name) {
  return Object.keys(state.picks[name] || {}).length;
}
function nextExpectedOriginator(name) {
  // Returns the team number the snake pattern predicts will open the next
  // question in this category. Returns null if the round is full or the
  // category is unknown.
  const round = roundForCategory(name);
  if (round === 0) return null;
  const n = state.teams.length;
  if (n === 0) return null;
  const seq = openingSequence(round, n);
  const idx = picksMadeInCategory(name);
  if (idx >= seq.length) return null;
  return seq[idx];
}
function currentQuestion() {
  if (state.inTiebreaker) {
    const cat = categoryByName(state.currentCategory);
    return cat && cat.tiebreakers[state.tbIndex];
  }
  if (!state.currentCategory || state.currentDraw == null) return null;
  const cat = categoryByName(state.currentCategory);
  return cat && cat.board.find((b) => b.draw === state.currentDraw);
}

// v5: jumbled tiebreaker list — a flat array spanning all categories, in a
// deterministic interleaved order (so refresh keeps the same layout).
// Each entry carries enough metadata to dispatch to pickTb(cat, idx).
function jumbledTiebreakerList() {
  const out = [];
  const buckets = DATA.categories.map((c) => (c.tiebreakers || []).map((tb, idx) => ({
    category: c.name,
    short: c.shortName,
    idx, tb
  })));
  const maxLen = Math.max.apply(null, buckets.map((b) => b.length).concat(0));
  for (let i = 0; i < maxLen; i++) {
    for (const b of buckets) if (b[i]) out.push(b[i]);
  }
  return out;
}
// v5.1: pass direction follows the LOCAL snake step, not just round parity.
// Round 1 with 7 teams: 1,2,3,4,5,6,7,7,6,5,4,3,2,1.
//   Positions 1–7 step forward (1→2), so pass forward.
//   Positions 8–14 step backward (7→6), so pass reverse.
// Round 2 is the mirror — positions 1–7 reverse, 8–14 forward.
// This matches what participants experience: the team who's *next to open*
// is also the team most naturally suited to receive a pass.
function effectivePassDirection() {
  if (state.inTiebreaker) return 'forward';
  if (!settings || !settings.roundAwarePass) {
    return (settings && settings.passDirection) || 'forward';
  }
  const r = roundForCategory(state.currentCategory);
  if (r === 0) return 'forward';
  const n = state.teams.length;
  if (!n) return 'forward';
  // Position of THIS question in the snake (1-indexed).
  const pos = picksMadeInCategory(state.currentCategory) + 1;
  const firstHalf = pos <= n;
  // Round 1 first half = forward. Round 2 first half = reverse. Round 3 = round 1.
  const isForward = (r % 2 === 1) === firstHalf;
  return isForward ? 'forward' : 'reverse';
}
function nextSeatTeam(currentTeamNumber, alreadyTried) {
  // v5.5: during tiebreaker, rotate through the participant pool (which
  // may be non-contiguous, e.g., teams 2, 4, 7). Otherwise stick with the
  // main-game contiguous seat rotation.
  if (state.inTiebreaker) {
    const pool = tiebreakerPool();
    if (!pool.length) return null;
    const startIdx = pool.indexOf(currentTeamNumber);
    if (startIdx < 0) return pool.find((n) => !alreadyTried.has(n)) || null;
    const dir = effectivePassDirection() === 'reverse' ? -1 : 1;
    for (let i = 1; i <= pool.length; i++) {
      const idx = (((startIdx + i * dir) % pool.length) + pool.length) % pool.length;
      if (!alreadyTried.has(pool[idx])) return pool[idx];
    }
    return null;
  }
  const n = state.teams.length;
  const dir = effectivePassDirection() === 'reverse' ? -1 : 1;
  for (let i = 1; i <= n; i++) {
    const offset = i * dir;
    const candidate = (((currentTeamNumber - 1 + offset) % n) + n) % n + 1;
    if (!alreadyTried.has(candidate)) return candidate;
  }
  return null;
}
function arrowNextTeam(current, allowed) {
  // Arrow-right step through `allowed` set; wraps. Used for pre and pass
  // highlight nav so the operator can cycle through eligible teams.
  if (!current) return allowed.length ? allowed[0] : null;
  const idx = allowed.indexOf(current);
  if (idx < 0) return allowed[0] || null;
  return allowed[(idx + 1) % allowed.length];
}
function arrowPrevTeam(current, allowed) {
  if (!current) return allowed.length ? allowed[allowed.length - 1] : null;
  const idx = allowed.indexOf(current);
  if (idx < 0) return allowed[allowed.length - 1] || null;
  return allowed[(idx - 1 + allowed.length) % allowed.length];
}
// v5.5: during tiebreakers, only confirmed participants are eligible — both
// as the opener and as pass recipients. This is what isolates the tiebreaker
// "round" from the main game's seat rotation.
function tiebreakerPool() {
  return (state.tbParticipants && state.tbParticipants.length)
    ? state.tbParticipants.slice()
    : state.teams.map((t) => t.number);
}
function allowedOriginatorTeams() {
  if (state.inTiebreaker) return tiebreakerPool();
  return state.teams.map((t) => t.number);
}
function allowedPassTeams() {
  const pool = state.inTiebreaker ? tiebreakerPool() : state.teams.map((t) => t.number);
  return pool.filter((n) => n !== state.originatorTeam && !state.passedTeams.includes(n));
}
function roundScores() {
  // Per-team per-category totals derived from `picks`. Tiebreaker scoring
  // does not feed picks (recordPick early-returns) so this reflects the
  // three category rounds only. Tiebreaker delta is computed separately.
  const cats = DATA.categories.map((c) => c.name);
  const rounds = {};
  state.teams.forEach((t) => {
    rounds[t.number] = { byCat: {}, total: 0 };
    cats.forEach((c) => { rounds[t.number].byCat[c] = 0; });
  });
  for (const catName of cats) {
    const inCat = state.picks[catName] || {};
    for (const draw of Object.keys(inCat)) {
      const p = inCat[draw];
      if (p.scoringTeam && rounds[p.scoringTeam]) {
        rounds[p.scoringTeam].byCat[catName] += p.points;
        rounds[p.scoringTeam].total += p.points;
      }
    }
  }
  return rounds;
}
function leaderboardRows() {
  const rounds = roundScores();
  return state.teams
    .map((t) => {
      const r = rounds[t.number];
      const tieBreak = (t.score || 0) - r.total;
      return {
        number: t.number,
        name: t.name,
        byCat: r.byCat,
        roundsTotal: r.total,
        tieBreak,
        total: t.score
      };
    })
    .sort((a, b) => b.total - a.total);
}

// Quotes a value for CSV: wraps in double-quotes and doubles any internal ones
// (RFC 4180), so team names with commas or quotes survive a round-trip.
function csvCell(v) {
  const s = (v == null ? '' : String(v));
  return '"' + s.replace(/"/g, '""') + '"';
}
// Downloads the current standings as a CSV: rank, team, per-category points,
// (tiebreaker points when any tiebreaker has been played) and total. Mirrors
// the columns shown in the leaderboard overlay so the operator can hand the
// file straight to a scorer or publish it after the event.
function exportLeaderboard() {
  const rows = leaderboardRows();
  const cats = DATA.categories;
  const anyTb = rows.some((r) => r.tieBreak !== 0);
  const header = ['Rank', 'Team'].concat(cats.map((c) => c.name));
  if (anyTb) header.push('Total (no TB)', 'Tiebreaker', 'Total');
  else header.push('Total');
  const lines = [header.map(csvCell).join(',')];
  rows.forEach((r, i) => {
    const cells = ['#' + (i + 1), r.name].concat(cats.map((c) => r.byCat[c.name]));
    if (anyTb) cells.push(r.roundsTotal, r.tieBreak, r.total);
    else cells.push(r.total);
    lines.push(cells.map(csvCell).join(','));
  });
  try {
    const blob = new Blob([lines.join('\r\n')], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    a.href = url;
    a.download = 'leaderboard-' + stamp + '.csv';
    document.body.appendChild(a); a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
  } catch (e) {
    alert('Could not export results: ' + (e.message || e));
  }

/* ---------- audio (v5.5: trivia-show "tring" call bell) ----------
   The previous version sounded too round, like a beep. Real reception
   bells / trivia bells have:
     - a sharp metallic click at the strike (noise burst, high-pass)
     - strongly inharmonic partials (Rayleigh's plate-bell ratios:
         1.00, 2.76, 5.40, 8.93 ≈ real circular plate modes)
     - higher fundamental (1300 Hz) so the timbre reads "tring"
     - moderate decay so it cuts but still rings.
   Played as a "ding-ding" — two strikes ~220 ms apart. */
let audioCtx = null;
function ensureAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function strikeBell(startOffsetSec, fundamentalHz) {
  const ctx = ensureAudioCtx();
  const now = ctx.currentTime + startOffsetSec;
  const decaySec = 0.95;
  // Plate-bell-style inharmonic partial ratios.
  const partials = [
    { freq: fundamentalHz * 1.00, gain: 0.46, dec: decaySec * 1.00 },
    { freq: fundamentalHz * 2.76, gain: 0.30, dec: decaySec * 0.80 },
    { freq: fundamentalHz * 5.40, gain: 0.18, dec: decaySec * 0.55 },
    { freq: fundamentalHz * 8.93, gain: 0.10, dec: decaySec * 0.40 }
  ];
  // Tiny high-passed noise burst at the strike — gives the percussive click.
  try {
    const noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.02), ctx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for (let i = 0; i < data.length; i++) {
      // Fast-decaying noise (~3 ms tail).
      data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (ctx.sampleRate * 0.003));
    }
    const noise = ctx.createBufferSource();
    noise.buffer = noiseBuf;
    const hp = ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 3000;
    const ngain = ctx.createGain();
    ngain.gain.value = 0.35;
    noise.connect(hp); hp.connect(ngain); ngain.connect(ctx.destination);
    noise.start(now); noise.stop(now + 0.025);
  } catch (e) {}
  // Sine partials with sharp attack.
  for (const p of partials) {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = p.freq;
    osc.connect(gain); gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(p.gain, now + 0.003);

/* ---------- timer (DOM-only updates, no whole-stage re-render) ---------- */
let timerInterval = null;
let beepedFor = null;
function startTimer(durationSec) {
  state.timerExpiresAt = Date.now() + durationSec * 1000;
  beepedFor = state.timerExpiresAt;
  saveState();
  updateTimerDom();
  if (timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    const remaining = (state.timerExpiresAt - Date.now()) / 1000;
    if (remaining <= 0 && beepedFor === state.timerExpiresAt) { bellRing(2200, 660); beepedFor = null; }
    updateTimerDom();
    if (remaining <= -2) { clearInterval(timerInterval); timerInterval = null; }
  }, 100);
}
function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  state.timerExpiresAt = null;
  beepedFor = null;
}
function remainingSeconds() {
  if (!state.timerExpiresAt) return null;
  return Math.max(0, (state.timerExpiresAt - Date.now()) / 1000);
}
function updateTimerDom() {
  const ring = document.querySelector('.timer');
  const num  = document.querySelector('.timer .num');
  if (!ring || !num) return;
  const remaining = remainingSeconds();
  if (remaining == null) {
    ring.className = 'timer idle';
    ring.style.setProperty('--pct', 0);
    num.textContent = '—';
    return;
  }
  const pct = Math.max(0, remaining / state.timerSeconds);
  ring.style.setProperty('--pct', pct.toFixed(3));
  num.textContent = Math.ceil(remaining) + 's';
  ring.className = 'timer' + (pct < 0.25 ? ' danger' : pct < 0.5 ? ' warn' : '');
}

   ============================================================ */
document.addEventListener('keydown', (e) => {
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;

  const k = e.key;

  // ----- overlays first (capture global keys to close) -----
  if (state.overlay) {
    if (k === 'Escape') { if (state.overlay === 'rules') dismissRules(); else closeOverlay(); e.preventDefault(); return; }
    if (k === '?'  && state.overlay === 'help')        { closeOverlay(); e.preventDefault(); return; }
    if ((k === 'l' || k === 'L') && state.overlay === 'leaderboard') { closeOverlay(); e.preventDefault(); return; }
    if ((k === 'o' || k === 'O' || k === ',') && state.overlay === 'settings') { closeOverlay(); e.preventDefault(); return; }
    if ((k === 'b' || k === 'B') && state.overlay === 'rules')      { dismissRules(); e.preventDefault(); return; }
    // v5.4: rules overlay nav — arrows + Enter walk through sections.
    if (state.overlay === 'rules') {
      if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'Enter' || k === ' ') {
        rulesAdvance(+1); e.preventDefault(); return;
      }
      if (k === 'ArrowLeft' || k === 'ArrowUp') {
        rulesAdvance(-1); e.preventDefault(); return;
      }
    }
    return;
  }

  // ----- global shortcuts available from every view -----
  if (k === '?')                                  { openHelp();         e.preventDefault(); return; }
  if (k === 'F' || k === 'f')                     { togglePresentation();e.preventDefault(); return; }
  if (k === 'L' || k === 'l')                     { openLeaderboard();  e.preventDefault(); return; }
  if (k === 'O' || k === 'o' || k === ',')        { openSettings();     e.preventDefault(); return; }
  if (k === 'B' || k === 'b')                     { openRules();        e.preventDefault(); return; }
  if (k === 'Z' || k === 'z')                     { undo();             e.preventDefault(); return; }
  // C jumps to the cover (from which team setup is reachable). It only steps
  // aside on the category-picking views (main board, tiebreaker category select)
  // AND only when a category actually uses "C" as its shortcut — otherwise C
  // works everywhere, including the main board.
  if (k === 'C' || k === 'c') {
    const cIsCategoryKey = DATA.categories.some((cat) => (cat.shortcutKey || '').toUpperCase() === 'C');
    const onPickView = state.view === 'main-board' || state.view === 'tb-cat-select';
    if (!(cIsCategoryKey && onPickView)) { gotoCover(); e.preventDefault(); return; }
  }
  // v5.2: T opens tiebreakers from any view (when the section is enabled).
  // The previous version only handled T on the main board, which made the
  // tiebreaker pool effectively unreachable after one was already played.
  if ((k === 'T' || k === 't') && settings.showTiebreakerSection &&
      state.view !== 'tb-board' && state.view !== 'tb-jumbled' &&
      state.view !== 'tb-cat-select' && state.view !== 'tb-setup' &&
      state.view !== 'cover' &&
      state.view !== 'splash' && state.view !== 'question') {
    openTiebreakers(); e.preventDefault(); return;
  }

  switch (state.view) {
    case 'cover':
      if (k === 'Enter' || k === ' ' || k === 'ArrowRight') { gotoSplash(); e.preventDefault(); }
      break;

    case 'splash':
      if (k === 'Enter') { startQuiz(); e.preventDefault(); }
      else if (k === 'ArrowLeft' || k === 'Escape') { gotoCover(); e.preventDefault(); }
      break;

    case 'main-board': {
      // Shortcut letters come from each category's configured shortcutKey, so
      // any set of categories wires up correctly.
      const matchCat = categoryByShortcutKey(k);
      if (matchCat) { openCategory(matchCat.name); e.preventDefault(); }
      else return;
      break;
    }

    case 'category-board': {
      // v5.1: number keys only engage WHILE the opener is unconfirmed. Once
      // confirmed, 1-9 are inert so the operator cannot misfire and re-pick
      // an opener when they meant to nav slots (or the audience hears them
      // typing draw numbers).
      const cat = categoryByName(state.currentCategory);
      const list = cat ? cat.board : [];
      const opener = openerForCategory(state.currentCategory);
      if (k === 'Escape') { gotoMainBoard(); e.preventDefault(); break; }

          state.originatorHighlight = numKey;
          saveState(); render(); e.preventDefault(); break;
        }
        const allowed = allowedOriginatorTeams();
        if (k === 'ArrowRight' || k === 'ArrowDown') {
          highlightOriginator(arrowNextTeam(opener.team || state.originatorHighlight, allowed));

        if (k === 'ArrowLeft' || k === 'ArrowUp') {

        if (k === 'ArrowDown')  { state.focusSlot = Math.min(list.length - 1, state.focusSlot + 8); render(); e.preventDefault(); break; }

      if (!tbOpener.confirmed) {
        const numKey = parseInt(k, 10);
        if (!isNaN(numKey) && tiebreakerPool().includes(numKey)) {

          state.originatorHighlight = numKey;
          saveState(); render(); e.preventDefault(); break;
        }
        const pool = tiebreakerPool();
        if (k === 'ArrowRight' || k === 'ArrowDown') {
          highlightTbOpener(arrowNextTeam(tbOpener.team || state.originatorHighlight, pool));
          e.preventDefault(); break;
        }
        if (k === 'ArrowLeft' || k === 'ArrowUp') {
          highlightTbOpener(arrowPrevTeam(tbOpener.team || state.originatorHighlight, pool));

        }
        if (k === 'Enter' || k === ' ') { confirmTbOpenerOnBoard(); e.preventDefault(); break; }
      } else {

        if (k === 'ArrowLeft')  { state.focusSlot = Math.max(0, state.focusSlot - 1); render(); e.preventDefault(); break; }
        if (k === 'ArrowDown')  { state.focusSlot = Math.min(list.length - 1, state.focusSlot + 5); render(); e.preventDefault(); break; }
        if (k === 'ArrowUp')    { state.focusSlot = Math.max(0, state.focusSlot - 5); render(); e.preventDefault(); break; }
        if (k === 'Enter' || k === ' ') {
          if (list[state.focusSlot]) pickTb(state.currentCategory, state.focusSlot, null, state.focusSlot + 1);

        }
        if (k === 'U' || k === 'u') {

          e.preventDefault();
        }
      }
      break;
    }

    case 'tb-jumbled': {
      // v5.7: same two-phase model as tb-board above.
      const list = jumbledTiebreakerList();
      const tbOpener = state.tbPendingOpener || { team: null, confirmed: false };
      if (k === 'Escape') { gotoMainBoard(); e.preventDefault(); break; }
      if (!tbOpener.confirmed) {
        const numKey = parseInt(k, 10);
        if (!isNaN(numKey) && tiebreakerPool().includes(numKey)) {
          setTbPendingOpener(numKey, true);
          state.originatorHighlight = numKey;
          saveState(); render(); e.preventDefault(); break;
        }
        const pool = tiebreakerPool();
        if (k === 'ArrowRight' || k === 'ArrowDown') {
          highlightTbOpener(arrowNextTeam(tbOpener.team || state.originatorHighlight, pool));
          e.preventDefault(); break;
        }
        if (k === 'ArrowLeft' || k === 'ArrowUp') {
          highlightTbOpener(arrowPrevTeam(tbOpener.team || state.originatorHighlight, pool));
          e.preventDefault(); break;
        }
        if (k === 'Enter' || k === ' ') { confirmTbOpenerOnBoard(); e.preventDefault(); break; }
      } else {
        if (k === 'ArrowRight') { state.focusSlot = Math.min(list.length - 1, state.focusSlot + 1); render(); e.preventDefault(); break; }
        if (k === 'ArrowLeft')  { state.focusSlot = Math.max(0, state.focusSlot - 1); render(); e.preventDefault(); break; }
        if (k === 'ArrowDown')  { state.focusSlot = Math.min(list.length - 1, state.focusSlot + 6); render(); e.preventDefault(); break; }
