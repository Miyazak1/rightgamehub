services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: gamehub
      POSTGRES_USER: gamehub
      POSTGRES_PASSWORD: local-gamehub-only
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamehub -d gamehub"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - gamehub-postgres-dev:/var/lib/postgresql/data

volumes:
  gamehub-postgres-dev:
