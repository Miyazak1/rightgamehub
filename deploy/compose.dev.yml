services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:63799:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - gamehub-redis-dev:/data

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: gamehub
      POSTGRES_USER: gamehub
      POSTGRES_PASSWORD: local-gamehub-only
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamehub -d gamehub"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - gamehub-postgres-dev:/var/lib/postgresql/data

volumes:
  gamehub-postgres-dev:
  gamehub-redis-dev:
