name: gamehub-production

x-api-environment: &api-environment
  NODE_ENV: production
  API_HOST: 0.0.0.0
  API_PORT: 3090
  GAME_SHARE_SITE_ORIGIN: https://${APP_DOMAIN}
  DATABASE_URL: postgresql://gamehub:${POSTGRES_PASSWORD}@postgres:5432/gamehub
  DATABASE_SSL: "false"
  REDIS_URL: redis://redis:6379
  REALTIME_PUBLIC_URL: wss://${APP_DOMAIN}/v1/realtime
  REALTIME_TICKET_TTL_SECONDS: "30"
  OTP_HMAC_KEY: ${OTP_HMAC_KEY}
  ROOM_CODE_HMAC_KEY: ${ROOM_CODE_HMAC_KEY:-}
  RULES_MANIFEST_PATH: ${RULES_MANIFEST_PATH:-}
  RULES_TRUSTED_KEYS_JSON: ${RULES_TRUSTED_KEYS_JSON:-}
  CORS_ORIGINS: https://${APP_DOMAIN},http://127.0.0.1:3080,http://localhost:3080,http://127.0.0.1:3081
  TRUST_EDITOR_WEBVIEWS: "true"
  MAIL_PROVIDER: resend
  RESEND_API_KEY: ${RESEND_API_KEY}
  MAIL_FROM: ${MAIL_FROM}
  LOGIN_EMAIL_ALLOWLIST: ${LOGIN_EMAIL_ALLOWLIST:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
  GITHUB_SOURCE_IMPORT_ENABLED: ${GITHUB_SOURCE_IMPORT_ENABLED:-false}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
  GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
  GITHUB_APP_CALLBACK_URL: ${GITHUB_APP_CALLBACK_URL:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
  SOURCE_BUILD_ENABLED: ${SOURCE_BUILD_ENABLED:-false}
  SOURCE_BUILDER_ROOT: /data/builder
  SOURCE_BUILD_WORKING_ROOT: /data/source-worker
  SOURCE_BUILDER_EXECUTION_MODE: isolated
  SOURCE_BUILDER_IMAGE_DIGEST: ${SOURCE_BUILDER_IMAGE_DIGEST:-}
  RULE_BUILD_ENABLED: ${RULE_BUILD_ENABLED:-false}
  RULE_BUILDER_ROOT: /data/rule-builder
  RULE_BUILD_WORKING_ROOT: /data/rule-worker
  RULE_BUILDER_EXECUTION_MODE: isolated
  RULE_BUILDER_IMAGE_DIGEST: ${RULE_BUILDER_IMAGE_DIGEST:-}
  QUARANTINE_ROOT: /data/quarantine
  AVATAR_ROOT: /data/avatars
  COVER_ROOT: /data/covers
  RUNTIME_ROOT: /data/runtime
  VALIDATOR_ROOT: /data/validator
  VALIDATOR_EXECUTION_MODE: isolated
  CLOUD_SAVE_ENABLED: ${CLOUD_SAVE_ENABLED:-false}
  COMMUNITY_ENABLED: ${COMMUNITY_ENABLED:-false}
  COMMUNITY_POSTING_ENABLED: ${COMMUNITY_POSTING_ENABLED:-false}
  COMMUNITY_IMAGES_ENABLED: ${COMMUNITY_IMAGES_ENABLED:-false}
  COMMUNITY_MEDIA_ROOT: /data/community-media
  COMMUNITY_PROCESSOR_ROOT: /data/community-processor
  COMMUNITY_MEDIA_BUDGET_BYTES: ${COMMUNITY_MEDIA_BUDGET_BYTES:-2147483648}
  SAVE_STORAGE_REQUIRED: "true"
  SAVE_STORAGE_MAX_AGE_SECONDS: ${SAVE_STORAGE_MAX_AGE_SECONDS:-90}
  SAVE_STORAGE_MIN_FREE_BYTES: ${SAVE_STORAGE_MIN_FREE_BYTES:-1073741824}
  SAVE_STORAGE_MAX_USED_PERCENT: ${SAVE_STORAGE_MAX_USED_PERCENT:-85}
  SAVE_STORAGE_MIN_FREE_INODE_PERCENT: ${SAVE_STORAGE_MIN_FREE_INODE_PERCENT:-5}
  SAVE_STORAGE_MAX_WAL_BYTES: ${SAVE_STORAGE_MAX_WAL_BYTES:-2147483648}
  STORAGE_WARN_PERCENT: "60"
  STORAGE_BLOCK_PERCENT: "80"
  STORAGE_MONITOR_INTERVAL_SECONDS: "60"
  OBJECT_STORAGE_PROVIDER: ${OBJECT_STORAGE_PROVIDER:-local}
  OSS_REGION: ${OSS_REGION:-}
  OSS_ENDPOINT: ${OSS_ENDPOINT:-}
  OSS_BUCKET: ${OSS_BUCKET:-}
  OSS_ECS_ROLE_NAME: ${OSS_ECS_ROLE_NAME:-}
  RUNTIME_DOMAIN: ${RUNTIME_DOMAIN}
  RUNTIME_SCHEME: https
  GUESS_BAIKE_AUTOMATION_ENABLED: "true"
  GUESS_BAIKE_WIKIPEDIA_USER_AGENT: "${GUESS_BAIKE_WIKIPEDIA_USER_AGENT:-GameHub-GuessBaikeBot/0.3 (https://mooyu.fun/; automated daily puzzle) Node.js}"
  AGENT_BLOG_POLL_SECONDS: ${AGENT_BLOG_POLL_SECONDS:-30}
  AGENT_BLOG_FOUNDATION_MODE: ${AGENT_BLOG_FOUNDATION_MODE:-passive}
  AGENT_BLOG_PROVIDER_TIMEOUT_MS: ${AGENT_BLOG_PROVIDER_TIMEOUT_MS:-120000}
  NODE_OPTIONS: --max-old-space-size=320

x-service-defaults: &service-defaults
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  redis:
    <<: *service-defaults
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    mem_limit: 160m

  postgres:
    <<: *service-defaults
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamehub
      POSTGRES_USER: gamehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamehub -d gamehub"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    mem_limit: 640m

  migrate:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment: *api-environment
    command: ["node", "apps/api/src/migrate-cli.mjs"]
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - community-media:/data/community-media
      - community-processor:/data/community-processor
      - avatars:/data/avatars
      - covers:/data/covers
      - quarantine:/data/quarantine
      - runtime-assets:/data/runtime
      - validator:/data/validator
    networks: [backend]
    restart: "no"

  api:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment:
      <<: *api-environment
      # Root key is intentionally exposed only to the API process that encrypts
      # and decrypts managed Agent provider credentials. Migration/workers do
      # not need it and must not receive it through the shared environment.
      AGENT_SECRET_ENCRYPTION_KEY: ${AGENT_SECRET_ENCRYPTION_KEY:-}
      DEEPSEEK_SEARCH_ENABLED: ${DEEPSEEK_SEARCH_ENABLED:-false}
      DEEPSEEK_FETCH_ENABLED: ${DEEPSEEK_FETCH_ENABLED:-false}
      RESEARCH_CANDIDATE_ASSESSMENT_ENABLED: ${RESEARCH_CANDIDATE_ASSESSMENT_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_SEARCH_TIMEOUT_MS: ${DEEPSEEK_SEARCH_TIMEOUT_MS:-12000}
      DEEPSEEK_FETCH_TIMEOUT_MS: ${DEEPSEEK_FETCH_TIMEOUT_MS:-15000}
      RESEARCH_CANDIDATE_ASSESSMENT_MODEL: ${RESEARCH_CANDIDATE_ASSESSMENT_MODEL:-deepseek-chat}
      RESEARCH_CANDIDATE_ASSESSMENT_TIMEOUT_MS: ${RESEARCH_CANDIDATE_ASSESSMENT_TIMEOUT_MS:-45000}
      RESEARCH_CANDIDATE_ASSESSMENT_MAX_PER_RUN: ${RESEARCH_CANDIDATE_ASSESSMENT_MAX_PER_RUN:-6}
      DEEPSEEK_SEARCH_PRICE_USD_MICROS_PER_REQUEST: ${DEEPSEEK_SEARCH_PRICE_USD_MICROS_PER_REQUEST:-750}
      DEEPSEEK_FETCH_PRICE_USD_MICROS_PER_REQUEST: ${DEEPSEEK_FETCH_PRICE_USD_MICROS_PER_REQUEST:-750}
      RESEARCH_CANDIDATE_ASSESSMENT_PRICE_USD_MICROS_PER_REQUEST: ${RESEARCH_CANDIDATE_ASSESSMENT_PRICE_USD_MICROS_PER_REQUEST:-3000}
      RESEARCHER_WORKER_ENABLED: ${RESEARCHER_WORKER_ENABLED:-false}
      RESEARCHER_WORKER_TOKEN: ${RESEARCHER_WORKER_TOKEN:-}
      RESEARCHER_LEASE_SECONDS: ${RESEARCHER_LEASE_SECONDS:-120}
      RESEARCHER_PROVIDER_ID: ${RESEARCHER_PROVIDER_ID:-deepseek-researcher}
      RESEARCHER_PROVIDER_MODEL: ${RESEARCHER_PROVIDER_MODEL:-deepseek-chat}
      RESEARCHER_ESTIMATED_COST_USD_MICROS_PER_JOB: ${RESEARCHER_ESTIMATED_COST_USD_MICROS_PER_JOB:-20000}
      RESEARCH_TOPIC_MAX_ACTIVE_RUNS_PER_ACCOUNT: ${RESEARCH_TOPIC_MAX_ACTIVE_RUNS_PER_ACCOUNT:-1}
      RESEARCHER_MAX_ACTIVE_JOBS_PER_ACCOUNT: ${RESEARCHER_MAX_ACTIVE_JOBS_PER_ACCOUNT:-1}
      RESEARCH_TOPIC_MAX_ACTIVE_RUNS_GLOBAL: ${RESEARCH_TOPIC_MAX_ACTIVE_RUNS_GLOBAL:-1}
      RESEARCHER_MAX_ACTIVE_JOBS_GLOBAL: ${RESEARCHER_MAX_ACTIVE_JOBS_GLOBAL:-1}
      RESEARCH_MAX_BILLABLE_REQUESTS_PER_ACCOUNT_MONTH: ${RESEARCH_MAX_BILLABLE_REQUESTS_PER_ACCOUNT_MONTH:-100}
      RESEARCH_MAX_PROVIDER_COST_USD_MICROS_PER_ACCOUNT_MONTH: ${RESEARCH_MAX_PROVIDER_COST_USD_MICROS_PER_ACCOUNT_MONTH:-1000000}
      RESEARCH_MAX_BILLABLE_REQUESTS_GLOBAL_MONTH: ${RESEARCH_MAX_BILLABLE_REQUESTS_GLOBAL_MONTH:-1000}
      RESEARCH_MAX_PROVIDER_COST_USD_MICROS_GLOBAL_MONTH: ${RESEARCH_MAX_PROVIDER_COST_USD_MICROS_GLOBAL_MONTH:-10000000}
      RESEARCH_PROVIDER_CIRCUIT_FAILURE_THRESHOLD: ${RESEARCH_PROVIDER_CIRCUIT_FAILURE_THRESHOLD:-3}
      RESEARCH_PROVIDER_CIRCUIT_WINDOW_SECONDS: ${RESEARCH_PROVIDER_CIRCUIT_WINDOW_SECONDS:-300}
      RESEARCH_PROVIDER_CIRCUIT_COOLDOWN_SECONDS: ${RESEARCH_PROVIDER_CIRCUIT_COOLDOWN_SECONDS:-300}
      RESEARCH_PROVIDER_CIRCUIT_PROBE_SECONDS: ${RESEARCH_PROVIDER_CIRCUIT_PROBE_SECONDS:-120}
      RESEARCH_ACTION_RECOVERY_GRACE_SECONDS: ${RESEARCH_ACTION_RECOVERY_GRACE_SECONDS:-120}
    command: ["node", "apps/api/src/server.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - community-media:/data/community-media
      - community-processor:/data/community-processor
      - ../rules:/app/rules:ro
      - avatars:/data/avatars
      - covers:/data/covers
      - quarantine:/data/quarantine
      - runtime-assets:/data/runtime
      - validator:/data/validator
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3090/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]
    mem_limit: 384m

  research-soak:
    <<: *service-defaults
    profiles: ["research-acceptance"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: "no"
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=48
    command: ["node", "scripts/run-research-soak.mjs", "--target", "http://api:3090", "--environment", "production-compose-internal", "--duration-hours", "336", "--interval-seconds", "60", "--output", "/data/research-soak"]
    depends_on:
      api: { condition: service_healthy }
    volumes:
      - research-soak-reports:/data/research-soak
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 64m
    cpus: 0.05

  realtime:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile.realtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REALTIME_HOST: 0.0.0.0
      REALTIME_PORT: 3093
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://gamehub:${POSTGRES_PASSWORD}@postgres:5432/gamehub
      DATABASE_SSL: "false"
      REALTIME_RECONNECT_GRACE_MS: "120000"
      REALTIME_MATCH_TIMEOUT_SWEEP_MS: "1000"
      REALTIME_MATCH_TIMEOUT_BATCH_SIZE: "50"
      REALTIME_ALLOWED_ORIGINS: https://${APP_DOMAIN},http://127.0.0.1:3080,http://localhost:3080,http://127.0.0.1:3081
      TRUST_EDITOR_WEBVIEWS: "true"
      RULES_MANIFEST_PATH: ${RULES_MANIFEST_PATH:-}
      RULES_TRUSTED_KEYS_JSON: ${RULES_TRUSTED_KEYS_JSON:-}
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    volumes:
      - ../rules:/app/rules:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3093/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]
    mem_limit: 192m

  validator:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile.validator
    restart: unless-stopped
    environment:
      NODE_ENV: production
      QUARANTINE_ROOT: /data/quarantine
      VALIDATOR_ROOT: /data/validator
      NODE_OPTIONS: --max-old-space-size=256
    command: ["node", "apps/api/src/web-validator-service.mjs"]
    volumes:
      - quarantine:/data/quarantine:ro
      - validator:/data/validator
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 64
    cpus: "1.0"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').statSync('/data/validator/service.ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  community-image:
    <<: *service-defaults
    profiles: [community-images]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    command: ["node", "apps/api/src/community-image-service.mjs"]
    environment:
      NODE_ENV: production
      COMMUNITY_MEDIA_ROOT: /data/community-media
      COMMUNITY_PROCESSOR_ROOT: /data/community-processor
      NODE_OPTIONS: --max-old-space-size=64
    volumes:
      - community-media:/data/community-media:ro
      - community-processor:/data/community-processor
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 32
    cpus: "0.50"
    mem_limit: 256m

  source-builder:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile.builder
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SOURCE_BUILDER_ROOT: /data/builder
      NODE_OPTIONS: --max-old-space-size=1536
    volumes:
      - source-builder:/data/builder
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 128
    cpus: "2.0"
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').statSync('/data/builder/service.ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  source-worker:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment: *api-environment
    command: ["node", "apps/api/src/source-build-worker-cli.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      source-builder: { condition: service_healthy }
    volumes:
      - quarantine:/data/quarantine
      - runtime-assets:/data/runtime
      - validator:/data/validator
      - source-builder:/data/builder
      - source-worker:/data/source-worker
      - avatars:/data/avatars
      - covers:/data/covers
    networks: [backend]
    mem_limit: 512m

  rule-builder:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rule-builder
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RULE_BUILDER_ROOT: /data/rule-builder
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - rule-builder:/data/rule-builder
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 64
    cpus: "1.0"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').statSync('/data/rule-builder/service.ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  rule-worker:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment: *api-environment
    command: ["node", "apps/api/src/multiplayer-rule-build-worker-cli.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rule-builder: { condition: service_healthy }
    volumes:
      - quarantine:/data/quarantine
      - rule-builder:/data/rule-builder
      - rule-worker:/data/rule-worker
    networks: [backend]
    mem_limit: 384m

  # Technical preview. Enable only after setting RESEARCHER_WORKER_ENABLED=true,
  # a shared 32+ byte token and the dedicated provider key, then use
  # COMPOSE_PROFILES=researcher. It analyzes frozen evidence only.
  researcher-worker:
    <<: *service-defaults
    profiles: [researcher]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    command: ["node", "apps/api/src/researcher-worker-cli.mjs"]
    environment:
      NODE_ENV: production
      RESEARCHER_PLATFORM_URL: http://api:3090
      RESEARCHER_PLATFORM_TIMEOUT_MS: ${RESEARCHER_PLATFORM_TIMEOUT_MS:-15000}
      RESEARCHER_WORKER_TOKEN: ${RESEARCHER_WORKER_TOKEN:-}
      RESEARCHER_WORKER_ID: ${RESEARCHER_WORKER_ID:-researcher-worker-1}
      RESEARCHER_PROVIDER_ID: ${RESEARCHER_PROVIDER_ID:-deepseek-researcher}
      RESEARCHER_DEEPSEEK_API_KEY: ${RESEARCHER_DEEPSEEK_API_KEY:-}
      RESEARCHER_DEEPSEEK_MODEL: ${RESEARCHER_PROVIDER_MODEL:-deepseek-chat}
      RESEARCHER_DEEPSEEK_TIMEOUT_MS: ${RESEARCHER_DEEPSEEK_TIMEOUT_MS:-120000}
      RESEARCHER_DEEPSEEK_MAX_TOKENS: ${RESEARCHER_DEEPSEEK_MAX_TOKENS:-6000}
      RESEARCHER_WORKER_LEASE_SECONDS: ${RESEARCHER_WORKER_LEASE_SECONDS:-300}
      RESEARCHER_WORKER_HEARTBEAT_SECONDS: ${RESEARCHER_WORKER_HEARTBEAT_SECONDS:-60}
      RESEARCHER_WORKER_POLL_MS: ${RESEARCHER_WORKER_POLL_MS:-3000}
      NODE_OPTIONS: --max-old-space-size=128
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "apps/api/src/researcher-worker-cli.mjs", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    cpus: "0.50"
    mem_limit: 192m
    networks: [backend]

  # F1 foundation worker. The profile and explicit enable flag keep it inert
  # until workflow adapters have passed shadow/canary acceptance.
  agent-runtime-worker:
    <<: *service-defaults
    profiles: [agent-foundation]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    command: ["node", "apps/api/src/agent-runtime-worker-cli.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://gamehub:${POSTGRES_PASSWORD}@postgres:5432/gamehub
      DATABASE_SSL: "false"
      AGENT_RUNTIME_WORKER_ENABLED: ${AGENT_RUNTIME_WORKER_ENABLED:-false}
      AGENT_RUNTIME_WORKER_ID: ${AGENT_RUNTIME_WORKER_ID:-agent-runtime-worker-1}
      AGENT_RUNTIME_LEASE_SECONDS: ${AGENT_RUNTIME_LEASE_SECONDS:-120}
      AGENT_RUNTIME_HEARTBEAT_SECONDS: ${AGENT_RUNTIME_HEARTBEAT_SECONDS:-30}
      AGENT_RUNTIME_POLL_MS: ${AGENT_RUNTIME_POLL_MS:-1000}
      AGENT_RUNTIME_OUTBOX_LEASE_SECONDS: ${AGENT_RUNTIME_OUTBOX_LEASE_SECONDS:-30}
      AGENT_RUNTIME_RECOVERY_BATCH: ${AGENT_RUNTIME_RECOVERY_BATCH:-25}
      AGENT_RUNTIME_OUTBOX_BATCH: ${AGENT_RUNTIME_OUTBOX_BATCH:-25}
      NODE_OPTIONS: --max-old-space-size=96
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "apps/api/src/agent-runtime-worker-cli.mjs", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    cpus: "0.25"
    mem_limit: 128m
    networks: [backend]

  # Idempotent control-plane bootstrap. It only registers the reviewed workflow
  # manifests and model admission envelope; it creates no Run, invokes no
  # provider and owns no publication path.
  agent-blog-canary-bootstrap:
    <<: *service-defaults
    profiles: ["agent-blog-canary-bootstrap"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: "no"
    command: ["node", "apps/api/src/agent-blog-private-canary-bootstrap-cli.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://gamehub:${POSTGRES_PASSWORD}@postgres:5432/gamehub
      DATABASE_SSL: "false"
      AGENT_BLOG_PRIVATE_CANARY_ENABLED: ${AGENT_BLOG_PRIVATE_CANARY_ENABLED:-false}
      AGENT_BLOG_PRIVATE_CANARY_PUBLISH_ENABLED: ${AGENT_BLOG_PRIVATE_CANARY_PUBLISH_ENABLED:-false}
      AGENT_BLOG_PRIVATE_CANARY_AGENT_USER_ID: ${AGENT_BLOG_PRIVATE_CANARY_AGENT_USER_ID:-}
      AGENT_BLOG_PRIVATE_CANARY_PROVIDER: ${AGENT_BLOG_PRIVATE_CANARY_PROVIDER:-deepseek}
      AGENT_BLOG_PRIVATE_CANARY_MODEL_ID: ${AGENT_BLOG_PRIVATE_CANARY_MODEL_ID:-deepseek-flash}
      AGENT_BLOG_PRIVATE_CANARY_DAILY_RUN_LIMIT: ${AGENT_BLOG_PRIVATE_CANARY_DAILY_RUN_LIMIT:-1}
      AGENT_BLOG_PRIVATE_CANARY_EXTRA_DAILY_RUN_ALLOWANCE: ${AGENT_BLOG_PRIVATE_CANARY_EXTRA_DAILY_RUN_ALLOWANCE:-0}
      AGENT_BLOG_PRIVATE_CANARY_MONTHLY_PROVIDER_CALL_LIMIT: ${AGENT_BLOG_PRIVATE_CANARY_MONTHLY_PROVIDER_CALL_LIMIT:-12}
      AGENT_BLOG_PRIVATE_CANARY_MONTHLY_COST_MICROUSD_LIMIT: ${AGENT_BLOG_PRIVATE_CANARY_MONTHLY_COST_MICROUSD_LIMIT:-1000000}
      AGENT_BLOG_PRIVATE_CANARY_FAILURE_THRESHOLD: ${AGENT_BLOG_PRIVATE_CANARY_FAILURE_THRESHOLD:-2}
      NODE_OPTIONS: --max-old-space-size=96
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    cpus: "0.10"
    mem_limit: 128m
    networks: [backend]

  # Read-only, one-shot admission check for the single-Agent private blog canary.
  # It creates no Run and spends no provider budget. The publish flag is rejected
  # when true. Run explicitly with the agent-blog-canary-preflight profile.
  agent-blog-canary-preflight:
    <<: *service-defaults
    profiles: ["agent-blog-canary-preflight"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: "no"
    command: ["node", "apps/api/src/agent-blog-private-canary-preflight-cli.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://gamehub:${POSTGRES_PASSWORD}@postgres:5432/gamehub
      DATABASE_SSL: "false"
      AGENT_BLOG_PRIVATE_CANARY_ENABLED: ${AGENT_BLOG_PRIVATE_CANARY_ENABLED:-false}
      AGENT_BLOG_PRIVATE_CANARY_PUBLISH_ENABLED: ${AGENT_BLOG_PRIVATE_CANARY_PUBLISH_ENABLED:-false}
      AGENT_BLOG_PRIVATE_CANARY_AGENT_USER_ID: ${AGENT_BLOG_PRIVATE_CANARY_AGENT_USER_ID:-}
      AGENT_BLOG_PRIVATE_CANARY_PROVIDER: ${AGENT_BLOG_PRIVATE_CANARY_PROVIDER:-deepseek}
      AGENT_BLOG_PRIVATE_CANARY_MODEL_ID: ${AGENT_BLOG_PRIVATE_CANARY_MODEL_ID:-deepseek-flash}
      AGENT_BLOG_PRIVATE_CANARY_DAILY_RUN_LIMIT: ${AGENT_BLOG_PRIVATE_CANARY_DAILY_RUN_LIMIT:-1}
      AGENT_BLOG_PRIVATE_CANARY_EXTRA_DAILY_RUN_ALLOWANCE: ${AGENT_BLOG_PRIVATE_CANARY_EXTRA_DAILY_RUN_ALLOWANCE:-0}
      AGENT_BLOG_PRIVATE_CANARY_MONTHLY_PROVIDER_CALL_LIMIT: ${AGENT_BLOG_PRIVATE_CANARY_MONTHLY_PROVIDER_CALL_LIMIT:-12}
      AGENT_BLOG_PRIVATE_CANARY_MONTHLY_COST_MICROUSD_LIMIT: ${AGENT_BLOG_PRIVATE_CANARY_MONTHLY_COST_MICROUSD_LIMIT:-1000000}
      AGENT_BLOG_PRIVATE_CANARY_FAILURE_THRESHOLD: ${AGENT_BLOG_PRIVATE_CANARY_FAILURE_THRESHOLD:-2}
      NODE_OPTIONS: --max-old-space-size=64
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    cpus: "0.10"
    mem_limit: 96m
    networks: [backend]

  # Explicit supervised private canary. It has no restart policy, scheduler or
  # publish route. A successful run appends its immutable acceptance report in
  # the same process; use the report-only profile solely for recovery.
  agent-blog-canary-run:
    <<: *service-defaults
    profiles: ["agent-blog-canary-run"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: "no"
    command: ["node", "apps/api/src/agent-blog-private-canary-manual-run-cli.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      DATABASE_URL: postgresql://gamehub:${POSTGRES_PASSWORD}@postgres:5432/gamehub
      DATABASE_SSL: "false"
      AGENT_SECRET_ENCRYPTION_KEY: ${AGENT_SECRET_ENCRYPTION_KEY:-}
      AGENT_BLOG_PRIVATE_CANARY_ENABLED: ${AGENT_BLOG_PRIVATE_CANARY_ENABLED:-false}
      AGENT_BLOG_PRIVATE_CANARY_PUBLISH_ENABLED: ${AGENT_BLOG_PRIVATE_CANARY_PUBLISH_ENABLED:-false}
      AGENT_BLOG_PRIVATE_CANARY_AGENT_USER_ID: ${AGENT_BLOG_PRIVATE_CANARY_AGENT_USER_ID:-}
      AGENT_BLOG_PRIVATE_CANARY_REQUEST_ID: ${AGENT_BLOG_PRIVATE_CANARY_REQUEST_ID:-}
      AGENT_BLOG_PRIVATE_CANARY_PROVIDER: ${AGENT_BLOG_PRIVATE_CANARY_PROVIDER:-deepseek}
      AGENT_BLOG_PRIVATE_CANARY_MODEL_ID: ${AGENT_BLOG_PRIVATE_CANARY_MODEL_ID:-deepseek-flash}
      AGENT_BLOG_PRIVATE_CANARY_DAILY_RUN_LIMIT: ${AGENT_BLOG_PRIVATE_CANARY_DAILY_RUN_LIMIT:-1}
      AGENT_BLOG_PRIVATE_CANARY_EXTRA_DAILY_RUN_ALLOWANCE: ${AGENT_BLOG_PRIVATE_CANARY_EXTRA_DAILY_RUN_ALLOWANCE:-0}
      AGENT_BLOG_PRIVATE_CANARY_MONTHLY_PROVIDER_CALL_LIMIT: ${AGENT_BLOG_PRIVATE_CANARY_MONTHLY_PROVIDER_CALL_LIMIT:-12}
      AGENT_BLOG_PRIVATE_CANARY_MONTHLY_COST_MICROUSD_LIMIT: ${AGENT_BLOG_PRIVATE_CANARY_MONTHLY_COST_MICROUSD_LIMIT:-1000000}
      AGENT_BLOG_PRIVATE_CANARY_FAILURE_THRESHOLD: ${AGENT_BLOG_PRIVATE_CANARY_FAILURE_THRESHOLD:-2}
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: "0.75"
    mem_limit: 256m

  # Durable daily 10:00 Asia/Shanghai private-draft scheduler. It is excluded
  # from the default deployment and needs both the Compose profile and the
  # explicit schedule flag. Three consecutive acceptance passes are required
  # before it creates a schedule; any failed fire suspends that schedule.
  agent-blog-private-scheduler:
    <<: *service-defaults
    profiles: ["agent-blog-private-scheduler"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    command: ["node", "apps/api/src/agent-blog-private-schedule-worker-cli.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      DATABASE_URL: postgresql://gamehub:${POSTGRES_PASSWORD}@postgres:5432/gamehub
      DATABASE_SSL: "false"
      AGENT_SECRET_ENCRYPTION_KEY: ${AGENT_SECRET_ENCRYPTION_KEY:-}
      AGENT_BLOG_PRIVATE_CANARY_ENABLED: ${AGENT_BLOG_PRIVATE_CANARY_ENABLED:-false}
      AGENT_BLOG_PRIVATE_CANARY_PUBLISH_ENABLED: "false"
      AGENT_BLOG_PRIVATE_CANARY_AGENT_USER_ID: ${AGENT_BLOG_PRIVATE_CANARY_AGENT_USER_ID:-}
      AGENT_BLOG_PRIVATE_CANARY_PROVIDER: ${AGENT_BLOG_PRIVATE_CANARY_PROVIDER:-deepseek}
      AGENT_BLOG_PRIVATE_CANARY_MODEL_ID: ${AGENT_BLOG_PRIVATE_CANARY_MODEL_ID:-deepseek-flash}
      AGENT_BLOG_PRIVATE_CANARY_DAILY_RUN_LIMIT: ${AGENT_BLOG_PRIVATE_CANARY_DAILY_RUN_LIMIT:-1}
      AGENT_BLOG_PRIVATE_CANARY_EXTRA_DAILY_RUN_ALLOWANCE: ${AGENT_BLOG_PRIVATE_CANARY_EXTRA_DAILY_RUN_ALLOWANCE:-0}
      AGENT_BLOG_PRIVATE_CANARY_MONTHLY_PROVIDER_CALL_LIMIT: ${AGENT_BLOG_PRIVATE_CANARY_MONTHLY_PROVIDER_CALL_LIMIT:-12}
      AGENT_BLOG_PRIVATE_CANARY_MONTHLY_COST_MICROUSD_LIMIT: ${AGENT_BLOG_PRIVATE_CANARY_MONTHLY_COST_MICROUSD_LIMIT:-1000000}
      AGENT_BLOG_PRIVATE_CANARY_FAILURE_THRESHOLD: ${AGENT_BLOG_PRIVATE_CANARY_FAILURE_THRESHOLD:-2}
      AGENT_BLOG_PRIVATE_SCHEDULE_ENABLED: ${AGENT_BLOG_PRIVATE_SCHEDULE_ENABLED:-false}
      AGENT_BLOG_PRIVATE_SCHEDULE_POLL_MS: ${AGENT_BLOG_PRIVATE_SCHEDULE_POLL_MS:-30000}
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: "0.75"
    mem_limit: 256m

  # Installs the reviewed public workflow contract and adapters only. It never
  # creates a Run, changes publication ownership, changes a schedule, or calls
  # the model/provider.
  agent-blog-public-bootstrap:
    <<: *service-defaults
    profiles: ["agent-blog-public-bootstrap"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: "no"
    command: ["node", "apps/api/src/agent-blog-public-runtime-bootstrap-cli.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    environment: &agent-blog-public-environment
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
      DATABASE_URL: postgresql://gamehub:${POSTGRES_PASSWORD}@postgres:5432/gamehub
      DATABASE_SSL: "false"
      AGENT_BLOG_PUBLIC_RUNTIME_ENABLED: ${AGENT_BLOG_PUBLIC_RUNTIME_ENABLED:-false}
      AGENT_BLOG_PUBLIC_RUNTIME_AGENT_USER_ID: ${AGENT_BLOG_PUBLIC_RUNTIME_AGENT_USER_ID:-}
      AGENT_BLOG_PUBLIC_RUNTIME_REQUEST_ID: ${AGENT_BLOG_PUBLIC_RUNTIME_REQUEST_ID:-}
      AGENT_BLOG_PUBLIC_RUNTIME_PROVIDER: ${AGENT_BLOG_PUBLIC_RUNTIME_PROVIDER:-deepseek}
      AGENT_BLOG_PUBLIC_RUNTIME_MODEL_ID: ${AGENT_BLOG_PUBLIC_RUNTIME_MODEL_ID:-deepseek-flash}
      AGENT_BLOG_PUBLIC_RUNTIME_DAILY_RUN_LIMIT: ${AGENT_BLOG_PUBLIC_RUNTIME_DAILY_RUN_LIMIT:-1}
      AGENT_BLOG_PUBLIC_RUNTIME_MONTHLY_PROVIDER_CALL_LIMIT: ${AGENT_BLOG_PUBLIC_RUNTIME_MONTHLY_PROVIDER_CALL_LIMIT:-120}
      AGENT_BLOG_PUBLIC_RUNTIME_MONTHLY_COST_MICROUSD_LIMIT: ${AGENT_BLOG_PUBLIC_RUNTIME_MONTHLY_COST_MICROUSD_LIMIT:-10000000}
      AGENT_BLOG_PUBLIC_RUNTIME_FAILURE_THRESHOLD: ${AGENT_BLOG_PUBLIC_RUNTIME_FAILURE_THRESHOLD:-2}
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    cpus: "0.25"
    mem_limit: 192m

  # Read-only admission check. It requires Foundation ownership, disabled
  # legacy automation, reviewed capabilities/contracts, a healthy model circuit,
  # and empty active/uncertain execution sets.
  agent-blog-public-preflight:
    <<: *service-defaults
    profiles: ["agent-blog-public-preflight"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: "no"
    command: ["node", "apps/api/src/agent-blog-public-runtime-preflight-cli.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    environment: *agent-blog-public-environment
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    cpus: "0.10"
    mem_limit: 96m

  # Explicit one-shot public execution. This remains outside the default
  # deployment and cannot publish unless the serialized owner is Foundation.
  agent-blog-public-run:
    <<: *service-defaults
    profiles: ["agent-blog-public-run"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: "no"
    command: ["node", "apps/api/src/agent-blog-public-runtime-manual-run-cli.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    environment:
      <<: *agent-blog-public-environment
      AGENT_SECRET_ENCRYPTION_KEY: ${AGENT_SECRET_ENCRYPTION_KEY:-}
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    cpus: "0.75"
    mem_limit: 256m

  # Deterministic post-run attestation. It performs no network or model calls
  # and appends one immutable, content-free report for the selected draft Run.
  agent-blog-canary-report:
    <<: *service-defaults
    profiles: ["agent-blog-canary-report"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: "no"
    command: ["node", "apps/api/src/agent-blog-canary-acceptance-cli.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=64
      DATABASE_URL: postgresql://gamehub:${POSTGRES_PASSWORD}@postgres:5432/gamehub
      DATABASE_SSL: "false"
      AGENT_BLOG_PRIVATE_CANARY_AGENT_USER_ID: ${AGENT_BLOG_PRIVATE_CANARY_AGENT_USER_ID:-}
      AGENT_BLOG_PRIVATE_CANARY_DRAFT_RUN_ID: ${AGENT_BLOG_PRIVATE_CANARY_DRAFT_RUN_ID:-}
    networks: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 16
    cpus: "0.10"
    mem_limit: 96m

  rules-operator:
    <<: *service-defaults
    profiles: [rules-operations]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rules-operator
    volumes:
      - ../rules:/data/rules
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 32
    cpus: "0.5"
    mem_limit: 128m

  worker:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment: *api-environment
    command: ["node", "apps/api/src/validation-worker-cli.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      validator: { condition: service_healthy }
    volumes:
      - community-media:/data/community-media
      - community-processor:/data/community-processor
      - quarantine:/data/quarantine:ro
      - runtime-assets:/data/runtime
      - validator:/data/validator
      - avatars:/data/avatars
      - covers:/data/covers
    networks: [backend]
    mem_limit: 512m

  runtime:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment: *api-environment
    command: ["node", "apps/api/src/runtime-edge-server.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes:
      - runtime-assets:/data/runtime:ro
      - avatars:/data/avatars
      - covers:/data/covers
      - quarantine:/data/quarantine
      - validator:/data/validator
    networks: [backend]
    mem_limit: 256m

  # Enable after save rollout acceptance: COMPOSE_PROFILES=save-operations.
  save-storage-probe:
    <<: *service-defaults
    image: postgres:16.10-alpine
    profiles: [save-operations]
    user: postgres
    entrypoint: ["sh", "/opt/save-storage-probe.sh"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: gamehub
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: gamehub
      PGDATA: /var/lib/postgresql/data
      PGCONNECT_TIMEOUT: "3"
      PGOPTIONS: "-c statement_timeout=3000"
    volumes:
      - postgres-data:/var/lib/postgresql/data:ro
      - ./save-storage-probe.sh:/opt/save-storage-probe.sh:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]
    mem_limit: 64m
    cpus: 0.10
    healthcheck:
      test: ["CMD-SHELL", "psql -XAtqc \"SELECT observed_at>clock_timestamp()-interval '90 seconds' FROM game_save_storage_status WHERE singleton\" | grep -qx t"]
      interval: 30s
      timeout: 5s
      retries: 3

  save-maintenance:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    profiles: [save-operations]
    command: ["node", "apps/api/src/save-maintenance-worker-cli.mjs"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    environment:
      DATABASE_URL: postgresql://gamehub:${POSTGRES_PASSWORD}@postgres:5432/gamehub
      DATABASE_SSL: "false"
      NODE_OPTIONS: --max-old-space-size=64
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]
    mem_limit: 128m
    cpus: 0.15
    healthcheck:
      test: ["CMD", "node", "apps/api/src/save-maintenance-worker-cli.mjs", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_RUNTIME_DOMAIN: ${RUNTIME_DOMAIN}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      RUNTIME_DOMAIN: ${RUNTIME_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
    depends_on:
      api: { condition: service_healthy }
      realtime: { condition: service_healthy }
      runtime: { condition: service_started }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]
    mem_limit: 128m

networks:
  backend:

volumes:
  community-media:
  community-processor:
  postgres-data:
  redis-data:
  avatars:
  covers:
  quarantine:
  runtime-assets:
  research-soak-reports:
  validator:
  source-builder:
  source-worker:
  rule-builder:
  rule-worker:
  caddy-data:
  caddy-config:
