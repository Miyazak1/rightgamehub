name: gamehub-production

x-api-environment: &api-environment
  NODE_ENV: production
  API_HOST: 0.0.0.0
  API_PORT: 3090
  DATABASE_URL: postgresql://gamehub:${POSTGRES_PASSWORD}@postgres:5432/gamehub
  DATABASE_SSL: "false"
  REDIS_URL: redis://redis:6379
  REALTIME_PUBLIC_URL: wss://${APP_DOMAIN}/v1/realtime
  REALTIME_TICKET_TTL_SECONDS: "30"
  OTP_HMAC_KEY: ${OTP_HMAC_KEY}
  ROOM_CODE_HMAC_KEY: ${ROOM_CODE_HMAC_KEY:-}
  RULES_MANIFEST_PATH: ${RULES_MANIFEST_PATH:-}
  RULES_TRUSTED_KEYS_JSON: ${RULES_TRUSTED_KEYS_JSON:-}
  CORS_ORIGINS: https://${APP_DOMAIN},http://127.0.0.1:3080,http://localhost:3080,http://127.0.0.1:3081
  TRUST_EDITOR_WEBVIEWS: "true"
  MAIL_PROVIDER: resend
  RESEND_API_KEY: ${RESEND_API_KEY}
  MAIL_FROM: ${MAIL_FROM}
  LOGIN_EMAIL_ALLOWLIST: ${LOGIN_EMAIL_ALLOWLIST:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
  GITHUB_SOURCE_IMPORT_ENABLED: ${GITHUB_SOURCE_IMPORT_ENABLED:-false}
  GITHUB_APP_ID: ${GITHUB_APP_ID:-}
  GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:-}
  GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
  GITHUB_APP_CALLBACK_URL: ${GITHUB_APP_CALLBACK_URL:-}
  GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
  GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
  SOURCE_BUILD_ENABLED: ${SOURCE_BUILD_ENABLED:-false}
  SOURCE_BUILDER_ROOT: /data/builder
  SOURCE_BUILD_WORKING_ROOT: /data/source-worker
  SOURCE_BUILDER_EXECUTION_MODE: isolated
  SOURCE_BUILDER_IMAGE_DIGEST: ${SOURCE_BUILDER_IMAGE_DIGEST:-}
  RULE_BUILD_ENABLED: ${RULE_BUILD_ENABLED:-false}
  RULE_BUILDER_ROOT: /data/rule-builder
  RULE_BUILD_WORKING_ROOT: /data/rule-worker
  RULE_BUILDER_EXECUTION_MODE: isolated
  RULE_BUILDER_IMAGE_DIGEST: ${RULE_BUILDER_IMAGE_DIGEST:-}
  QUARANTINE_ROOT: /data/quarantine
  AVATAR_ROOT: /data/avatars
  COVER_ROOT: /data/covers
  RUNTIME_ROOT: /data/runtime
  VALIDATOR_ROOT: /data/validator
  VALIDATOR_EXECUTION_MODE: isolated
  SAVE_STORAGE_REQUIRED: "true"
  SAVE_STORAGE_MAX_AGE_SECONDS: ${SAVE_STORAGE_MAX_AGE_SECONDS:-90}
  SAVE_STORAGE_MIN_FREE_BYTES: ${SAVE_STORAGE_MIN_FREE_BYTES:-1073741824}
  SAVE_STORAGE_MAX_USED_PERCENT: ${SAVE_STORAGE_MAX_USED_PERCENT:-85}
  SAVE_STORAGE_MIN_FREE_INODE_PERCENT: ${SAVE_STORAGE_MIN_FREE_INODE_PERCENT:-5}
  SAVE_STORAGE_MAX_WAL_BYTES: ${SAVE_STORAGE_MAX_WAL_BYTES:-2147483648}
  STORAGE_WARN_PERCENT: "70"
  STORAGE_BLOCK_PERCENT: "85"
  STORAGE_MONITOR_INTERVAL_SECONDS: "60"
  RUNTIME_DOMAIN: ${RUNTIME_DOMAIN}
  RUNTIME_SCHEME: https
  GUESS_BAIKE_AUTOMATION_ENABLED: "true"
  GUESS_BAIKE_WIKIPEDIA_USER_AGENT: "${GUESS_BAIKE_WIKIPEDIA_USER_AGENT:-GameHub-GuessBaikeBot/0.3 (https://mooyu.fun/; automated daily puzzle) Node.js}"
  NODE_OPTIONS: --max-old-space-size=320

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    mem_limit: 160m

  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamehub
      POSTGRES_USER: gamehub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamehub -d gamehub"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]
    mem_limit: 640m

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment: *api-environment
    command: ["node", "apps/api/src/migrate-cli.mjs"]
    depends_on:
      postgres: { condition: service_healthy }
    volumes:
      - avatars:/data/avatars
      - covers:/data/covers
      - quarantine:/data/quarantine
      - runtime-assets:/data/runtime
      - validator:/data/validator
    networks: [backend]
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment: *api-environment
    command: ["node", "apps/api/src/server.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - ../rules:/app/rules:ro
      - avatars:/data/avatars
      - covers:/data/covers
      - quarantine:/data/quarantine
      - runtime-assets:/data/runtime
      - validator:/data/validator
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3090/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]
    mem_limit: 384m

  realtime:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.realtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      REALTIME_HOST: 0.0.0.0
      REALTIME_PORT: 3093
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://gamehub:${POSTGRES_PASSWORD}@postgres:5432/gamehub
      DATABASE_SSL: "false"
      REALTIME_RECONNECT_GRACE_MS: "120000"
      REALTIME_MATCH_TIMEOUT_SWEEP_MS: "1000"
      REALTIME_MATCH_TIMEOUT_BATCH_SIZE: "50"
      REALTIME_ALLOWED_ORIGINS: https://${APP_DOMAIN},http://127.0.0.1:3080,http://localhost:3080,http://127.0.0.1:3081
      TRUST_EDITOR_WEBVIEWS: "true"
      RULES_MANIFEST_PATH: ${RULES_MANIFEST_PATH:-}
      RULES_TRUSTED_KEYS_JSON: ${RULES_TRUSTED_KEYS_JSON:-}
    depends_on:
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    volumes:
      - ../rules:/app/rules:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3093/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]
    mem_limit: 192m

  validator:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.validator
    restart: unless-stopped
    environment:
      NODE_ENV: production
      QUARANTINE_ROOT: /data/quarantine
      VALIDATOR_ROOT: /data/validator
      NODE_OPTIONS: --max-old-space-size=256
    command: ["node", "apps/api/src/web-validator-service.mjs"]
    volumes:
      - quarantine:/data/quarantine:ro
      - validator:/data/validator
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 64
    cpus: "1.0"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').statSync('/data/validator/service.ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  source-builder:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.builder
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SOURCE_BUILDER_ROOT: /data/builder
      NODE_OPTIONS: --max-old-space-size=1536
    volumes:
      - source-builder:/data/builder
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 128
    cpus: "2.0"
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').statSync('/data/builder/service.ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  source-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment: *api-environment
    command: ["node", "apps/api/src/source-build-worker-cli.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      source-builder: { condition: service_healthy }
    volumes:
      - quarantine:/data/quarantine
      - runtime-assets:/data/runtime
      - validator:/data/validator
      - source-builder:/data/builder
      - source-worker:/data/source-worker
      - avatars:/data/avatars
      - covers:/data/covers
    networks: [backend]
    mem_limit: 512m

  rule-builder:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rule-builder
    restart: unless-stopped
    environment:
      NODE_ENV: production
      RULE_BUILDER_ROOT: /data/rule-builder
      NODE_OPTIONS: --max-old-space-size=384
    volumes:
      - rule-builder:/data/rule-builder
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 64
    cpus: "1.0"
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:fs').statSync('/data/rule-builder/service.ready')"]
      interval: 5s
      timeout: 3s
      retries: 20

  rule-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment: *api-environment
    command: ["node", "apps/api/src/multiplayer-rule-build-worker-cli.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      rule-builder: { condition: service_healthy }
    volumes:
      - quarantine:/data/quarantine
      - rule-builder:/data/rule-builder
      - rule-worker:/data/rule-worker
    networks: [backend]
    mem_limit: 384m

  rules-operator:
    profiles: [rules-operations]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.rules-operator
    volumes:
      - ../rules:/data/rules
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    pids_limit: 32
    cpus: "0.5"
    mem_limit: 128m

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment: *api-environment
    command: ["node", "apps/api/src/validation-worker-cli.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      validator: { condition: service_healthy }
    volumes:
      - quarantine:/data/quarantine:ro
      - runtime-assets:/data/runtime
      - validator:/data/validator
      - avatars:/data/avatars
      - covers:/data/covers
    networks: [backend]
    mem_limit: 512m

  runtime:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    environment: *api-environment
    command: ["node", "apps/api/src/runtime-edge-server.mjs"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    volumes:
      - runtime-assets:/data/runtime:ro
      - avatars:/data/avatars
      - covers:/data/covers
      - quarantine:/data/quarantine
      - validator:/data/validator
    networks: [backend]
    mem_limit: 256m

  # Enable after save rollout acceptance: COMPOSE_PROFILES=save-operations.
  save-storage-probe:
    image: postgres:16.10-alpine
    profiles: [save-operations]
    user: postgres
    entrypoint: ["sh", "/opt/save-storage-probe.sh"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: gamehub
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: gamehub
      PGDATA: /var/lib/postgresql/data
      PGCONNECT_TIMEOUT: "3"
      PGOPTIONS: "-c statement_timeout=3000"
    volumes:
      - postgres-data:/var/lib/postgresql/data:ro
      - ./save-storage-probe.sh:/opt/save-storage-probe.sh:ro
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]
    mem_limit: 64m
    cpus: 0.10
    healthcheck:
      test: ["CMD-SHELL", "psql -XAtqc \"SELECT observed_at>clock_timestamp()-interval '90 seconds' FROM game_save_storage_status WHERE singleton\" | grep -qx t"]
      interval: 30s
      timeout: 5s
      retries: 3

  save-maintenance:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    profiles: [save-operations]
    command: ["node", "apps/api/src/save-maintenance-worker-cli.mjs"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 32
    environment:
      DATABASE_URL: postgresql://gamehub:${POSTGRES_PASSWORD}@postgres:5432/gamehub
      DATABASE_SSL: "false"
      NODE_OPTIONS: --max-old-space-size=64
    depends_on:
      migrate: { condition: service_completed_successfully }
    networks: [backend]
    mem_limit: 128m
    cpus: 0.15
    healthcheck:
      test: ["CMD", "node", "apps/api/src/save-maintenance-worker-cli.mjs", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_RUNTIME_DOMAIN: ${RUNTIME_DOMAIN}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      RUNTIME_DOMAIN: ${RUNTIME_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      ALIYUN_ACCESS_KEY_ID: ${ALIYUN_ACCESS_KEY_ID}
      ALIYUN_ACCESS_KEY_SECRET: ${ALIYUN_ACCESS_KEY_SECRET}
    depends_on:
      api: { condition: service_healthy }
      realtime: { condition: service_healthy }
      runtime: { condition: service_started }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [backend]
    mem_limit: 128m

networks:
  backend:

volumes:
  postgres-data:
  redis-data:
  avatars:
  covers:
  quarantine:
  runtime-assets:
  validator:
  source-builder:
  source-worker:
  rule-builder:
  rule-worker:
  caddy-data:
  caddy-config:
