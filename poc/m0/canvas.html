<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; connect-src 'none'">
<title>GameHub 2D sample</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#e5edf8;font:14px system-ui;padding:12px}h3{margin:0 0 6px}p{font-size:12px}canvas{display:block;width:100%;height:230px;border-radius:8px;background:#172337;touch-action:none}button{padding:7px 12px;color:#fff;border:1px solid #607089;border-radius:6px;background:#25364e;margin-top:8px}
</style></head><body>
<h3>收集星星 · 2D</h3><p>点击星星得分；点击画布后可用方向键移动光点。</p>
<canvas width="640" height="360" tabindex="0" aria-label="2D 游戏画布"></canvas>
<button id="sound">开启声音</button><span id="score" role="status"> 得分 0</span>
<script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
let score=0,x=160,y=180,starX=320,starY=180,audio=null,sound=false,frame=0;
const held=new Set();
const scoreLine=document.getElementById('score');
canvas.addEventListener('keydown',e=>{if(e.key.startsWith('Arrow')){e.preventDefault();held.add(e.key);}});
canvas.addEventListener('keyup',e=>held.delete(e.key));
canvas.addEventListener('blur',()=>held.clear());
document.getElementById('sound').onclick=async()=>{
  try{audio??=new AudioContext();await audio.resume();sound=!sound;document.getElementById('sound').textContent=sound?'关闭声音':'开启声音';}
  catch{document.getElementById('sound').textContent='当前环境声音不可用';}
};
canvas.addEventListener('pointerdown',e=>{
  canvas.focus();const r=canvas.getBoundingClientRect();
  const px=(e.clientX-r.left)*640/r.width,py=(e.clientY-r.top)*360/r.height;
  if(Math.hypot(px-starX,py-starY)<34){
    score++;scoreLine.textContent=' 得分 '+score;
    if(sound&&audio){const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=660;g.gain.setValueAtTime(.08,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.13);}
    starX=50+Math.random()*540;starY=50+Math.random()*260;
  }
});
function draw(){
  x=Math.max(12,Math.min(628,x+(held.has('ArrowRight')?3:0)-(held.has('ArrowLeft')?3:0)));
  y=Math.max(12,Math.min(348,y+(held.has('ArrowDown')?3:0)-(held.has('ArrowUp')?3:0)));
  ctx.clearRect(0,0,640,360);ctx.fillStyle='#22334d';
  for(let i=0;i<640;i+=40)for(let j=0;j<360;j+=40)ctx.fillRect(i,j,2,2);
  ctx.fillStyle='#f7c96b';ctx.beginPath();ctx.arc(starX,starY,24+Math.sin(frame/12)*3,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#78c8ec';ctx.beginPath();ctx.arc(x,y,12,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#adc0dd';ctx.font='16px system-ui';ctx.fillText('Frame '+(++frame),12,24);requestAnimationFrame(draw);
}draw();
window.addEventListener('pagehide',()=>{held.clear();audio?.close();});
</script></body></html>
