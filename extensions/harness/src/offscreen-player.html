<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameHub 离屏运行样本</title>
<style nonce="__NONCE__">
*{box-sizing:border-box}body{margin:0;background:#101827;color:#edf4ff;font:13px system-ui;padding:12px;line-height:1.6}
h3{margin:0 0 6px}p{margin:6px 0}canvas{display:block;width:100%;height:auto;outline:2px solid transparent;border-radius:8px;touch-action:none;background:#101827}canvas:focus{outline-color:#67e8f9}
button,input{font:inherit;border:1px solid #61738a;border-radius:6px;padding:7px 10px}button{cursor:pointer;background:#243750;color:#fff}button:disabled{opacity:.5;cursor:default}input{min-width:0;flex:1;background:#192739;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}small{color:#a9bad0}
</style></head><body>
<h3>离屏运行样本</h3>
<p>点击黄色圆点计分；点击画面后，用方向键移动蓝色光点。</p>
<small>自有适配样本 · 暂无声音 · 单次最长 5 分钟</small>
<canvas id="surface" width="640" height="360" tabindex="0" role="application" aria-label="离屏游戏操作区"></canvas>
<div class="row"><input id="name" maxlength="40" aria-label="样本名称" placeholder="输入新的样本名称"><button id="rename">修改名称</button></div>
<div class="row"><button id="release">释放操作</button><button id="reset">重置本局</button><button id="stop">结束样本</button></div>
<p id="status" role="status" aria-live="polite">正在接收画面…</p>
<script nonce="__NONCE__">
'use strict';
const routes = __ROUTES__;
const endpoint = (name, after) => { const url = new URL(routes[name], location.href); if (after) url.searchParams.set('after', after); return url.href; };
const surface = document.getElementById('surface'), ctx = surface.getContext('2d'), status = document.getElementById('status');
const held = new Set(), keys = new Set(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown']);
let stopped = false, lastId = '', queue = Promise.resolve(), waiting = 0, timer, controller, received = [];
async function stop(message = '样本已结束。') {
  if (stopped) return;
  stopped = true; held.clear(); clearTimeout(timer); controller?.abort();
  document.querySelectorAll('button,input').forEach(element => { element.disabled = true; });
  ctx.clearRect(0, 0, 640, 360); status.textContent = message;
  try {
    const response = await fetch(endpoint('stop'), { method:'POST', headers:{'X-GameHub-Input':'1'}, credentials:'same-origin', keepalive:true });
    if (!response.ok && response.status !== 410) status.textContent = '结束请求未确认，请使用外层“结束游戏”。';
  } catch { status.textContent = '连接已断开，后台将自动回收会话。'; }
}
function send(command) {
  if (stopped) return;
  if (waiting >= 16) { void stop('操作队列拥堵，已结束样本，请重新开始。'); return; }
  waiting++;
  queue = queue.then(async () => {
    if (stopped) return;
    const response = await fetch(endpoint('input'), { method:'POST', headers:{'Content-Type':'application/json','X-GameHub-Input':'1'},
      credentials:'same-origin', body:JSON.stringify(command), signal:AbortSignal.timeout(5000), keepalive:command.type==='release' });
    const result = await response.json();
    if (!response.ok || !result.ok) throw new Error(result.error || '操作未完成');
  }).catch(error => { void stop('操作连接中断：' + error.message); }).finally(() => { waiting--; });
}
function release() { held.clear(); send({type:'release'}); }
surface.addEventListener('pointerdown', event => {
  if (event.button !== 0 || stopped) return;
  event.preventDefault(); surface.focus({preventScroll:true});
  const rect = surface.getBoundingClientRect();
  send({type:'click',x:Math.min(639.999,Math.max(0,(event.clientX-rect.left)*640/rect.width)),
    y:Math.min(359.999,Math.max(0,(event.clientY-rect.top)*360/rect.height))});
});
surface.addEventListener('keydown', event => {
  if (!keys.has(event.key) || event.altKey || event.ctrlKey || event.metaKey || stopped) return;
  event.preventDefault(); if (held.has(event.key)) return; held.add(event.key); send({type:'key',key:event.key,down:true});
});
surface.addEventListener('keyup', event => {
  if (!keys.has(event.key)) return; event.preventDefault(); held.delete(event.key); send({type:'key',key:event.key,down:false});
});
surface.addEventListener('blur', release); surface.addEventListener('pointercancel', release); window.addEventListener('blur', release);
window.addEventListener('pagehide', () => { void stop(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') void stop('页面已隐藏，样本已结束。'); });
document.getElementById('release').onclick = release;
document.getElementById('reset').onclick = () => { held.clear(); send({type:'reset'}); };
document.getElementById('rename').onclick = () => send({type:'text',value:document.getElementById('name').value});
document.getElementById('stop').onclick = () => { void stop(); };
async function update() {
  if (stopped) return;
  const start = performance.now(); controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 5000);
  try {
    const response = await fetch(endpoint('frame', lastId), {cache:'no-store',credentials:'same-origin',signal:controller.signal});
    if (stopped) return;
    if (!response.ok) throw new Error('会话已结束或连接中断');
    if (Number(response.headers.get('X-Frame-Age')) > 2000) throw new Error('游戏画面停止更新');
    if (response.status !== 204) {
      const bitmap = await createImageBitmap(await response.blob());
      if (!stopped) { ctx.drawImage(bitmap,0,0,640,360); lastId = response.headers.get('X-Frame'); received.push(performance.now()); }
      bitmap.close();
    }
    received = received.filter(time => performance.now()-time < 1000);
    if (!stopped) status.textContent = `画面已连接 · 最近一秒 ${received.length} 帧 · 点击画面后可操作`;
  } catch (error) { if (!stopped) void stop(error.message); }
  finally { clearTimeout(timeout); if (!stopped) timer = setTimeout(update,Math.max(0,33-(performance.now()-start))); }
}
void update();
</script></body></html>
